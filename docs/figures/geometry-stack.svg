<title id="t">UOR-R4 geometric primitives and their roles</title>
<desc id="d">Seven geometric primitives from prime addressing to chirality and polarity, with the role each plays and whether it is implemented, used in a trained model and served. Quaternion state and transport is the only primitive trained and served in the stack. Measured predictive advantage over a plain recurrence is not established.</desc>
