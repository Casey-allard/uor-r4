<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img">
<title>Relation read</title>
<desc>Three panels on the sequence x A B y z A, where the last A is the query. Panel 1: the earlier A has match score 8. Panel 2: a successor dial set to plus one passes that score to B, which then ranks first. Panel 3: with every dial at zero all scores are zero and the ranking is the Flock order. Below: the 25 ternary dials, five link types by five tree levels, with only the level-0 successor dial on.</desc>
<style>
svg { --bg:#ffffff; --ink:#1f2328; --body:#2b3138; --muted:#57606a; --rule:#d0d7de; --panel:#f6f8fa;
      --blue:#0072b2; --sky:#56b4e9; --green:#007a5e; --orange:#e69f00; --verm:#d55e00; --purple:#7a4fa3; --pink:#cc79a7;
      --active:#007a5e; --ready:#b06d00; --parked:#7a4fa3; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --ink:#e6edf3; --body:#c9d1d9; --muted:#8b949e; --rule:#30363d; --panel:#161b22;
      --blue:#58a6ff; --sky:#79c0ff; --green:#3fb950; --orange:#f0b72f; --verm:#ff7b72; --purple:#bc8cff; --pink:#f778ba;
      --active:#3fb950; --ready:#f0b72f; --parked:#bc8cff; } }
.bg { fill: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
.ti { font-size: 19px; font-weight: 600; }
.h { font-size: 14px; font-weight: 600; }
.big { font-size: 20px; font-weight: 600; }
.n { font-size: 12px; fill: var(--muted); }
.m { fill: var(--muted); }
.b { font-weight: 600; }
.c { text-anchor: middle; }
.r { text-anchor: end; }
.panel { fill: var(--panel); stroke: var(--rule); stroke-width: 1; }
.box { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; }
.cell { fill: var(--bg); stroke: var(--rule); stroke-width: 1; }
.ln { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.rl { stroke: var(--rule); stroke-width: 1; fill: none; }
.dash { stroke-dasharray: 5 4; }
.dot { stroke-dasharray: 2 3; }
.fi { fill: var(--ink); } .fm { fill: var(--muted); } .fb { fill: var(--blue); } .fg { fill: var(--green); }
.fo { fill: var(--orange); } .fv { fill: var(--verm); } .fp { fill: var(--purple); } .fs { fill: var(--sky); } .fk { fill: var(--pink); }
.si { stroke: var(--ink); } .sm { stroke: var(--muted); } .sb { stroke: var(--blue); } .sg { stroke: var(--green); }
.so { stroke: var(--orange); } .sv { stroke: var(--verm); } .sp { stroke: var(--purple); } .ss { stroke: var(--sky); }
.w2 { stroke-width: 2; } .w15 { stroke-width: 1.5; } .w1 { stroke-width: 1; } .nf { fill: none; }
</style>
<defs>
