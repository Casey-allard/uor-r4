<rect class="barlit" x="566" y="282" width="38" height="7" rx="1"/>
<text class="body" x="532" y="314">lit bar equal or higher</text>
<path class="cross" d="M533 330l11 11m0-11l-11 11"/>
<text class="b" x="558" y="340">refuse</text>
<text class="n" x="532" y="360">nothing changes</text>

<text class="h" x="768" y="76">4 validate</text>
<circle class="ring" cx="844" cy="150" r="28"/>
<path class="tick" d="M831 150l9 10l17-21"/>
<text class="body c" x="844" y="210">re-check the stored</text>
<text class="body c" x="844" y="228">table on the GPU</text>

<path class="arrow" d="M844 400V424H160V403" marker-end="url(#ah)"/>
<text class="body c" x="502" y="445">next coordinate: block, route frame or gate</text>

<text class="h" x="24" y="482">Measured cost of one proposal (Route read, 64 rows)</text>
<text class="body" x="24" y="510">serial, one proposal</text>
<rect class="bar" x="250" y="500" width="480" height="12" rx="2"/>
<text class="b" x="738" y="510">3.843 s</text>
<text class="body" x="24" y="536">row-parallel</text>
<rect class="barlit" x="250" y="526" width="8.63" height="12" rx="2"/>
<text class="b" x="268" y="536">0.0691 s (55.6 times faster)</text>
<text class="n" x="24" y="562">Cell grid and bar lengths in the loop are illustrative; the two timings are measured.</text>
</svg>
