<text class="body" x="532" y="160">lit bar strictly lower</text>
<path class="tick" d="M533 184l5 6l11-13"/>
<text class="b" x="558" y="190">commit</text>
<text class="n" x="532" y="208">entry takes the lit state</text>
<text class="n c" x="614" y="236">or</text>
<rect class="cardB" x="520" y="246" width="188" height="126" rx="6"/>
<text class="n" x="532" y="268">stay</text>
<rect class="bar" x="566" y="262" width="38" height="7" rx="1"/>
