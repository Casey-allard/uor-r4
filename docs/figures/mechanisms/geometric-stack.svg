<text class="b mid" x="551" y="712">r  recurrence</text><text class="n mid" x="551" y="730">scan: allowed</text>
<rect class="bx-ok" x="632" y="694" width="138" height="46" rx="4"/>
<text class="b mid" x="701" y="712">r  recurrence</text><text class="n mid" x="701" y="730">scan: allowed</text>
<rect class="bx-ban" x="782" y="694" width="138" height="46" rx="4"/>
<text class="b mid" x="851" y="712">a  read</text><text class="n mid" x="851" y="730">softmax: banned</text>
<rect class="bx-ban" x="32" y="750" width="138" height="40" rx="4"/><text class="s mid" x="101" y="767">feed-forward</text><text class="n mid" x="101" y="782">SwiGLU: banned</text>
<rect class="bx-ban" x="182" y="750" width="138" height="40" rx="4"/><text class="s mid" x="251" y="767">feed-forward</text><text class="n mid" x="251" y="782">SwiGLU: banned</text>
<rect class="bx-ban" x="332" y="750" width="138" height="40" rx="4"/><text class="s mid" x="401" y="767">feed-forward</text><text class="n mid" x="401" y="782">SwiGLU: banned</text>
<rect class="bx-ban" x="482" y="750" width="138" height="40" rx="4"/><text class="s mid" x="551" y="767">feed-forward</text><text class="n mid" x="551" y="782">SwiGLU: banned</text>
<rect class="bx-ban" x="632" y="750" width="138" height="40" rx="4"/><text class="s mid" x="701" y="767">feed-forward</text><text class="n mid" x="701" y="782">SwiGLU: banned</text>
<rect class="bx-ban" x="782" y="750" width="138" height="40" rx="4"/><text class="s mid" x="851" y="767">feed-forward</text><text class="n mid" x="851" y="782">SwiGLU: banned</text>
<line class="flow" x1="32" y1="806" x2="926" y2="806"/>
<text class="n" x="32" y="824">Layers run left to right in a residual stream, with RMS normalisation between blocks.</text>

<text class="b c-verm" x="32" y="860">Banned</text>
<rect class="chip-ban" x="150" y="840" width="118" height="30" rx="5"/><text class="l mid" x="209" y="860">softmax read</text>
<rect class="chip-ban" x="278" y="840" width="153" height="30" rx="5"/><text class="l mid" x="354.5" y="860">sigmoid decay gate</text>
<rect class="chip-ban" x="441" y="840" width="146" height="30" rx="5"/><text class="l mid" x="514" y="860">SiLU feed-forward</text>
<rect class="chip-ban" x="597" y="840" width="138" height="30" rx="5"/><text class="l mid" x="666" y="860">GELU output gate</text>
<rect class="chip-ban" x="745" y="840" width="146" height="30" rx="5"/><text class="l mid" x="818" y="860">dense projections</text>

<text class="b c-green" x="32" y="900">Allowed</text>
<rect class="chip-ok" x="150" y="880" width="267" height="30" rx="5"/><text class="l mid" x="283.5" y="900">quaternion scan (Hamilton product)</text>
<rect class="chip-ok" x="427" y="880" width="181" height="30" rx="5"/><text class="l mid" x="517.5" y="900">rank-margin hinge loss</text>

<text class="b c-muted" x="32" y="940">Neither</text>
<rect class="chip-no" x="150" y="920" width="146" height="30" rx="5"/><text class="l mid" x="223" y="940">RMS normalisation</text>
<text class="n" x="308" y="940">not banned, but no integer form recorded</text>

<text class="b c-blue" x="32" y="980">Replacements</text>
<rect class="chip-rep" x="150" y="960" width="181" height="30" rx="5"/><text class="l mid" x="240.5" y="980">SwiGLU → Hamilton gate</text>
<rect class="chip-rep" x="341" y="960" width="203" height="30" rx="5"/><text class="l mid" x="442.5" y="980">softmax read → flock read</text>
<rect class="chip-rep" x="554" y="960" width="317" height="30" rx="5"/><text class="l mid" x="712.5" y="980">dense projections → SpiralCore projection</text>
<text class="n" x="32" y="1016">Solid outline: status in the trained stack. Dashed outline: allowed replacement from another mechanism page, not part of the trained stack.</text>
</svg>
