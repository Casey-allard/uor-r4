<rect class="bg" x="0" y="0" width="960" height="556"/>
<text class="title" x="24" y="32">Why rounding breaks protected answers</text>

<rect class="panel" x="24" y="52" width="576" height="468" rx="8"/>
<rect class="panel" x="620" y="52" width="316" height="468" rx="8"/>

<text class="h" x="40" y="76">One coefficient on the legal grid</text>
<rect class="bad" x="443.4" y="172" width="125" height="90"/>
<path class="guard" d="M443.4 168V264"/>
<text class="b c" x="443" y="162">guard of answer 3</text>
<path class="axis" d="M48 250H568"/>
<path class="axis" d="M56 243v14M92 243v14M128 243v14M164 243v14M200 243v14M236 243v14M272 243v14M308 243v14M344 243v14M380 243v14M416 243v14M452 243v14M488 243v14M524 243v14M560 243v14"/>
<text class="n c" x="56" y="277">−7/4</text>
<text class="n c" x="92" y="277">−6/4</text>
<text class="n c" x="128" y="277">−5/4</text>
<text class="n c" x="164" y="277">−4/4</text>
<text class="n c" x="200" y="277">−3/4</text>
<text class="n c" x="236" y="277">−2/4</text>
<text class="n c" x="272" y="277">−1/4</text>
<text class="n c" x="308" y="277">0</text>
<text class="n c" x="344" y="277">1/4</text>
<text class="n c" x="380" y="277">2/4</text>
<text class="n c" x="416" y="277">3/4</text>
<text class="n c" x="452" y="277">4/4</text>
<text class="n c" x="488" y="277">5/4</text>
<text class="n c" x="524" y="277">6/4</text>
<text class="n c" x="560" y="277">7/4</text>
<text class="n c" x="308" y="299">15 legal quarter-step values: q/4 with q from −7 to +7</text>
<circle class="mdot" cx="351.2" cy="250" r="5.5"/>
<text class="body e" x="338" y="222">master value</text>
<text class="n e" x="338" y="236">(unrounded)</text>
<path class="step" d="M355 243Q393 196 430 243" marker-end="url(#ahb)"/>
<text class="body c" x="393" y="207">smooth step</text>
<circle class="sdot" cx="434.7" cy="250" r="5"/>
<path class="snap" d="M437 243Q444 222 450 243" marker-end="url(#ahv)"/>
<text class="n" x="462" y="216">snaps to the</text>
<text class="n" x="462" y="230">nearest tick</text>

<text class="h" x="40" y="326">Protected answers (380 original winners in the run)</text>
<rect class="card" x="40" y="338" width="262" height="112" rx="6"/>
<rect class="card" x="322" y="338" width="262" height="112" rx="6"/>
<text class="b" x="52" y="360">smooth value: all guards hold</text>
<text class="b" x="334" y="360">rounded value: guard 3 broken</text>
<rect class="icon" x="56" y="372" width="38" height="38" rx="6"/>
<path class="ok" d="M65 391l7 8l14-17"/>
<rect class="icon" x="120" y="372" width="38" height="38" rx="6"/>
<path class="ok" d="M129 391l7 8l14-17"/>
<rect class="icon" x="184" y="372" width="38" height="38" rx="6"/>
<path class="ok" d="M193 391l7 8l14-17"/>
<text class="n c" x="75" y="428">answer 1</text>
<text class="n c" x="139" y="428">answer 2</text>
<text class="n c" x="203" y="428">answer 3</text>
<rect class="icon" x="338" y="372" width="38" height="38" rx="6"/>
<path class="ok" d="M347 391l7 8l14-17"/>
<rect class="icon" x="402" y="372" width="38" height="38" rx="6"/>
<path class="ok" d="M411 391l7 8l14-17"/>
<rect class="iconbad" x="466" y="372" width="38" height="38" rx="6"/>
<path class="no" d="M476 382l18 18m0-18l-18 18"/>
<text class="n c" x="357" y="428">answer 1</text>
<text class="n c" x="421" y="428">answer 2</text>
<text class="n c" x="485" y="428">answer 3</text>

<text class="body" x="40" y="474">A step that is safe in smooth form can break protected answers</text>
<text class="body" x="40" y="491">once it lands on the coarse legal grid. Rounding accounts for</text>
<text class="body" x="40" y="508">roughly 90 to 96% of the adverse pressure (saved arithmetic).</text>

<text class="h" x="636" y="76">380 protected winners × 4 step sizes</text>
