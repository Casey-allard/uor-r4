<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" role="img">
<title>Why rounding breaks protection</title>
<desc>Left: a number line for one coefficient with 15 legal quarter-step values from minus 7 over 4 to plus 7 over 4. A smooth step moves the unrounded master value to a new place that is still before a protected answer's guard, and rounding then snaps it to the nearest legal tick, which is past the guard, so one of three protected answers is broken. Right: a grid of 380 protected winners against four step sizes (1, 2, 4, 7). After rounding, 104, 170, 98 and 93 of the 380 guards are violated; the smooth direction violates none. The red pattern inside each column is illustrative; the counts are data.</desc>
<style>
svg{--bg:#ffffff;--ink:#1f2328;--body:#2b3138;--muted:#57606a;--rule:#d0d7de;--panel:#f6f8fa;--blue:#0072b2;--sky:#56b4e9;--green:#007a5e;--orange:#e69f00;--verm:#d55e00;--purple:#7a4fa3;--pink:#cc79a7;--active:#007a5e;--ready:#b06d00;--parked:#7a4fa3}
