<text class="tb" x="520" y="334">λ² + κ² = 1</text><text class="n" x="520" y="352">example i = 0:</text><text class="n" x="520" y="368">λ = 1/2</text><text class="n" x="520" y="384">κ = 0.866</text>
<text class="n" x="342" y="440">κ (keep) is read from a second 16-entry table.</text>
<rect class="panel" x="636" y="48" width="308" height="404" rx="8"/>
