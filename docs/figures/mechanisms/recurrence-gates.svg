<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 494" width="960" role="img" aria-labelledby="t d">
<title id="t">Geometric recurrence gates</title>
<desc id="d">Three parts. Left: a staircase of the 16 table fade rates, lambda equal to 2 to the minus i plus 1 for i from 0 to 15, against the opening score s from 0 to 1 on a logarithmic rate axis, drawn just below the smooth curve it replaces. One selected step and its two neighbours, which the secant credit rule compares, are marked. Middle: a quaternion lane drawn as an arrow that rotates and shrinks by lambda each step, and below it lambda and the keep factor kappa shown as the two legs of a right triangle inscribed in a unit circle, so lambda squared plus kappa squared is 1; the example is lambda one half and kappa 0.866. Right: the fraction of the old state kept over 32 steps for table rates one half, one quarter, one eighth and one sixteenth, each a power of two, beside a dashed historical curve with a rate near one; the table curves fall to almost nothing within a few steps.</desc>
<style>
