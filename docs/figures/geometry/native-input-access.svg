<text x="60" y="439" font-size="18" fill="#D55E00" fill-opacity="1" text-anchor="start" font-weight="bold">Candidate consolidation: a separate read-only history role</text>
<text x="60" y="465" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="normal">Retained input position + causal state can become a key without becoming a stored fact or Copy action.</text>
<text x="60" y="488" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="normal">Not integrated. First trace the actual parent's earliest-query intervention through consumed scores.</text>
<text x="40" y="550" font-size="15" fill="#5f6b7a" fill-opacity="1" text-anchor="start" font-weight="normal">No claim that Source-only admission causes the current 8/512 result.</text>
<text x="40" y="577" font-size="15" fill="#5f6b7a" fill-opacity="1" text-anchor="start" font-weight="normal">No change to Source provenance, accepted artifact, D11 target or native acceptance checks.</text>
