<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="900" height="630" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Octonion-signed binding vs XOR</title>
<desc id="d">The Fano plane has 7 points labelled 1 to 7 and 7 lines, each line being a, b, a xor b. Binding two basis units gives plus or minus the third unit on their line, the sign set by orientation. XOR binding is commutative and associative so it loses order and grouping; signed binding changes sign on swapping distinct imaginary units and is non-associative for 168 of 210 ordered distinct imaginary triples. Incidence alone does not define coherent octonion signs. Pre-registered, not yet measured.</desc>
<rect x="2" y="2" width="996" height="696" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="40" y="56" font-size="27" font-weight="700" fill="#1f2933">Octonion-signed binding vs XOR</text>
<rect x="720" y="34" width="240" height="28" rx="14" fill="#fff4cf" fill-opacity="1" stroke="#E69F00" stroke-width="1.4" stroke-opacity="1"/>
<text x="840" y="53" font-size="12.5" fill="#7a4f00" fill-opacity="1" text-anchor="middle" font-weight="bold">pre-registered, not yet measured</text>
<text x="40" y="100" font-size="16" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="bold">1  Fano plane: 7 points, 7 lines</text>
<text x="350" y="100" font-size="16" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="bold">2  oriented product</text>
<text x="660" y="100" font-size="16" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="bold">3  XOR vs signed</text>
<line x1="80" y1="360" x2="200" y2="150" stroke="#0072B2" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round"/>
<line x1="200" y1="150" x2="320" y2="360" stroke="#0072B2" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round"/>
<line x1="80" y1="360" x2="320" y2="360" stroke="#0072B2" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round"/>
<line x1="200" y1="150" x2="200" y2="360" stroke="#009E73" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round"/>
<line x1="80" y1="360" x2="260" y2="255" stroke="#009E73" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round"/>
<line x1="140" y1="255" x2="320" y2="360" stroke="#009E73" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round"/>
<circle cx="200" cy="290" r="69.46" fill="none" fill-opacity="1" stroke="#E69F00" stroke-width="2" stroke-opacity="0.85"/>
<circle cx="200" cy="150" r="13" fill="#fff" fill-opacity="1" stroke="#1f2933" stroke-width="1.6" stroke-opacity="1"/>
<text x="200" y="155" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="middle" font-weight="bold">1</text>
<circle cx="80" cy="360" r="13" fill="#fff" fill-opacity="1" stroke="#1f2933" stroke-width="1.6" stroke-opacity="1"/>
<text x="80" y="365" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="middle" font-weight="bold">2</text>
<circle cx="320" cy="360" r="13" fill="#fff" fill-opacity="1" stroke="#1f2933" stroke-width="1.6" stroke-opacity="1"/>
<text x="320" y="365" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="middle" font-weight="bold">4</text>
<circle cx="140" cy="255" r="13" fill="#fff" fill-opacity="1" stroke="#1f2933" stroke-width="1.6" stroke-opacity="1"/>
<text x="140" y="260" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="middle" font-weight="bold">3</text>
<circle cx="260" cy="255" r="13" fill="#fff" fill-opacity="1" stroke="#1f2933" stroke-width="1.6" stroke-opacity="1"/>
<text x="260" y="260" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="middle" font-weight="bold">5</text>
<circle cx="200" cy="360" r="13" fill="#fff" fill-opacity="1" stroke="#1f2933" stroke-width="1.6" stroke-opacity="1"/>
<text x="200" y="365" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="middle" font-weight="bold">6</text>
<circle cx="200" cy="290" r="13" fill="#fff" fill-opacity="1" stroke="#1f2933" stroke-width="1.6" stroke-opacity="1"/>
<text x="200" y="295" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="middle" font-weight="bold">7</text>
<text x="40" y="404" font-size="13" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="bold">every line is {a, b, a⊕b}:</text>
<text x="40" y="424" font-size="12.5" fill="#5f6b7a" fill-opacity="1" text-anchor="start" font-weight="normal">123 · 145 · 167 · 246 · 257 · 347 · 356</text>
<text x="40" y="443" font-size="12.5" fill="#5f6b7a" fill-opacity="1" text-anchor="start" font-weight="normal">incidence only; not seven positive cycles</text>
<line x1="449.52" y1="177.03" x2="394.99" y2="265.64" stroke="#009E73" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/>
<polygon points="391.53,271.26 393.74,259.7 400.86,264.09" fill="#009E73" fill-opacity="1"/>
<line x1="400" y1="290" x2="511.4" y2="290" stroke="#009E73" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/>
<polygon points="518,290 507,294.18 507,285.82" fill="#009E73" fill-opacity="1"/>
<line x1="529.52" y1="272.97" x2="474.99" y2="184.36" stroke="#009E73" stroke-width="2.5" stroke-opacity="1" stroke-linecap="round"/>
<polygon points="471.53,178.74 480.86,185.91 473.74,190.3" fill="#009E73" fill-opacity="1"/>
<circle cx="460" cy="160" r="17" fill="#f2faf6" fill-opacity="1" stroke="#009E73" stroke-width="1.8" stroke-opacity="1"/>
<text x="460" y="165" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="middle" font-weight="bold">e1</text>
<circle cx="380" cy="290" r="17" fill="#f2faf6" fill-opacity="1" stroke="#009E73" stroke-width="1.8" stroke-opacity="1"/>
<text x="380" y="295" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="middle" font-weight="bold">e2</text>
<circle cx="540" cy="290" r="17" fill="#f2faf6" fill-opacity="1" stroke="#009E73" stroke-width="1.8" stroke-opacity="1"/>
<text x="540" y="295" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="middle" font-weight="bold">e3</text>
<text x="350" y="340" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="bold">e_a · e_b = ± e_{a⊕b}</text>
<text x="350" y="366" font-size="13" fill="#00704f" fill-opacity="1" text-anchor="start" font-weight="bold">e_1 · e_2 = +e_3  (along the arrow)</text>
<text x="350" y="388" font-size="13" fill="#8a3a00" fill-opacity="1" text-anchor="start" font-weight="bold">e_2 · e_1 = −e_3  (against the arrow)</text>
<text x="350" y="412" font-size="12.5" fill="#5f6b7a" fill-opacity="1" text-anchor="start" font-weight="normal">label of the result = a ⊕ b (XOR);</text>
<text x="350" y="430" font-size="12.5" fill="#5f6b7a" fill-opacity="1" text-anchor="start" font-weight="normal">the sign comes from one table read</text>
<rect x="660" y="118" width="300" height="140" rx="12" fill="#f4f5f7" fill-opacity="1" stroke="#d3dae2" stroke-width="1.2" stroke-opacity="1"/>
<text x="676" y="142" font-size="14" fill="#5f6b7a" fill-opacity="1" text-anchor="start" font-weight="bold">XOR binding</text>
<text x="676" y="168" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="bold">a⊕b = b⊕a</text>
<text x="676" y="187" font-size="12.5" fill="#5f6b7a" fill-opacity="1" text-anchor="start" font-weight="normal">order lost</text>
<text x="676" y="214" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="bold">(a⊕b)⊕c = a⊕(b⊕c)</text>
<text x="676" y="233" font-size="12.5" fill="#5f6b7a" fill-opacity="1" text-anchor="start" font-weight="normal">grouping lost</text>
<rect x="660" y="274" width="300" height="170" rx="12" fill="#eef6fc" fill-opacity="1" stroke="#0072B2" stroke-width="1.6" stroke-opacity="1"/>
<text x="676" y="298" font-size="14" fill="#0b4f7c" fill-opacity="1" text-anchor="start" font-weight="bold">signed binding</text>
<text x="676" y="324" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="bold">a·b = −b·a</text>
<text x="676" y="343" font-size="12.5" fill="#0b4f7c" fill-opacity="1" text-anchor="start" font-weight="normal">distinct imaginary units only</text>
<text x="676" y="370" font-size="14" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="bold">(a·b)·c ≠ a·(b·c)</text>
<text x="676" y="389" font-size="12.5" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="normal">for 168 of 210 triples</text>
<text x="676" y="407" font-size="12.5" fill="#0b4f7c" fill-opacity="1" text-anchor="start" font-weight="normal">(ordered, distinct imaginary units)</text>
<rect x="40" y="486" width="920" height="30" rx="10" fill="#f6f9fc" fill-opacity="1" stroke="#d3dae2" stroke-width="1.2" stroke-opacity="1"/>
<text x="500" y="506" font-size="13.5" fill="#1f2933" fill-opacity="1" text-anchor="middle" font-weight="bold">cost: XOR + one sign-table read: add/subtract only</text>
<rect x="40" y="572" width="920" height="40" rx="12" fill="#f6f9fc" fill-opacity="1" stroke="#d3dae2" stroke-width="1.2" stroke-opacity="1"/>
<rect x="58" y="586" width="14" height="14" rx="3" fill="#0072B2" fill-opacity="1" stroke="#fff" stroke-width="1" stroke-opacity="1"/>
<text x="80" y="598" font-size="12.5" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="normal">triangle side (line)</text>
<rect x="278" y="586" width="14" height="14" rx="3" fill="#009E73" fill-opacity="1" stroke="#fff" stroke-width="1" stroke-opacity="1"/>
<text x="300" y="598" font-size="12.5" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="normal">median (line)</text>
<rect x="448" y="586" width="14" height="14" rx="3" fill="#E69F00" fill-opacity="1" stroke="#fff" stroke-width="1" stroke-opacity="1"/>
<text x="470" y="598" font-size="12.5" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="normal">circle (line)</text>
<rect x="618" y="586" width="14" height="14" rx="3" fill="#D55E00" fill-opacity="1" stroke="#fff" stroke-width="1" stroke-opacity="1"/>
<text x="640" y="598" font-size="12.5" fill="#1f2933" fill-opacity="1" text-anchor="start" font-weight="normal">sign flips on swap</text>
<text x="40" y="648" font-size="14" fill="#5f6b7a">Signed binding = XOR after relabelling plus a coherent sign-table read; incidence alone is insufficient.</text>
<text x="40" y="669" font-size="14" fill="#5f6b7a">Costs add/subtract and table reads only; no multiplier, no float.</text>
</svg>
