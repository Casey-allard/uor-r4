<text x="165" y="303" font-size="11" fill="#5f6b7a" fill-opacity="1" text-anchor="middle" font-weight="normal">6 vertices, 15 edges</text>
<rect x="70" y="367" width="190" height="66" rx="10" fill="#f6f9fc" fill-opacity="1" stroke="#d3dae2" stroke-width="1.3" stroke-opacity="1"/>
