<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" role="img" aria-labelledby="t d">
<title id="t">The model pipeline, stage by stage</title>
<desc id="d">A left-to-right pipeline. Text goes to stage 1, the tokenizer with 4,096 pieces (built). Stage 2 is the token table of 4 blocks of 8 integers (trained in). Stage 3 is the ordered context, a tree of positions (built). Stage 4 is the reads Route, Flock and Relation (trained in). Stage 5 is the writer with admission, 256 cells with K kept (trained in). Stage 6 is the rank-margin loss (trained in). Stage 7, discrete learning on the GPU, sits below the line: it receives the loss and updates the token table and the reads (trained in). Stage 8, export to a D11 integer artifact, is a dashed empty box: missing, no code. Stage 9 is serving: the engine is built but has never been used for this model. Three dashed boxes above the line mark parts a transformer has and this model lacks: position, normalization and a feed-forward block on the discrete path, each with no mechanism assigned. Most boxes are solid, so the chain mostly exists, but it stops short of a shippable file.</desc>
<style>
svg { --bg:#ffffff; --ink:#1f2328; --body:#2b3138; --muted:#57606a; --rule:#d0d7de; --panel:#f6f8fa;
      --blue:#0072b2; --sky:#56b4e9; --green:#007a5e; --orange:#e69f00; --verm:#d55e00; --purple:#7a4fa3; --pink:#cc79a7;
      --active:#007a5e; --ready:#b06d00; --parked:#7a4fa3; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --ink:#e6edf3; --body:#c9d1d9; --muted:#8b949e; --rule:#30363d; --panel:#161b22;
      --blue:#58a6ff; --sky:#79c0ff; --green:#3fb950; --orange:#f0b72f; --verm:#ff7b72; --purple:#bc8cff; --pink:#f778ba;
      --active:#3fb950; --ready:#f0b72f; --parked:#bc8cff; } }
.bg { fill: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
.title { font-size: 19px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--muted); }
.name { font-size: 13px; font-weight: 600; }
.detail { font-size: 11px; fill: var(--muted); }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; }
.tag-built { fill: var(--blue); }
.tag-trained { fill: var(--green); }
.tag-missing { fill: var(--verm); }
.note { font-size: 11px; fill: var(--muted); }
.badge-t { font-size: 11px; font-weight: 700; fill: var(--bg); }
.q { font-size: 12px; font-weight: 700; fill: var(--verm); }
.in { fill: var(--panel); stroke: var(--muted); stroke-width: 1.5; }
.built { fill: var(--blue); fill-opacity: 0.12; stroke: var(--blue); stroke-width: 1.75; }
.trained { fill: var(--green); fill-opacity: 0.12; stroke: var(--green); stroke-width: 1.75; }
.ring { fill: none; stroke: var(--green); stroke-width: 1.25; }
.missing { fill: none; stroke: var(--verm); stroke-width: 1.75; stroke-dasharray: 5 4; }
.badge-b { fill: var(--blue); }
.badge-g { fill: var(--green); }
.badge-v { fill: var(--verm); }
.flow { stroke: var(--muted); stroke-width: 1.75; fill: none; }
.flow-learn { stroke: var(--green); stroke-width: 1.75; fill: none; }
.flow-miss { stroke: var(--verm); stroke-width: 1.75; fill: none; stroke-dasharray: 5 4; }
.stub { stroke: var(--verm); stroke-width: 1.25; fill: none; stroke-dasharray: 3 3; }
.dot { fill: var(--verm); }
.rule { stroke: var(--rule); stroke-width: 1; }
.ah { fill: var(--muted); }
.ah-g { fill: var(--green); }
.ah-v { fill: var(--verm); }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-g" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-v" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="560"/>
<text class="title" x="24" y="34">From text to a served model: what exists today</text>
<text class="sub" x="24" y="56">Dashed boxes above the line are parts a transformer has that this model has not filled.</text>

<!-- empty slots above the line -->
<path class="stub" d="M324 144 V250"/>
<path class="stub" d="M480 144 V166 H530 V250"/>
<path class="stub" d="M630 144 V166 H530"/>
<circle class="dot" cx="324" cy="250" r="3"/>
<circle class="dot" cx="530" cy="250" r="3"/>
<rect class="missing" x="254" y="84" width="140" height="60" rx="8"/>
<text class="name" x="324" y="106" text-anchor="middle">position</text>
<text class="detail" x="324" y="123" text-anchor="middle">no mechanism assigned</text>
<text class="q" x="382" y="100" text-anchor="middle">?</text>
<rect class="missing" x="410" y="84" width="140" height="60" rx="8"/>
<text class="name" x="480" y="102" text-anchor="middle">feed-forward</text>
<text class="detail" x="480" y="117" text-anchor="middle">(discrete path)</text>
<text class="detail" x="480" y="132" text-anchor="middle">no mechanism assigned</text>
<text class="q" x="538" y="100" text-anchor="middle">?</text>
<rect class="missing" x="560" y="84" width="140" height="60" rx="8"/>
<text class="name" x="630" y="106" text-anchor="middle">normalization</text>
<text class="detail" x="630" y="123" text-anchor="middle">no mechanism assigned</text>
<text class="q" x="688" y="100" text-anchor="middle">?</text>

<!-- main line connectors -->
<path class="flow" d="M109 250 H127" marker-end="url(#a)"/>
<path class="flow" d="M212 250 H226" marker-end="url(#a)"/>
<path class="flow" d="M319 250 H333" marker-end="url(#a)"/>
<path class="flow" d="M418 250 H432" marker-end="url(#a)"/>
<path class="flow" d="M525 250 H535" marker-end="url(#a)"/>
<path class="flow-miss" d="M830 250 H848" marker-end="url(#av)"/>

<!-- 0 text -->
<rect class="in" x="24" y="190" width="85" height="124" rx="8"/>
<text class="name" x="66.5" y="254" text-anchor="middle">text</text>

<!-- 1 tokenizer -->
<rect class="built" x="127" y="190" width="85" height="124" rx="8"/>
<circle class="badge-b" cx="127" cy="190" r="10"/><text class="badge-t" x="127" y="194" text-anchor="middle">1</text>
<text class="name" x="169.5" y="224" text-anchor="middle">tokenizer</text>
<text class="detail" x="169.5" y="256" text-anchor="middle">4,096</text>
<text class="detail" x="169.5" y="270" text-anchor="middle">pieces</text>
<text class="tag tag-built" x="169.5" y="302" text-anchor="middle">BUILT</text>

<!-- 2 token table -->
<rect x="226" y="186" width="93" height="132" rx="11" class="ring"/>
<rect class="trained" x="230" y="190" width="85" height="124" rx="8"/>
<circle class="badge-g" cx="230" cy="190" r="10"/><text class="badge-t" x="230" y="194" text-anchor="middle">2</text>
<text class="name" x="272.5" y="224" text-anchor="middle">token</text>
<text class="name" x="272.5" y="241" text-anchor="middle">table</text>
<text class="detail" x="272.5" y="263" text-anchor="middle">4 blocks of</text>
<text class="detail" x="272.5" y="277" text-anchor="middle">8 integers</text>
<text class="tag tag-trained" x="272.5" y="302" text-anchor="middle">TRAINED IN</text>

<!-- 3 ordered context -->
<rect class="built" x="333" y="190" width="85" height="124" rx="8"/>
<circle class="badge-b" cx="333" cy="190" r="10"/><text class="badge-t" x="333" y="194" text-anchor="middle">3</text>
<text class="name" x="375.5" y="224" text-anchor="middle">ordered</text>
<text class="name" x="375.5" y="241" text-anchor="middle">context</text>
<text class="detail" x="375.5" y="263" text-anchor="middle">tree of</text>
<text class="detail" x="375.5" y="277" text-anchor="middle">positions</text>
<text class="tag tag-built" x="375.5" y="302" text-anchor="middle">BUILT</text>

<!-- 4 reads -->
<rect x="432" y="186" width="93" height="132" rx="11" class="ring"/>
<rect class="trained" x="436" y="190" width="85" height="124" rx="8"/>
<circle class="badge-g" cx="436" cy="190" r="10"/><text class="badge-t" x="436" y="194" text-anchor="middle">4</text>
<text class="name" x="478.5" y="232" text-anchor="middle">reads</text>
<text class="detail" x="478.5" y="256" text-anchor="middle">Route, Flock,</text>
<text class="detail" x="478.5" y="270" text-anchor="middle">Relation</text>
<text class="tag tag-trained" x="478.5" y="302" text-anchor="middle">TRAINED IN</text>

<!-- 5 writer -->
<rect x="535" y="186" width="93" height="132" rx="11" class="ring"/>
<rect class="trained" x="539" y="190" width="85" height="124" rx="8"/>
<circle class="badge-g" cx="539" cy="190" r="10"/><text class="badge-t" x="539" y="194" text-anchor="middle">5</text>
<text class="name" x="581.5" y="224" text-anchor="middle">writer</text>
<text class="name" x="581.5" y="241" text-anchor="middle">+ admission</text>
<text class="detail" x="581.5" y="263" text-anchor="middle">256 cells,</text>
<text class="detail" x="581.5" y="277" text-anchor="middle">K kept</text>
<text class="tag tag-trained" x="581.5" y="302" text-anchor="middle">TRAINED IN</text>

<!-- 6 loss -->
<rect x="638" y="186" width="93" height="132" rx="11" class="ring"/>
<rect class="trained" x="642" y="190" width="85" height="124" rx="8"/>
<circle class="badge-g" cx="642" cy="190" r="10"/><text class="badge-t" x="642" y="194" text-anchor="middle">6</text>
<text class="name" x="684.5" y="224" text-anchor="middle">rank-margin</text>
<text class="name" x="684.5" y="241" text-anchor="middle">loss</text>
<text class="detail" x="684.5" y="263" text-anchor="middle">integer</text>
<text class="detail" x="684.5" y="277" text-anchor="middle">hinge</text>
<text class="tag tag-trained" x="684.5" y="302" text-anchor="middle">TRAINED IN</text>

<!-- 8 export (missing) -->
<rect class="missing" x="745" y="190" width="85" height="124" rx="8"/>
<circle class="badge-v" cx="745" cy="190" r="10"/><text class="badge-t" x="745" y="194" text-anchor="middle">8</text>
<text class="name" x="787.5" y="224" text-anchor="middle">export</text>
<text class="detail" x="787.5" y="256" text-anchor="middle">D11 integer</text>
<text class="detail" x="787.5" y="270" text-anchor="middle">artifact</text>
<text class="detail" x="787.5" y="286" text-anchor="middle">no code</text>
<text class="tag tag-missing" x="787.5" y="302" text-anchor="middle">MISSING</text>
<text class="q" x="818" y="210" text-anchor="middle">?</text>

<!-- 9 serving -->
<rect class="built" x="848" y="190" width="85" height="124" rx="8"/>
<circle class="badge-b" cx="848" cy="190" r="10"/><text class="badge-t" x="848" y="194" text-anchor="middle">9</text>
<text class="name" x="890.5" y="224" text-anchor="middle">serving</text>
<text class="detail" x="890.5" y="248" text-anchor="middle">engine built;</text>
<text class="detail" x="890.5" y="262" text-anchor="middle">not used for</text>
<text class="detail" x="890.5" y="276" text-anchor="middle">this model</text>
<text class="tag tag-built" x="890.5" y="302" text-anchor="middle">BUILT</text>

<!-- 7 learning (below the line) -->
<path class="flow" d="M684.5 318 V386" marker-end="url(#a)"/>
<text class="note" x="692" y="356">integer loss</text>
<path class="flow-learn" d="M530 390 V350 H478.5 V320" marker-end="url(#ag)"/>
<text class="note" x="486" y="343">route frames, gates</text>
<path class="flow-learn" d="M500 422 H272.5 V320" marker-end="url(#ag)"/>
<text class="note" x="282" y="414">vector blocks</text>
<path class="flow-miss" d="M700 422 H787.5 V320" marker-end="url(#av)"/>
<text class="note" x="796" y="372">trained snapshot</text>
<text class="note" x="796" y="386">(no exporter yet)</text>
<rect x="496" y="386" width="208" height="72" rx="11" class="ring"/>
<rect class="trained" x="500" y="390" width="200" height="64" rx="8"/>
<circle class="badge-g" cx="500" cy="390" r="10"/><text class="badge-t" x="500" y="394" text-anchor="middle">7</text>
<text class="name" x="600" y="414" text-anchor="middle">discrete learning (GPU)</text>
<text class="detail" x="600" y="430" text-anchor="middle">16 legal states, keeps a strict gain</text>
<text class="tag tag-trained" x="600" y="446" text-anchor="middle">TRAINED IN</text>

<!-- key -->
<line class="rule" x1="24" y1="476" x2="936" y2="476"/>
<rect class="built" x="24" y="486" width="30" height="16" rx="4"/>
<text class="note" x="64" y="498"><tspan font-weight="700">BUILT</tspan>: the source exists and passes its small fixed controls (not a language result).</text>
<rect x="21" y="508" width="36" height="22" rx="6" class="ring"/>
<rect class="trained" x="24" y="511" width="30" height="16" rx="4"/>
<text class="note" x="64" y="523"><tspan font-weight="700">TRAINED IN</tspan>: took part in a learning run, helped or not. No stage has learned language yet.</text>
<rect class="missing" x="24" y="536" width="30" height="12" rx="4"/>
<text class="note" x="64" y="546"><tspan font-weight="700">MISSING</tspan>: no code, or no mechanism assigned.</text>
</svg>
