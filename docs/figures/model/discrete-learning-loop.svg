<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" width="960" role="img" aria-labelledby="t d">
<title id="t">One batch of discrete learning</title>
<desc id="d">A loop for one training batch. A stack of 64 example rows feeds a baseline pass done once per row. A grid of 64 rows by 16 lanes (the current state, called stay, plus 15 rotations) scores every row; the column sums are 16 integer losses and the lowest sum is chosen, with ties going to stay. An apply step commits the move only if its loss is strictly lower than staying; otherwise it refuses and nothing changes. After a commit the stored table is validated on the GPU, then the loop moves to the next coordinate: a vector block, a route frame or a gate. A timing strip compares one proposal on one RTX 5090: ordinary 3.843 seconds against row-parallel 0.0691 seconds, 55.6 times faster. Side panel A shows BVG-K, which scores K = 16 coordinates in one launch and commits them as one block only if the joint loss beats the best single move; scoring is about 16 times faster and block apply about 8 times, on fixtures. Side panel B shows the offline float path as a separate scanned module, held with no sheet registered, which can reach the integer table only through an export-gap check against the two-seed noise band.</desc>
