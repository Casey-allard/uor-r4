<title id="t">UOR-R4 training pipeline</title>
<desc id="d">Data sources SmolLM-Corpus, SmolTalk, TinyStories and project memory-dialogue data go through prepare tools and a mixer, then the byte-BPE tokenizer, geometric-stack pretraining on GPU pods, dialogue fine-tuning, export to a lookup artifact with GPTQ at most 4 bits, and chat-grade panels. Status is marked on every step.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#424A53"/></marker><pattern id="hP" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#FFF7E3"/><line x1="0" y1="0" x2="0" y2="9" stroke="#F1D79A" stroke-width="2.2"/></pattern><pattern id="hF" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F0F2F4"/><path d="M0,0 L8,8 M8,0 L0,8" stroke="#D3D8DD" stroke-width="1"/></pattern></defs>
<rect x="0.5" y="0.5" width="1199" height="899" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start" >Training pipeline: from corpora to a graded chat model</text>
<text x="40" y="80" font-size="14.5" font-weight="400" fill="#57606A" text-anchor="start" >Rust tools only. GPU pods are leased through uor-pod; every step is charged to the cumulative resource ledger.</text>
