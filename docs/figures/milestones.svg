<title id="t">UOR-R4 progress toward the alpha</title>
<desc id="d">Eight milestones on a horizontal track. M1 to M4 are in progress, M5 to M8 are not started. M1 and M2 feed M4, M4 leads to M5, M6, M7 and the alpha at M8.</desc>
