<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="t d">
<title id="t">Phases and weekly activity, June to October 2026</title>
<desc id="d">A time axis from 10 June to 19 October 2026. Two rows of bands mark the five phases A to E. Below, an area chart of catalog records per day: nothing before 21 Jul (GitHub items only), then a rise to a peak of 74 records on 13 Oct.</desc>
