<title id="t">UOR-R4 architecture overview</title>
<desc id="d">Line A, the geometric stack language base, now has a compliant trunk as tested source (rotation recurrence with geometric gates, a SpiralCore/FBS projection and the Hamilton gate) but no geometric head yet, and its first lawful training run is held. Line B, the native learner, completes 437 of 512 development replies but 0 of 128 on fresh transfer. Both are meant to join as one model served under D11 at milestone M4.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#424A53"/></marker><pattern id="hP" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#FFF7E3"/><line x1="0" y1="0" x2="0" y2="9" stroke="#F1D79A" stroke-width="2.2"/></pattern><pattern id="hF" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F0F2F4"/><path d="M0,0 L8,8 M8,0 L0,8" stroke="#D3D8DD" stroke-width="1"/></pattern></defs>
<rect x="0.5" y="0.5" width="1199" height="899" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#1F2328" text-anchor="start">UOR-R4 Geometric Language Model: architecture</text>
<text x="40" y="80" font-size="14.5" font-weight="400" fill="#57606A" text-anchor="start">Pre-alpha, 13 October 2026. Two lines join as one served model at M4. Training is held until the whole executed path is lawful.</text>
<text x="40" y="118" font-size="14" font-weight="700" fill="#0072B2" text-anchor="start">LINE A   Geometric stack: the language base (M1)</text>
<rect x="40" y="130" width="220" height="132" rx="10" fill="#E3F4EE" stroke="#007A5E" stroke-width="2.5"/>
<text x="54" y="156" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Data &amp; tokenizer</text>
<text x="54" y="177" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">byte-BPE tokenizer (#1017),</text>
<text x="54" y="193" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">corpora and memory</text>
<text x="54" y="209" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">dialogues, in the HF store</text>
<rect x="54" y="232" width="69" height="22" rx="11" fill="#007A5E" stroke="#007A5E" stroke-width="1.5"/>
<text x="88.5" y="247" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">WORKING</text>
<rect x="290" y="130" width="260" height="132" rx="10" fill="#E4EFF8" stroke="#0072B2" stroke-width="1.75"/>
<text x="304" y="156" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Compliant trunk (source)</text>
<text x="304" y="177" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">recurrence: rotation transport,</text>
<text x="304" y="193" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">clamped opening, exact rate table</text>
<text x="304" y="209" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">feed-forward: SpiralCore/FBS + G2</text>
<rect x="304" y="232" width="118" height="22" rx="11" fill="#0072B2" stroke="#0072B2" stroke-width="1.5"/>
<text x="363" y="247" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT &amp; TESTED</text>
<rect x="580" y="130" width="170" height="132" rx="10" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.75" stroke-dasharray="6 5"/>
<text x="594" y="156" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Geometric head</text>
<text x="594" y="177" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">OP3a product-key</text>
<text x="594" y="193" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">head; replaces the</text>
<text x="594" y="209" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">dense tied head</text>
<rect x="594" y="232" width="69" height="22" rx="11" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="628.5" y="247" font-size="11" font-weight="700" fill="#424A53" text-anchor="middle" letter-spacing="0.4">PLANNED</text>
<rect x="780" y="130" width="170" height="132" rx="10" fill="#F4F0F8" stroke="#7A4FA3" stroke-width="2" stroke-dasharray="9 4"/>
<text x="794" y="156" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Rung 0 training</text>
<text x="794" y="177" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">first lawful run;</text>
<text x="794" y="193" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">pre-registered,</text>
<text x="794" y="209" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">waits on the head</text>
<rect x="794" y="232" width="48" height="22" rx="11" fill="#7A4FA3" stroke="#7A4FA3" stroke-width="1.5"/>
<text x="818" y="247" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">HELD</text>
<path d="M260,196 L290,196" fill="none" stroke="#424A53" stroke-width="2" marker-end="url(#ah)"/>
<path d="M550,196 L580,196" fill="none" stroke="#424A53" stroke-width="2" marker-end="url(#ah)"/>
<path d="M750,196 L780,196" fill="none" stroke="#424A53" stroke-width="2" marker-end="url(#ah)"/>
<path d="M950,196 L990,196" fill="none" stroke="#424A53" stroke-width="2" marker-end="url(#ah)"/>
<text x="40" y="290" font-size="14" font-weight="700" fill="#0072B2" text-anchor="start">LINE B   Native learner: grounded reply from exact memory (M2, M3)</text>
<rect x="40" y="302" width="220" height="112" rx="10" fill="#E4EFF8" stroke="#0072B2" stroke-width="1.75"/>
<text x="54" y="328" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Compiler</text>
<text x="54" y="349" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">text to typed facts</text>
<text x="54" y="365" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">(H4 / zeta tables)</text>
<rect x="54" y="384" width="118" height="22" rx="11" fill="#0072B2" stroke="#0072B2" stroke-width="1.5"/>
<text x="113" y="399" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT &amp; TESTED</text>
<rect x="290" y="302" width="260" height="112" rx="10" fill="#E4EFF8" stroke="#0072B2" stroke-width="1.75"/>
<text x="304" y="328" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Exact addressed store</text>
<text x="304" y="349" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">versioned facts, exact identity,</text>
<text x="304" y="365" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">prime and H4 addresses</text>
<rect x="304" y="384" width="118" height="22" rx="11" fill="#0072B2" stroke="#0072B2" stroke-width="1.5"/>
<text x="363" y="399" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT &amp; TESTED</text>
<rect x="580" y="302" width="370" height="112" rx="10" fill="url(#hP)" stroke="#B87A00" stroke-width="2"/>
<text x="594" y="328" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Emitter</text>
<text x="594" y="349" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">437 of 512 dev replies complete, 0 of 128</text>
<text x="594" y="365" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">on fresh transfer: panel fitting; held</text>
<rect x="594" y="384" width="97" height="22" rx="11" fill="#E69F00" stroke="#B87A00" stroke-width="1.5"/>
<text x="642.5" y="399" font-size="11" font-weight="700" fill="#1F2328" text-anchor="middle" letter-spacing="0.4">IN PROGRESS</text>
<path d="M260,358 L290,358" fill="none" stroke="#424A53" stroke-width="2" marker-end="url(#ah)"/>
<path d="M550,358 L580,358" fill="none" stroke="#424A53" stroke-width="2" marker-end="url(#ah)"/>
<path d="M950,358 L990,358" fill="none" stroke="#424A53" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="970" y="346" font-size="11.5" font-weight="700" fill="#424A53" text-anchor="middle">M4</text>
<rect x="990" y="130" width="170" height="284" rx="10" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.75" stroke-dasharray="6 5"/>
<text x="1004" y="156" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">M4: one model</text>
<text x="1004" y="177" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">the M4 join, served</text>
<text x="1004" y="193" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">under D11: no float,</text>
<text x="1004" y="209" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">no multiplier, no</text>
<text x="1004" y="225" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">transformer. The D11</text>
<text x="1004" y="241" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">engine is bit-exact;</text>
<text x="1004" y="257" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">no lawful model to</text>
<text x="1004" y="273" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">serve exists yet.</text>
<rect x="1004" y="384" width="69" height="22" rx="11" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="1038.5" y="399" font-size="11" font-weight="700" fill="#424A53" text-anchor="middle" letter-spacing="0.4">PLANNED</text>
<text x="40" y="444" font-size="14" font-weight="700" fill="#0072B2" text-anchor="start">SERVING AND ACCESS (M4, M7)</text>
<rect x="40" y="456" width="360" height="112" rx="10" fill="#E3F4EE" stroke="#007A5E" stroke-width="2.5"/>
<text x="54" y="482" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">D11 engine (uor-r4-integer)</text>
<text x="54" y="503" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">adds, shifts, compares and table reads;</text>
<text x="54" y="519" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">bit-exact with its float reference</text>
<rect x="54" y="538" width="69" height="22" rx="11" fill="#007A5E" stroke="#007A5E" stroke-width="1.5"/>
<text x="88.5" y="553" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">WORKING</text>
<rect x="430" y="456" width="340" height="112" rx="10" fill="#E4EFF8" stroke="#0072B2" stroke-width="1.75"/>
<text x="444" y="482" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Local API: r4-native-chat</text>
<text x="444" y="503" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">serves the native learner only</text>
<rect x="444" y="538" width="118" height="22" rx="11" fill="#0072B2" stroke="#0072B2" stroke-width="1.5"/>
<text x="503" y="553" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT &amp; TESTED</text>
<rect x="800" y="456" width="360" height="112" rx="10" fill="url(#hF)" stroke="#8C959F" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="814" y="482" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">WASM Studio (Pages)</text>
<text x="814" y="503" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">runs the older R4G1 router, not</text>
<text x="814" y="519" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">the native or stack model</text>
<rect x="814" y="538" width="62" height="22" rx="11" fill="#57606A" stroke="#57606A" stroke-width="1.5"/>
<text x="845" y="553" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">FROZEN</text>
<rect x="40" y="590" width="1120" height="210" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="62" y="618" font-size="16" font-weight="700" fill="#1F2328" text-anchor="start">Shared geometry</text>
<text x="1138" y="618" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="end">Structure is verified mathematics; a measured predictive advantage is not yet established.</text>
<rect x="62" y="636" width="200" height="140" rx="10" fill="#E4EFF8" stroke="#0072B2" stroke-width="1.75"/>
<text x="76" y="662" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Prime addresses</text>
<text x="76" y="683" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">exact identity; gcd and</text>
<text x="76" y="699" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">n-let admission</text>
<rect x="76" y="746" width="118" height="22" rx="11" fill="#0072B2" stroke="#0072B2" stroke-width="1.5"/>
<text x="135" y="761" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT &amp; TESTED</text>
<rect x="278" y="636" width="200" height="140" rx="10" fill="#E4EFF8" stroke="#0072B2" stroke-width="1.75"/>
<text x="292" y="662" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Zeta phases</text>
<text x="292" y="683" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">fixed γ·(log p − log q)</text>
<text x="292" y="699" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">phase table</text>
<rect x="292" y="746" width="118" height="22" rx="11" fill="#0072B2" stroke="#0072B2" stroke-width="1.5"/>
<text x="351" y="761" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT &amp; TESTED</text>
<rect x="494" y="636" width="200" height="140" rx="10" fill="#E4EFF8" stroke="#0072B2" stroke-width="1.75"/>
<text x="508" y="662" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">R4/S3 quaternions</text>
<text x="508" y="683" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">state and transport;</text>
<text x="508" y="699" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">Hamilton gate rotations</text>
<rect x="508" y="746" width="118" height="22" rx="11" fill="#0072B2" stroke="#0072B2" stroke-width="1.5"/>
<text x="567" y="761" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT &amp; TESTED</text>
<rect x="710" y="636" width="200" height="140" rx="10" fill="#E4EFF8" stroke="#0072B2" stroke-width="1.75"/>
<text x="724" y="662" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">H4, icosians, E8</text>
<text x="724" y="683" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">120-icosian codebook,</text>
<text x="724" y="699" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">exact Z[φ], H4 ⊕ φH4</text>
<rect x="724" y="746" width="118" height="22" rx="11" fill="#0072B2" stroke="#0072B2" stroke-width="1.5"/>
<text x="783" y="761" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT &amp; TESTED</text>
<rect x="926" y="636" width="200" height="140" rx="10" fill="#E4EFF8" stroke="#0072B2" stroke-width="1.75"/>
<text x="940" y="662" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">SpiralCore / FBS</text>
<text x="940" y="683" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">signed BFS transport of</text>
<text x="940" y="699" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">selected carriers</text>
<rect x="940" y="746" width="118" height="22" rx="11" fill="#0072B2" stroke="#0072B2" stroke-width="1.5"/>
<text x="999" y="761" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT &amp; TESTED</text>
<text x="40" y="828" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="start">Infrastructure: the research harness (claims, presence, pre-registration and TEST FITNESS), Vast.ai GPU pods bootstrapped from the private</text>
<text x="40" y="846" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="start">Hugging Face store, results in iCloud and the store. Built &amp; tested means source with focused tests, not a trained model.</text>
