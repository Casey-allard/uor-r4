<text x="50" y="275" font-size="23" font-weight="700" fill="#1F2328" text-anchor="start">2  Ordered ternary context</text>
<text x="50" y="310" font-size="20" font-weight="400" fill="#2B3138" text-anchor="start">FBS plans preserve context order</text>
