<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">UOR-R4 architecture overview</title>
<desc id="d">Two separately built lines, a geometric-stack language model trained and exported to a lookup artifact, and a native geometric learner with an exact addressed store, are meant to join in one served model under the D11 rules (no float, no multiplier, no transformer). Served through a CLI, a local API and a WASM Studio. Both lines sit on a shared geometry layer. Status is marked on every box; the join is not done.</desc>
