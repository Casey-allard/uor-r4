<text x="50" y="1180" font-size="20" font-weight="400" fill="#2B3138" text-anchor="start">Useful conversation: unqualified</text>
<text x="30" y="1262" font-size="19" font-weight="400" fill="#57606A" text-anchor="start">Arrow sources and optional Prime-Zeta setup:</text>
