<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 935" width="1200" height="935" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">UOR-R4 serving pipeline</title>
<desc id="d">A UORLUT01 artifact loads into the uor-r4-integer D11 engine, which uses table reads, adds and shifts and is bit-exact with the float path on 3,072 targets. It is served by uor-chat --stack and uor-r4-stack generate. The native learner is served by r4-native-chat. The Pages Studio runs the older R4G1 router. Latency and energy per token, API and WASM for the stack, and grounded replies in the served model are not done.</desc>
