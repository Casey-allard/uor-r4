[package]
name = "d27-assertion-writer"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "d27-assertion-writer"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uor-r4-integer = { path = "../../../../../../crates/uor-r4-integer", features = ["serving-wasm"] }
uor-r4-tokenizer = { path = "../../../../../../crates/uor-r4-tokenizer" }
sha2 = "0.10"

[[bin]]
name = "d27-value-witness"
path = "witness.rs"
