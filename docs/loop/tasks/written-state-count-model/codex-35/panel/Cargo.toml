[package]
name = "d35-panel"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "d35-panel"
path = "runner.rs"

[[bin]]
name = "d35-panel-freeze"
path = "panel.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uor-r4-tokenizer = { path = "../../../../../../crates/uor-r4-tokenizer" }
