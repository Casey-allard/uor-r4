[package]
name = "bind-clause-writer-cases"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "bind-clause-writer-cases"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uor-r4-tokenizer = { path = "../../../../../../../crates/uor-r4-tokenizer" }
uor-r4-integer = { path = "../../../../../../../crates/uor-r4-integer", features = ["serving-wasm"] }

[[bin]]
name = "clause-source-witness"
path = "witness.rs"
