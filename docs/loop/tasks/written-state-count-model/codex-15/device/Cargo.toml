[package]
name = "ordered-role-device"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "ordered-role-device"
path = "driver.rs"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uor-r4-integer = { path = "../../../../../../crates/uor-r4-integer", features = ["serving-wasm"] }
uor-r4-tokenizer = { path = "../../../../../../crates/uor-r4-tokenizer" }
