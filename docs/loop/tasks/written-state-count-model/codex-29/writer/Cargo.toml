[package]
name = "d29-writer-replay"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "d29-writer-replay"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uor-r4-integer = { path = "../../../../../../crates/uor-r4-integer", features = ["serving-wasm"] }
