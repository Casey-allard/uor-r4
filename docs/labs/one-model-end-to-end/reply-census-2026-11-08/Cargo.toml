[package]
name = "reply-census"
version = "0.1.0"
edition = "2021"
publish = false
description = "claude-320: counts the scored replies of one SFT split, optionally against a second split"

# A standalone instrument, outside the repository's workspace, like
# docs/labs/scale-probe/instrument.
[workspace]
resolver = "2"

[[bin]]
name = "reply-census"
path = "src/main.rs"

[dependencies]
uor-r4-core = { path = "../../../../crates/uor-r4-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"
