[package]
name = "one-model-end-to-end-panel"
version = "0.1.0"
edition = "2021"
publish = false
description = "M-world v2 held-out-phrasing panels and the CPU-only stratified evidence lane for one-model-end-to-end"

# A standalone instrument, outside the repository's workspace, like
# docs/labs/m2-fresh-heldout-panel/instrument.
[workspace]
resolver = "2"

[features]
panel-writer = ["dep:uor-r4-training", "dep:uor-r4-core"]
cpu-parity = ["dep:uor-r4-integer", "dep:uor-r4-cpu-train", "dep:uor-r4-core"]

[[bin]]
name = "heldout-panel"
path = "src/main.rs"
required-features = ["panel-writer"]

[[bin]]
name = "m2-evidence"
path = "src/bin/m2-evidence.rs"
required-features = ["cpu-parity"]

[[bin]]
name = "served-reply-panel"
path = "src/bin/served-reply-panel.rs"
required-features = ["cpu-parity"]

[[bin]]
name = "corpus-eos-exposure"
path = "src/bin/corpus-eos-exposure.rs"

[[bin]]
name = "m2-sft-exclusions"
path = "src/bin/m2-sft-exclusions.rs"

[[bin]]
name = "corpus-panel-overlap"
path = "src/bin/corpus-panel-overlap.rs"
required-features = ["cpu-parity"]

[dependencies]
uor-r4-training = { path = "../../../../crates/uor-r4-training", optional = true }
uor-r4-core = { path = "../../../../crates/uor-r4-core", optional = true }
uor-r4-tokenizer = { path = "../../../../crates/uor-r4-tokenizer" }
uor-r4-integer = { path = "../../../../crates/uor-r4-integer", features = ["serving-wasm"], optional = true }
uor-r4-cpu-train = { path = "../../../../crates/uor-r4-cpu-train", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"

[dev-dependencies]
uor-r4-integer = { path = "../../../../crates/uor-r4-integer", features = ["fbs-synthetic", "serving-wasm"] }
