[package]
name = "m1-w2-code-utilization-instrument"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: detached from the repository workspace on purpose, so this
# instrument can never change what the workspace builds. It reads
# uor-r4-discrete (default features, so no `cuda`) and never edits it.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uor-r4-discrete = { path = "../../../../crates/uor-r4-discrete" }
