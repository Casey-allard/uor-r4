[package]
name = "admission-rank-fixture-runner"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: detached from the repository workspace on purpose, so this
# instrument can never change what the workspace builds or any uor-r4-discrete
# source/driver hash.
[workspace]

[features]
default = []
cuda = ["uor-r4-discrete/cuda", "dep:cudarc"]

[dependencies]
uor-r4-discrete = { path = "../../../../crates/uor-r4-discrete" }
cudarc = { version = "=0.19.10", default-features = false, features = ["std", "driver", "cuda-12080", "dynamic-linking"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[patch.crates-io]
cudarc = { path = "../../../../third_party/cudarc-0.19.10" }
arrayref = { path = "../../../../third_party/arrayref" }

[dev-dependencies]
tempfile = "3"
