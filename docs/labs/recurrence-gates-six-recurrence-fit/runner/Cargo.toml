[package]
name = "recurrence-gates-six-recurrence-fit-runner"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone D37 offline-float six-recurrence fit and D11 integer export runner (#2890)"

# Standalone workspace inside docs/labs/recurrence-gates-six-recurrence-fit/runner
# so every file remains inside the item's declared scope while reusing crates/uor-r4-float-train.
[workspace]

[features]
default = []
cuda = ["uor-r4-float-train/cuda", "candle-core/cuda", "dep:cudarc"]

[[bin]]
name = "recurrence-six-fit"
path = "src/main.rs"

[dependencies]
candle-core = "0.9"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "f16", "cuda-version-from-build-system"], optional = true }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uor-r4-float-train = { path = "../../../../crates/uor-r4-float-train" }
