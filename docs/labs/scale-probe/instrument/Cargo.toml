[package]
name = "scale-probe-instrument"
version = "0.1.0"
edition = "2021"
publish = false
description = "P5 scale-probe laptop side: nested mixes, count-table grading, paired-band comparison"

# A standalone instrument, outside the repository's workspace, like
# docs/labs/one-model-end-to-end/instrument.
[workspace]
resolver = "2"

[[bin]]
name = "scale-probe"
path = "src/main.rs"

[dependencies]
uor-r4-core = { path = "../../../../crates/uor-r4-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"
