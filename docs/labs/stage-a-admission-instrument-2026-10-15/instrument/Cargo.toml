[package]
name = "stage-a-admission"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
cuda = ["uor-r4-discrete/cuda"]

[dependencies]
uor-r4-discrete = { path = "../../../../crates/uor-r4-discrete" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[patch.crates-io]
cudarc = { path = "../../../../third_party/cudarc-0.19.10" }
arrayref = { path = "../../../../third_party/arrayref" }

[dev-dependencies]
tempfile = "3"
