<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#ffffff"/>

  <text x="600" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#111827">
    Fixed Geometric Routing from Angular Structure
  </text>

  <rect x="40" y="105" width="180" height="130" rx="14" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="130" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937">
    Input
  </text>
  <text x="130" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">
    L2-normalized
  </text>
  <text x="130" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">
    embedding x in R^D
  </text>

  <rect x="280" y="105" width="210" height="130" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="385" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937">
    Fixed 4D Projection
  </text>
  <text x="385" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">
    Select dims
  </text>
  <text x="385" y="207" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">
    (3, 65, 2, 21)
  </text>
  <text x="385" y="232" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563">
    (a, b, c, d)
  </text>

  <rect x="550" y="85" width="245" height="170" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="672" y="125" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937">
    Hopf-Style Coordinates
  </text>
  <text x="672" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">
    chi_u, delta, alpha
  </text>
  <text x="672" y="193" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563">
    optional transport term:
  </text>
  <text x="672" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563">
    alpha_t = alpha + 0.5 lambda cos(2 chi) delta
  </text>

  <rect x="855" y="105" width="190" height="130" rx="14" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="950" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937">
    Sectorization
  </text>
  <text x="950" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">
    k_chi x k_delta x k_alpha
  </text>
  <text x="950" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">
    subject to budget K
  </text>

  <rect x="1090" y="105" width="80" height="130" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1130" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f2937">
    Output
  </text>
  <g transform="translate(1106,165)">
    <rect x="0" y="0" width="18" height="18" fill="#fde68a" stroke="#9a3412" stroke-width="1.5"/>
    <rect x="20" y="0" width="18" height="18" fill="#fed7aa" stroke="#9a3412" stroke-width="1"/>
    <rect x="40" y="0" width="18" height="18" fill="#fed7aa" stroke="#9a3412" stroke-width="1"/>
    <rect x="0" y="20" width="18" height="18" fill="#fed7aa" stroke="#9a3412" stroke-width="1"/>
    <rect x="20" y="20" width="18" height="18" fill="#fed7aa" stroke="#9a3412" stroke-width="1"/>
    <rect x="40" y="20" width="18" height="18" fill="#fed7aa" stroke="#9a3412" stroke-width="1"/>
  </g>
  <text x="1130" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563">
    fixed routing sector
  </text>

  <line x1="220" y1="170" x2="280" y2="170" stroke="#6b7280" stroke-width="3"/>
  <polygon points="280,170 268,164 268,176" fill="#6b7280"/>
  <line x1="490" y1="170" x2="550" y2="170" stroke="#6b7280" stroke-width="3"/>
  <polygon points="550,170 538,164 538,176" fill="#6b7280"/>
  <line x1="795" y1="170" x2="855" y2="170" stroke="#6b7280" stroke-width="3"/>
  <polygon points="855,170 843,164 843,176" fill="#6b7280"/>
  <line x1="1045" y1="170" x2="1090" y2="170" stroke="#6b7280" stroke-width="3"/>
  <polygon points="1090,170 1078,164 1078,176" fill="#6b7280"/>

  <rect x="260" y="300" width="680" height="62" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="600" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">
    On the semantic proxy, structured embeddings occupy a non-uniform subset of sectors,
  </text>
  <text x="600" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#374151">
    which yields a concentrated effective routing footprint.
  </text>
</svg>
