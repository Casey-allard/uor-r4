[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mudbench"
version = "0.0.0"
description = "MUDBench Phase 0 scaffold"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mudbench = "cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli*"]
