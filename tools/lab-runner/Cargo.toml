[package]
name = "lab-runner"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Detached local job runner for UOR-R4 labs: filesystem queue, admission control, kill criteria and ledger charging"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[[bin]]
name = "lab-runner"
path = "src/bin/lab-runner.rs"
