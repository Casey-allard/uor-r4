[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "uor-project-knowledge"
version = "0.1.0"
description = "Local provenance-indexed UOR project knowledge and roadmap retrieval"
requires-python = ">=3.12"
dependencies = ["mcp==1.28.1"]

[project.scripts]
uor-knowledge = "uor_knowledge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uor_knowledge"]
