[workspace]
members = [
    "crates/uor-r4-core",
    "crates/uor-r4-graph-format",
    "crates/uor-r4-router",
    "crates/uor-r4-proof-model",
    "crates/uor-r4-graph-compiler",
    "crates/uor-r4-graph-runtime",
    "crates/uor-r4-graph-certify",
    "crates/uor-r4-graph-cli",
    "crates/uor-r4-api",
    "crates/repo-model",
    "crates/repo-conformance",
    "crates/uor-r4-naf",
    "xtask",
]
default-members = [
    ".",
    "crates/uor-r4-core",
    "crates/uor-r4-graph-format",
    "crates/uor-r4-router",
    "crates/uor-r4-proof-model",
    "crates/uor-r4-graph-runtime",
]
exclude = ["uor_standards", "crates/uor-r4-graph-format/fuzz", "research", "third_party/arrayref"]
resolver = "2"

[package]
name = "uor-r4-wasm-router"
license = "MIT"
version = "0.1.0"
edition = "2021"
default-run = "r4"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "r4"
path = "src/main.rs"

[features]
# #804 measurement-only exception passthrough (maintainer-approved
# 2026-08-18) — see uor-r4-model-source's feature of the same name.
# Never a default; observation builds opt in explicitly:
#   cargo build --release --features observation-blas-exception
observation-blas-exception = [
    "uor-r4-model-source/observation-blas-exception",
    "uor-r4-graph-cli/observation-blas-exception",
]

[dependencies]
uor-r4-core = { version = "0.1.0", path = "crates/uor-r4-core" }
uor-r4-graph-format = { version = "0.1.0", path = "crates/uor-r4-graph-format" }
uor-r4-proof-model = { version = "0.1.0", path = "crates/uor-r4-proof-model" }
uor-r4-graph-runtime = { version = "0.1.0", path = "crates/uor-r4-graph-runtime" }
uor-r4-router = { version = "0.1.0", path = "crates/uor-r4-router" }
uor-addr = { version = "0.2.0", git = "https://github.com/UOR-Foundation/uor-addr.git", rev = "165b51e3e2113ee5d032730cde709335d4fe9b60", default-features = false, features = ["alloc"] }
uor-foundation-sdk = { version = "0.5.2", git = "https://github.com/UOR-Foundation/UOR-Framework.git", rev = "51c01382200b0179d6640b07e9c8119364ab69a1" }
uor-foundation = { version = "0.5.2", git = "https://github.com/UOR-Foundation/UOR-Framework.git", rev = "51c01382200b0179d6640b07e9c8119364ab69a1", default-features = false, features = ["std", "serde"] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
wasm-bindgen = "0.2.92"
blake3 = "=1.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uor-r4-model-source = { version = "0.1.0", path = "crates/uor-r4-model-source" }
uor-r4-graph-compiler = { version = "0.1.0", path = "crates/uor-r4-graph-compiler" }
uor-r4-graph-certify = { version = "0.1.0", path = "crates/uor-r4-graph-certify" }
uor-r4-graph-cli = { version = "0.1.0", path = "crates/uor-r4-graph-cli" }
uor-r4-api = { version = "0.1.0", path = "crates/uor-r4-api" }
libc = "0.2"
rustyline = "14.0"

[dev-dependencies]
uor-foundation-verify = { version = "0.5.2", git = "https://github.com/UOR-Foundation/UOR-Framework.git", rev = "51c01382200b0179d6640b07e9c8119364ab69a1" }
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "bdd"
harness = false

# #618: uor-addr -> uor-prism pull uor-foundation/-sdk 0.5.2 from crates.io,
# which puts a second, type-incompatible copy of each in the lock next to our
# git pins. The git source cannot be dropped instead: uor-foundation-verify is
# published only in the Framework git workspace, and verify_trace consumes
# types minted by our uor_foundation, so all three must share one source.
# Patch the registry copies onto the same pinned rev: one build per crate, one
# type identity across uor-addr, uor-prism, and r4. The rev's foundation
# crates are code-identical to published 0.5.2 (README-only delta, audited in
# #618); bump these together with the [dependencies] pins, never separately.
[patch.crates-io]
uor-foundation = { git = "https://github.com/UOR-Foundation/UOR-Framework.git", rev = "51c01382200b0179d6640b07e9c8119364ab69a1" }
uor-foundation-sdk = { git = "https://github.com/UOR-Foundation/UOR-Framework.git", rev = "51c01382200b0179d6640b07e9c8119364ab69a1" }

# #868: `arrayref` 0.3.x was yanked upstream (a maintainer yank, not a RUSTSEC
# advisory) and is pulled only transitively by blake3 1.5.x, which this graph
# cannot move off (uor-prism-crypto caps blake3 <1.6, and every 1.5.x still
# bundles arrayref; blake3 drops it only at >=1.6). Vendor the exact 0.3.9 bytes
# in-tree and source them from a local path: cargo-deny's yanked check is
# registry-only, so the advisory genuinely clears — nothing suppressed — and the
# bytes blake3 links are unchanged, so κ / CID output stays bit-identical. See
# third_party/arrayref/README.md. Remove this patch (and the vendored dir + the
# workspace exclude) when uor-addr/uor-prism-crypto move to a blake3 (>=1.6) that
# no longer depends on arrayref. Tracked in #868.
arrayref = { path = "third_party/arrayref" }
