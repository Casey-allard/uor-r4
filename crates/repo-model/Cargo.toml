[package]
name = "repo-model"
license = "MIT"
description = "Typed registries parsed from conformance/*.toml: uor-r4's single source of every registered conformance claim (R1). Build/CI only, never a dependency of a shipped crate."
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
toml = "0.8"
