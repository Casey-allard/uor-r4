[package]
name = "uor-r4-api"
license = "MIT"
version = "0.1.0"
edition = "2021"
description = "Typed compile and engine APIs over the uor-r4 transformerless graph stack, for library consumers"
# Legacy-crate repair (19 Oct 2026): the bins, examples and the other integration
# tests drive the historical engine and model APIs (lib.rs) and are not built;
# see src/native_support.rs. canonical_quality_baseline_934 uses only the native
# surface; it follows evidence links the docs cutover (#2789) moved to archive/
# through the cutover move map.
autobins = false
autoexamples = false
autotests = false

[lib]
path = "src/native_support.rs"

[[test]]
name = "canonical_quality_baseline_934"

[features]
# Explicit CPU floating-point research boundary; never enabled by default.
learned-reference = ["uor-r4-core/learned-reference"]
default = ["full"]
# Filesystem-free production loading and serving. This is the only API surface
# pulled into the browser build; compiler orchestration and evaluation stay
# native-only.
runtime = []
full = ["runtime", "dep:uor-r4-graph-compiler"]

[dependencies]
uor-r4-core = { version = "0.1.0", path = "../uor-r4-core" }
uor-r4-graph-format = { version = "0.1.0", path = "../uor-r4-graph-format" }
uor-r4-graph-compiler = { version = "0.1.0", path = "../uor-r4-graph-compiler", optional = true }
uor-r4-graph-certify = { version = "0.1.0", path = "../uor-r4-graph-certify" }
# #836: the deployed engine consumes the segment-lane SegmentSession primitive.
uor-r4-graph-runtime = { version = "0.1.0", path = "../uor-r4-graph-runtime" }
# uor-r4-model-source and uor-r4-graph-cli (transformer teacher: softmax
# attention, dense matmul) are excluded under D29; the historical modules that
# use them are preserved, not built.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Pinned to the workspace-wide blake3 version.
blake3 = "=1.5.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
libm = "0.2"

[dev-dependencies]
# #834 teacher-grounded causal-influence run: the ignored harness reads the
# recorded corpus (teacher argmax) and drives the deployed engine directly.
uor-r4-core = { version = "0.1.0", path = "../uor-r4-core" }
uor-r4-graph-compiler = { version = "0.1.0", path = "../uor-r4-graph-compiler" }

