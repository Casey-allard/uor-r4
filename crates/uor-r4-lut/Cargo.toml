[package]
name = "uor-r4-lut"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Integer-only serving of converted Llama checkpoints: 4-bit table-driven weight maps without a multiplier (owner decision D10)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"
rayon = "1.10"
uor-r4-simd = { path = "../uor-r4-simd" }
uor-r4-tokenizer = { path = "../uor-r4-tokenizer" }
