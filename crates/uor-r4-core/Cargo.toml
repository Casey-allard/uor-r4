[package]
name = "uor-r4-core"
license = "MIT"
version = "0.1.0"
edition = "2021"
description = "Core R4 engine: geometric routing mathematics and integrated transformerless local inference"

[dependencies]
uor-r4-graph-format = { version = "0.1.0", path = "../uor-r4-graph-format" }
uor-r4-model-source = { version = "0.1.0", path = "../uor-r4-model-source" }
sha2 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
hex = "0.4.3"
blake3 = "=1.5.0"
ciborium = "0.2"
uor-r4-graph-runtime = { version = "0.1.0", path = "../uor-r4-graph-runtime" }
uor-addr = { version = "0.2.0", git = "https://github.com/UOR-Foundation/uor-addr.git", rev = "165b51e3e2113ee5d032730cde709335d4fe9b60", default-features = false, features = ["alloc"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
libm = "0.2"

[features]
# Measurement-only surface for the #330 isolated dot-scan microbenchmark.
# Off by default: it exposes no deployed prediction-path behavior, only a
# read-only handle onto the already-built SIMD dot tables.
bench-internals = []

[dev-dependencies]
serde_json = "1.0"
proptest = "1.4.0"
rayon = "1.10.0"

[[bench]]
name = "transformerless_dot"
harness = false
