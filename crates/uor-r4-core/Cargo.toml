[package]
name = "uor-r4-core"
license = "MIT"
version = "0.1.0"
edition = "2021"
description = "Core R4 engine: geometric routing mathematics and integrated transformerless local inference"

[lib]
path = "src/native_support.rs"

[dependencies]
uor-r4-integer = { version = "0.1.0", path = "../uor-r4-integer" }
uor-r4-tokenizer = { version = "0.1.0", path = "../uor-r4-tokenizer" }
# Numerical source executors are preserved in place but excluded from this crate.
uor-r4-source-interface = { version = "0.1.0", path = "../uor-r4-source-interface" }
sha2 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
blake3 = "=1.5.0"
uor-addr = { version = "0.2.0", path = "../../third_party/uor-addr-0.2.0", default-features = false, features = ["alloc"] }
libm = "0.2"
memmap2 = "0.9"

[features]
# Explicit CPU floating-point research boundary; never enabled by default.
learned-reference = []
# Measurement-only surface for the #330 isolated dot-scan microbenchmark.
# Off by default: it exposes no deployed prediction-path behavior, only a
# read-only handle onto the already-built SIMD dot tables.
bench-internals = []

[dev-dependencies]
serde_json = "1.0"
proptest = "1.4.0"
rayon = "1.10.0"

[[bench]]
name = "transformerless_dot"
harness = false
