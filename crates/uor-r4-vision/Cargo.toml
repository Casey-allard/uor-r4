[package]
name = "uor-r4-vision"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic integer RGBA-to-R4 patch decomposition for UOR-R4"
publish = false

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
blake3 = "=1.5.0"
rayon = { version = "1.10", optional = true }

[dev-dependencies]
blake3 = "=1.5.0"
