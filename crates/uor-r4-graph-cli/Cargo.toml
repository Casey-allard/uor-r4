[package]
name = "uor-r4-graph-cli"
license = "MIT"
version = "0.1.0"
edition = "2024"
# Legacy-crate repair (19 Oct 2026): every integration test except
# scale_sweep_script_729 drives the historical dispatcher (lib.rs) or the
# model-source teacher and is not built; see src/native_support.rs. The #804
# observation-blas-exception feature (Apple Accelerate BLAS) is removed with the
# model-source link it enabled; BLAS/matmul is excluded under D29/D30.
autotests = false

[lib]
path = "src/native_support.rs"

[[test]]
name = "scale_sweep_script_729"

[dependencies]
uor-r4-core = { version = "0.1.0", path = "../uor-r4-core" }
uor-r4-graph-compiler = { version = "0.1.0", path = "../uor-r4-graph-compiler" }
uor-r4-graph-certify = { version = "0.1.0", path = "../uor-r4-graph-certify" }
uor-r4-graph-runtime = { version = "0.1.0", path = "../uor-r4-graph-runtime" }
# uor-r4-model-source (transformer teacher: softmax attention, dense matmul) is
# excluded under D29; the kept modules take SourceUnavailable from the interface.
uor-r4-source-interface = { version = "0.1.0", path = "../uor-r4-source-interface" }
serde = { version = "1.0", features = ["derive"] }
# #613: `float_roundtrip` makes float PARSING correctly-rounded, so a metric
# serialized into a checkpoint deserializes bit-for-bit identically — the
# guarantee resume's byte-identity rests on (serde_json's default parser can
# land 1 ULP off, which diverges a resumed report from a clean one).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
blake3 = "1.5.0"
uor-r4-graph-format = { version = "0.1.0", path = "../uor-r4-graph-format" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The #622/#626 tropical_2hop_626 parity harness and its uor-matmul-core dev
# reference are not built (uor-matmul is excluded under D29).
