[package]
name = "uor-r4-training"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline Rust autodiff and reference evaluation tools for UOR-R4 research"

[features]
# The parquet reader for `prepare-chat-parquet` and `prepare-text-parquet` only; no model or training path uses it.
parquet-input = ["dep:parquet"]
default = []
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "dep:candle-metal-kernels",
    "dep:objc2-metal",
]
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:cudarc"]
cpu-accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
reference-accelerate = ["uor-r4-model-source/observation-blas-exception"]

[dependencies]
uor-r4-integer = { version = "0.1.0", path = "../uor-r4-integer" }
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }
candle-metal-kernels = { version = "=0.9.2", optional = true }
objc2-metal = { version = "=0.3.2", optional = true }
cudarc = { version = "0.19.0", default-features = false, features = ["std", "driver", "nvrtc", "cuda-version-from-build-system", "dynamic-linking"], optional = true }
safetensors = { version = "=0.6.2", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"
uor-r4-model-source = { path = "../uor-r4-model-source" }
uor-r4-core = { path = "../uor-r4-core" }
uor-r4-lut = { path = "../uor-r4-lut" }
uor-r4-tokenizer = { path = "../uor-r4-tokenizer" }
rayon = "1.10"
parquet = { version = "60.0.0", default-features = false, features = ["snap", "zstd"], optional = true }
half = "2.7.1"

[[bin]]
name = "prepare-chat-parquet"
required-features = ["parquet-input"]

[[bin]]
name = "prepare-text-parquet"
required-features = ["parquet-input"]
