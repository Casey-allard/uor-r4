[package]
name = "uor-r4-discrete"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Exact SpiralCore/FBS learning proposals and shared geometric vector writer"

[features]
default = []
cuda = ["dep:cudarc"]
qualification = []
# Independent raw-count reference for the P1 GPU-to-D11 replay instrument.
count-oracle = []

[dependencies]
cudarc = { version = "=0.19.10", default-features = false, features = ["std", "driver", "cuda-12080", "dynamic-linking"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
uor-r4-native-vector = { path = "../uor-r4-native-vector" }

[build-dependencies]
uor-r4-core = { path = "../uor-r4-core", default-features = false }

[[bin]]
name = "discrete-stack"
path = "src/main.rs"

[[bin]]
name = "prime-zeta-qualify"
path = "src/bin/prime-zeta-qualify.rs"

[[bin]]
name = "prime-zeta-codebook"
path = "src/bin/prime-zeta-codebook.rs"

[[bin]]
name = "rows-qualify"
path = "src/bin/rows-qualify.rs"

[[bin]]
name = "rowsk-qualify"
path = "src/bin/rowsk-qualify.rs"

[[bin]]
name = "bvgk-qualify"
path = "src/bin/bvgk-qualify.rs"

[[bin]]
name = "coverage-census"
path = "src/bin/coverage-census.rs"

[[bin]]
name = "address-key-grade"
path = "src/bin/address-key-grade.rs"

[[bin]]
name = "order-slice-freeze"
path = "src/bin/order-slice-freeze.rs"

[[bin]]
name = "w2-capacity"
path = "src/bin/w2-capacity.rs"

[[bin]]
name = "w2-assemble"
path = "src/bin/w2-assemble.rs"

[[bin]]
name = "a8-qualify-stage"
path = "src/bin/a8-qualify-stage.rs"

[[bin]]
name = "position-qualify"
path = "src/bin/position-qualify.rs"

[[bin]]
name = "carrier-fresh-slice"
path = "src/bin/carrier-fresh-slice.rs"

[[bin]]
name = "carrier-arms"
path = "src/bin/carrier-arms.rs"

[[bin]]
name = "stage-t-run"
path = "src/bin/stage-t-run.rs"

[[bin]]
name = "trunk-run"
path = "src/bin/trunk-run.rs"

[[bin]]
name = "writer-bucket-qualify"
path = "src/bin/writer-bucket-qualify.rs"

[[bin]]
name = "wider-carrier-qualify"
path = "src/bin/wider-carrier-qualify.rs"

[[bin]]
name = "wider-carrier-run"
path = "src/bin/wider-carrier-run.rs"

[[bin]]
name = "within-cell-writer-run"
path = "src/bin/within-cell-writer-run.rs"

[[bin]]
name = "ngram-count-probe"
path = "src/bin/ngram-count-probe.rs"





[dev-dependencies]
# Test-only: the CUDA leg of the native-space parity contract (src/cpu_oracle_parity.rs)
# compares the kernels with the CPU training oracle. Bytes and integer words cross; no types.
uor-r4-cpu-train = { path = "../uor-r4-cpu-train" }
# Test-only: the CPU Pick oracle in src/pick_read_cuda.rs takes the SpiralCore
# composition table (claude-408).
uor-r4-core = { path = "../uor-r4-core", default-features = false }
# Test-only: src/pick_read_cuda.rs checks the CUDA Pick read against the served
# D11 artifact (claude-408).
uor-r4-integer = { path = "../uor-r4-integer" }
