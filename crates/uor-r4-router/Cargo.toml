[package]
name = "uor-r4-router"
license = "MIT"
version = "0.1.0"
edition = "2021"
description = "R4 router support: token-history session signatures, the tier cascade and the R4 UOR host bounds; the historical UorR4Router engine is preserved behind the non-default legacy-engine feature"

# #2345 retired the floating-point `uor-r4-core` surface (`semantic`,
# `zeta_projection`, `R4Vector`, `get_word_vector`, ...). The historical
# `UorR4Router` engine in `src/lib.rs` (plus `geometry`, `decoder_memory`,
# `benchmark`) is built on those retired APIs, so it does not build against the
# current core; it is preserved in place as evidence. The crate root is the
# small engine-free facade in `src/facade.rs` (same pattern as uor-r4-core's
# `[lib] path`), which builds natively and on wasm32.
[lib]
path = "src/facade.rs"

[features]
# Historical engine on retired core APIs; does not build against the current
# core (#2345); preserved as evidence. Never a default; D23/D25/D32 forbid
# re-enabling the retired floating-point core modules it needs.
legacy-engine = ["dep:uor-addr"]

[dependencies]
uor-r4-core = { version = "0.1.0", path = "../uor-r4-core" }
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"
blake3 = "1.5.0"
# The git uor-addr is used only by the historical engine (src/lib.rs); it pulls
# uor-prism-tensor/-numerics (D29-excluded), so it is linked only under
# legacy-engine (legacy-crate repair, 19 Oct 2026).
uor-addr = { version = "0.2.0", git = "https://github.com/UOR-Foundation/uor-addr.git", rev = "165b51e3e2113ee5d032730cde709335d4fe9b60", default-features = false, features = ["alloc"], optional = true }
uor-foundation = { version = "0.5.2", git = "https://github.com/UOR-Foundation/UOR-Framework.git", rev = "51c01382200b0179d6640b07e9c8119364ab69a1", default-features = false, features = ["std", "serde"] }
uor-foundation-sdk = { version = "0.5.2", git = "https://github.com/UOR-Foundation/UOR-Framework.git", rev = "51c01382200b0179d6640b07e9c8119364ab69a1" }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
