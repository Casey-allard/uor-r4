[package]
name = "uor-r4-integer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone integer execution of retained UOR-R4 recurrent attention models"
autobins = false

[lib]
path = "src/native_geometry.rs"

[features]
# Compatibility name only: selecting historical executors fails at compile time.
historical-runtime = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"
blake3 = "=1.5.0"


[[bin]]
name = "uor-chat"
path = "src/bin/uor-chat.rs"
required-features = ["historical-runtime"]

[[bin]]
name = "uor-r4-integer"
path = "src/bin/uor-r4-integer.rs"
required-features = ["historical-runtime"]

[[bin]]
name = "verify-integer"
path = "src/bin/verify-integer.rs"
required-features = ["historical-runtime"]

[[bin]]
name = "uor-r4-stack"
path = "src/bin/uor-r4-stack.rs"
required-features = ["historical-runtime"]
