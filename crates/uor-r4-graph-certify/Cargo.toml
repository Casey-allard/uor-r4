[package]
name = "uor-r4-graph-certify"
license = "MIT"
version = "0.1.0"
edition = "2021"

[dependencies]
uor-r4-core = { version = "0.1.0", path = "../uor-r4-core" }
uor-r4-graph-format = { version = "0.1.0", path = "../uor-r4-graph-format", default-features = false }
uor-r4-graph-runtime = { version = "0.1.0", path = "../uor-r4-graph-runtime" }
uor-r4-model-source = { version = "0.1.0", path = "../uor-r4-model-source" }
uor-r4-graph-compiler = { version = "0.1.0", path = "../uor-r4-graph-compiler" }

# Certificate formatting and CID hashing
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
blake3 = "1.5"
rayon = "1.10.0"

[dev-dependencies]
# The original f64 geometric router — measurement harnesses only
# (issue #421 M-R1 reconnection), never the deployed scoring path.
uor-r4-router = { version = "0.1.0", path = "../uor-r4-router" }
