[package]
name = "uor-r4-cpu-train"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Isolated CPU development trainers for the UOR-R4 geometric model"
publish = false

[dependencies]
blake3 = "1.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uor-r4-core = { path = "../uor-r4-core" }
uor-r4-discrete = { path = "../uor-r4-discrete" }
uor-r4-integer = { path = "../uor-r4-integer", features = ["fbs-synthetic", "serving-wasm"] }

[[bin]]
name = "cpu-writer-bench"
path = "src/bin/cpu-writer-bench.rs"

[[bin]]
name = "cpu-fbs-forward-bench"
path = "src/bin/cpu-fbs-forward-bench.rs"

[[bin]]
name = "cpu-rank-margin-bench"
path = "src/bin/cpu-rank-margin-bench.rs"

[[bin]]
name = "cpu-counterfactual-bench"
path = "src/bin/cpu-counterfactual-bench.rs"

[[bin]]
name = "cpu-panel-export-bench"
path = "src/bin/cpu-panel-export-bench.rs"

[[bin]]
name = "cpu-public-discrete-parity"
path = "src/bin/cpu-public-discrete-parity.rs"

[[bin]]
name = "cpu-discrete-route-bench"
path = "src/bin/cpu-discrete-route-bench.rs"

[[bin]]
name = "cpu-public-fbs-parity"
path = "src/bin/cpu-public-fbs-parity.rs"
