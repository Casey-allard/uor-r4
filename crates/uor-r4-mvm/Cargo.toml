[package]
name = "uor-r4-mvm"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"
publish = false
description = "LexLean-derived RV64IMAC Linux-userland emulator for the UOR Studio workbench (issue #3939)."

[lib]
name = "uor_r4_mvm"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.92", optional = true }
js-sys = { version = "0.3", optional = true }
