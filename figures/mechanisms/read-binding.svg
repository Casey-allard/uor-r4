<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 642" width="960" height="642" role="img">
<title>Read binding</title>
<desc>Three panels. Top: attention bars over the passage "Ana's locker is 47. Ben's locker is 12. What is Ana's locker?". Before training the attention mass is split, 0.73 on the bound value 47 and 0.14 on the competing value 12. After supervision it piles onto 47 at about 0.90, with the three seed values 0.896, 0.899 and 0.905 marked as ticks. Bottom left: wrong-value answers over 120 memory rows fall from 47 to 30, and from 49 to 23 with four times longer training. Bottom right: the memory score on a 40-row panel is 24 of 40 unablated, and falls to 7, 2 and 0 when read layer 5, 2 or 8 is silenced. Attention masses are measured on training data.</desc>
<style>
svg{--bg:#ffffff;--ink:#1f2328;--body:#2b3138;--muted:#57606a;--rule:#d0d7de;--panel:#f6f8fa;--blue:#0072b2;--sky:#56b4e9;--green:#007a5e;--orange:#e69f00;--verm:#d55e00;--purple:#7a4fa3;--pink:#cc79a7;--active:#007a5e;--ready:#b06d00;--parked:#7a4fa3}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--ink:#e6edf3;--body:#c9d1d9;--muted:#8b949e;--rule:#30363d;--panel:#161b22;--blue:#58a6ff;--sky:#79c0ff;--green:#3fb950;--orange:#f0b72f;--verm:#ff7b72;--purple:#bc8cff;--pink:#f778ba;--active:#3fb950;--ready:#f0b72f;--parked:#bc8cff}}
.bg{fill:var(--bg)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:13px}
.title{font-size:19px;font-weight:600}
.h{font-size:14px;font-weight:600}
.b{font-weight:600}
.n{font-size:11.5px;fill:var(--muted)}
.body{fill:var(--body)}
.mut{fill:var(--muted)}
.c{text-anchor:middle}
.e{text-anchor:end}
.panel{fill:var(--panel);stroke:var(--rule);stroke-width:1}
.rule{fill:none;stroke:var(--rule);stroke-width:1}
.dot{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.arrow{fill:none;stroke:var(--ink);stroke-width:1.5}
.fi{fill:var(--ink)}
.fm{fill:var(--muted)}
.fb{fill:var(--blue)}
.fv{fill:var(--verm)}
.tok{fill:var(--bg);stroke:var(--rule);stroke-width:1}
.tokb{fill:var(--blue);fill-opacity:.15;stroke:var(--blue);stroke-width:2}
.tokc{fill:var(--orange);fill-opacity:.15;stroke:var(--orange);stroke-width:2;stroke-dasharray:5 3}
.mb{fill:var(--blue)}
.mc{fill:var(--orange)}
.base{fill:none;stroke:var(--muted);stroke-width:1}
.axl{fill:none;stroke:var(--rule);stroke-width:1}
.tickk{fill:none;stroke:var(--blue);stroke-width:2.5}
.ctl{fill:var(--muted);fill-opacity:.65}
.sup{fill:var(--blue)}
.dim{fill:var(--verm)}
.card{fill:var(--bg);stroke:var(--rule);stroke-width:1.5}
</style>
