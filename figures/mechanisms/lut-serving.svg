<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1018" width="960" role="img" aria-labelledby="t d">
<title id="t">D11 integer table serving</title>
<desc id="d">Three stacked panels. Panel A illustrates the dense/FBS 4-bit stack, not M1's table-native discrete schema: one projection built from adds and table reads. An integer activation x becomes a table of 16 multiples using additions only. Three 4-bit weight codes each select one slot, then group-scale shifts and a running sum. Panel B: exact integer exports. Older 29M outputs match their reference on 64 windows, while rounding those older weights cost 0.00883 and 0.009288 bits per byte. The current discrete M1 pair has exact 14,287-row DEV agreement and B4 pass, with DEV 7,002 / 7,001, Fresh V2 7,215 / 7,228 and p-f 7,850 / 7,872. Panel C: 44 native symbol ranges and seven WebAssembly serving symbols, all with zero float instructions; integer multiply and divide are allowed and counted since D80 and D81. The M1 pair serves at 10,876 / 10,566 native decode tok/s on Apple M1 under the bar-f remeasurement; the older close-grade bar-c rate is 11,026 / 10,573. A separate strip compares the 0.90 BPB bar with served readings of 1.20138, 1.24233 and 1.24402. The audit counts instructions and says nothing about model quality or useful conversation. On p-f, 62.5% of reference replies are verbatim TRAIN replies: reference-data overlap, not a generated-copy rate or new reply kinds.</desc>
