<text class="s mid" x="844" y="238">weight products:</text><text class="big mid" x="844" y="263">table reads</text>
<text class="n" x="32" y="290">The table holds 16 multiples of x (0, x, 2x … 15x), built once with additions only. Each 4-bit weight code picks one slot.</text>
<text class="n" x="32" y="308">Weights are 4-bit codes in groups of 32 with a one-byte scale, applied by shifts. The three codes drawn are illustrative.</text>

