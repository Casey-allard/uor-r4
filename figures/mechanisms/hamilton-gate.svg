<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" width="960" role="img" aria-labelledby="t d">
<title id="t">Hamilton rotation gate</title>
<desc id="d">Three parts. Left: what the gate does to length. Under a sigmoid gate the value arrow shrinks toward nothing as the gate input falls, with lengths 0.98, 0.73, 0.27 and 0.02 of the original. Under the Hamilton gate the arrow keeps its length and swings around a sphere, so the gate sets direction, not length. Middle: two feed-forward wirings side by side. SwiGLU runs gate, sigmoid, then times the up branch, and the sigmoid is banned and crossed out. Hamilton runs gate, divide by length, then a quaternion product with the up branch; the final label records that the gate is ACTIVE, trained and served in M1 and FBS. Right: the backward factor one over r plotted against the gate block length on log axes, rising to 10 to the 6 at zero length, with the 10 to the minus 12 guard marked. It is drawn from the formula, not a measurement.</desc>
<style>
svg { --bg:#ffffff; --ink:#1f2328; --body:#2b3138; --muted:#57606a; --rule:#d0d7de; --panel:#f6f8fa;
      --blue:#0072b2; --sky:#56b4e9; --green:#007a5e; --orange:#e69f00; --verm:#d55e00; --purple:#7a4fa3; --pink:#cc79a7;
      --active:#007a5e; --ready:#b06d00; --parked:#7a4fa3; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --ink:#e6edf3; --body:#c9d1d9; --muted:#8b949e; --rule:#30363d; --panel:#161b22;
      --blue:#58a6ff; --sky:#79c0ff; --green:#3fb950; --orange:#f0b72f; --verm:#ff7b72; --purple:#bc8cff; --pink:#f778ba;
      --active:#3fb950; --ready:#f0b72f; --parked:#bc8cff; } }
