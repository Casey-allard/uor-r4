<path class="nf sv w25 rnd" d="M716.0 128.6 L721.8 128.6 L727.6 128.6 L733.3 128.6 L739.1 128.6 L744.9 128.6 L750.7 128.6 L756.4 128.6 L762.2 128.6 L768.0 128.8 L773.8 129.2 L779.6 130.3 L785.3 132.9 L791.1 137.4 L796.9 143.4 L802.7 150.2 L808.4 157.2 L814.2 164.3 L820.0 171.4 L825.8 178.6 L831.6 185.7 L837.3 192.9 L843.1 200.0 L848.9 207.1 L854.7 214.3 L860.4 221.4 L866.2 228.6 L872.0 235.7 L877.8 242.9 L883.6 250.0 L889.3 257.1 L895.1 264.3 L900.9 271.4 L906.7 278.6 L912.4 285.7 L918.2 292.9 L924.0 300.0 "/>
<text class="n c" x="716" y="318">10⁻⁹</text><text class="n c" x="785" y="318">10⁻⁶</text><text class="n c" x="854" y="318">10⁻³</text><text class="n c" x="924" y="318">1</text>
<text class="n r" x="710" y="304">1</text><text class="n r" x="710" y="247">10²</text><text class="n r" x="710" y="190">10⁴</text><text class="n r" x="710" y="133">10⁶</text>
<text class="n b" x="728" y="122.6">peak 10⁶ at |g| = 0</text>
<text class="n b r" x="779" y="272">guard</text><text class="n b r" x="779" y="286">10⁻¹²</text>
<text class="n c" x="820" y="336">gate block length |g|</text>
<text class="tb" x="684" y="364">Backward factor 1 / r</text><text class="n" x="684" y="380">r = √(|g|² + 10⁻¹²). Above 10⁻⁶ the</text><text class="n" x="684" y="395">factor is 1/|g|; below it, it flattens.</text>
<text class="n b" x="684" y="418">From the formula, not a measurement.</text>
<text class="n" x="684" y="434">Weight decay can push a block toward</text><text class="n" x="684" y="449">zero; 256-step checked; full-rung open.</text>
<text class="n" x="16" y="492">Left: arrow lengths follow the sigmoid formula; Hamilton angles are illustrative. Right: drawn from the formula. Status: ACTIVE; trained and served in M1 and FBS.</text>
</svg>
