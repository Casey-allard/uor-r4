<rect class="bg" x="0" y="0" width="960" height="512"/>
<text class="ti" x="16" y="32">Hamilton rotation gate: it turns the signal instead of switching it off</text>
<rect class="panel" x="16" y="48" width="290" height="420" rx="8"/>
<text class="h" x="30" y="72">1  What the gate does to length</text>
<text class="b" x="30" y="100">Sigmoid gate (old)</text><text class="n" x="150" y="100">scales the value</text>
<text class="n" x="28" y="144">g = +4</text>
<line class="si w2" x1="84" y1="140" x2="270.6" y2="140" marker-end="url(#a-ink)"/>
<text class="n" x="28" y="168">g = +1</text>
<line class="si w2" x1="84" y1="164" x2="222.9" y2="164" marker-end="url(#a-ink)"/>
<text class="n" x="28" y="192">g = −1</text>
<line class="si w2" x1="84" y1="188" x2="135.1" y2="188" marker-end="url(#a-ink)"/>
<text class="n" x="28" y="216">g = −4</text>
<line class="si w2" x1="84" y1="212" x2="87.4" y2="212"/><circle class="fi" cx="84" cy="212" r="2.5"/>
<text class="n" x="30" y="242">arrow lengths follow σ(g): 0.98, 0.73, 0.27, 0.02</text>
<line class="rl" x1="28" y1="254" x2="294" y2="254"/>
<text class="b" x="30" y="276">Hamilton gate (new)</text><text class="n" x="170" y="276">turns the value</text>
<circle class="nf sm w15" cx="150" cy="354" r="52"/><ellipse class="nf sm w1" cx="150" cy="354" rx="52" ry="17"/><ellipse class="nf sm w1 o5" cx="150" cy="354" rx="17" ry="52"/>
<line class="sb w2" x1="150" y1="354" x2="99.8" y2="340.5" marker-end="url(#a-blue)"/>
<line class="sb w2" x1="150" y1="354" x2="125.6" y2="308.1" marker-end="url(#a-blue)"/>
<line class="sb w2" x1="150" y1="354" x2="174.4" y2="308.1" marker-end="url(#a-blue)"/>
<line class="sb w2" x1="150" y1="354" x2="201.8" y2="349.5" marker-end="url(#a-blue)"/>
<path class="nf sm w1 dash" d="M89.1 337.7 A63 63 0 0 1 212.8 348.5" marker-end="url(#a-muted)"/>
<circle class="fi" cx="150" cy="354" r="2.5"/>
<text class="n" x="226" y="372">gate input</text><text class="n" x="226" y="386">sweeps</text>
<text class="tb" x="30" y="426">The gate sets direction, not length.</text>
<text class="n" x="30" y="442">Output length stays |u| unless the gate block</text><text class="n" x="30" y="457">is near zero (below about 10⁻⁶).</text>
<rect class="panel" x="318" y="48" width="340" height="420" rx="8"/>
<text class="h" x="332" y="72">2  Two feed-forward wirings</text>
<text class="tb c" x="392" y="100">SwiGLU (old)</text><text class="tb c" x="582" y="100">Hamilton (new)</text>
<rect class="box" x="336" y="110" width="112" height="28" rx="5"/><text class="t c" x="392" y="129">gate g</text>
<path class="nf sm w15" d="M392 138V158" marker-end="url(#a-muted)"/>
<path class="nf sm w15" d="M392 198V222" marker-end="url(#a-muted)"/>
<path class="nf sm w15" d="M392 262V282" marker-end="url(#a-muted)"/>
<rect class="box" x="336" y="282" width="112" height="28" rx="5"/><text class="t c" x="392" y="301">output</text>
<rect class="box" x="526" y="110" width="112" height="28" rx="5"/><text class="t c" x="582" y="129">gate g</text>
<path class="nf sm w15" d="M582 138V158" marker-end="url(#a-muted)"/>
<path class="nf sm w15" d="M582 198V222" marker-end="url(#a-muted)"/>
<path class="nf sm w15" d="M582 262V282" marker-end="url(#a-muted)"/>
<rect class="box" x="526" y="282" width="112" height="28" rx="5"/><text class="t c" x="582" y="301">output</text>
<rect class="box sv" x="336" y="158" width="112" height="40" rx="5"/><text class="t c" x="392" y="175">sigmoid</text><text class="n b c fv" x="392" y="191">banned</text>
<line class="sv w25 rnd" x1="340" y1="196" x2="444" y2="160"/><line class="sv w25 rnd" x1="340" y1="160" x2="444" y2="196"/>
<rect class="box sb" x="526" y="158" width="112" height="40" rx="5"/><text class="t c" x="582" y="175">divide by length</text><text class="n c" x="582" y="191">q = g / r</text>
<rect class="box" x="336" y="222" width="112" height="40" rx="5"/><text class="t c" x="392" y="239">multiply by</text><text class="t c" x="392" y="255">the up branch</text>
<rect class="box sb" x="526" y="222" width="112" height="40" rx="5"/><text class="t c" x="582" y="239">Hamilton product</text><text class="n c" x="582" y="255">q ⊗ u</text>
<rect class="box" x="466" y="232" width="42" height="20" rx="10"/><text class="n b c" x="487" y="246">up u</text>
<path class="nf sm w1" d="M466 242H450" marker-end="url(#a-muted)"/><path class="nf sm w1" d="M508 242H524" marker-end="url(#a-muted)"/>
<rect class="box sb" x="500" y="338" width="140" height="56" rx="6"/><text class="n c" x="570" y="356">Now: table reads serve</text><text class="n c" x="570" y="371">earlier /4 snapped;</text><text class="n c" x="570" y="386">/5 exact rotations</text>
<path class="nf sm w1 dash" d="M638 242H650V366H643" marker-end="url(#a-muted)"/>
<text class="n" x="332" y="424">The same operation is the output gate of</text><text class="n" x="332" y="440">the geometric recurrence.</text>
