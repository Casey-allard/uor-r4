<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" role="img" aria-labelledby="t d">
<title id="t">The routed read</title>
<desc id="d">A ternary tree over 27 earlier tokens. The query enters at the top. At each of three levels the three child ports of the current node are lit with their L1 distance from the framed query to the port's orbit root, and the nearest is highlighted; a rotation step is added to a chain at the left. The path ends at exactly one leaf, circled and labelled picked up; the other leaves are greyed. Inset: comparisons per read for a scored read (27, 81, 243, one per earlier position) against a routed read (at most levels times 16 per block: 48, 64, 80), labelled as upper bounds from the kernel description. The query and frames are illustrative; distances are computed on the real orbit roots and ports.</desc>
<style>
svg { --bg:#ffffff; --ink:#1f2328; --body:#2b3138; --muted:#57606a; --rule:#d0d7de; --panel:#f6f8fa;
      --blue:#0072b2; --sky:#56b4e9; --green:#007a5e; --orange:#e69f00; --verm:#d55e00; --purple:#7a4fa3; --pink:#cc79a7;
      --active:#007a5e; --ready:#b06d00; --parked:#7a4fa3; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --ink:#e6edf3; --body:#c9d1d9; --muted:#8b949e; --rule:#30363d; --panel:#161b22;
      --blue:#58a6ff; --sky:#79c0ff; --green:#3fb950; --orange:#f0b72f; --verm:#ff7b72; --purple:#bc8cff; --pink:#f778ba;
      --active:#3fb950; --ready:#f0b72f; --parked:#bc8cff; } }
.bg { fill: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
</style>
