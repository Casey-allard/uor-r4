<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 642" width="960" role="img" aria-labelledby="t d">
<title id="t">Pointer copy with an exact identity key</title>
<desc id="d">Three parts. Top: the sentence My locker is 47, then What is my locker, drawn as twelve tokens with an attention bar above each. Measured on one 29 million parameter chat model, the pointer puts 0.92 of its attention (0.9202 and 0.9064 on two rows) on a bare space token in the repeated frame and almost nothing on the digits 4 and 7. Below it, the forced-copy test would put all attention on the two digits; that test was built but never run. Bottom left: two linked dials over three seeds. The pointer hit rate rises from 0.377 to 0.5452 while the memory score stays at 19, 21 and 23 of 40, beside a control of 20 and a bar of 25. Bottom right: of 13 numeric rows, 10 never selected the digit, 2 selected it but did not emit it, and 1 was partial.</desc>
