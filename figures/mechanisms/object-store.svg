<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 524" width="960" height="524" role="img">
<title>Exact byte object store</title>
<desc>Three panels. Left: a document cut into 32-byte tiles folds into a three-child tree with a root fingerprint on top; a 23-byte range lights only the covering branches, with a verified path to the root, which in the real 32,768-byte object (1,024 atoms) costs 8 authenticated nodes and 384 bytes. Middle: two versions of a file share most of their tree; only the changed records travel, which for a 1 MiB object with a receiver 16 atoms behind was 22 records, 1,014 bytes and 3 rounds. Right: raw against stored record bytes for four test files: unique 32,768 to 70,972, repeated 7,776 to 380, UTF-8 and NUL text 605 to 421, empty 0 to 0. Trees are illustrative.</desc>
<style>
svg{--bg:#ffffff;--ink:#1f2328;--body:#2b3138;--muted:#57606a;--rule:#d0d7de;--panel:#f6f8fa;--blue:#0072b2;--sky:#56b4e9;--green:#007a5e;--orange:#e69f00;--verm:#d55e00;--purple:#7a4fa3;--pink:#cc79a7;--active:#007a5e;--ready:#b06d00;--parked:#7a4fa3}
