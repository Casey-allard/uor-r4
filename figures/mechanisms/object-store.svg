.tl{fill:var(--bg);stroke:var(--muted);stroke-width:1}
.tllit{fill:var(--blue);fill-opacity:.45;stroke:var(--blue);stroke-width:1.5}
.brk{fill:none;stroke:var(--blue);stroke-width:2}
.card{fill:var(--bg);stroke:var(--rule);stroke-width:1.5}
.cardhi{fill:var(--bg);stroke:var(--blue);stroke-width:2}
.gr{fill:var(--muted);fill-opacity:.35;stroke:var(--muted);stroke-width:1}
.ch{fill:var(--orange);fill-opacity:.55;stroke:var(--orange);stroke-width:1.75}
.old{fill:var(--bg);stroke:var(--muted);stroke-width:1.25;stroke-dasharray:3 2}
.raw{fill:var(--muted);fill-opacity:.65}
.sto{fill:var(--blue)}
.sent{fill:none;stroke:var(--orange);stroke-width:2}
.lnk{fill:none;stroke:var(--muted);stroke-width:1}
</style>
