.fv{fill:var(--verm)}
.fo{fill:var(--orange)}
.edge{fill:none;stroke:var(--rule);stroke-width:1}
.edgelit{fill:none;stroke:var(--blue);stroke-width:2.5}
.nd{fill:var(--bg);stroke:var(--muted);stroke-width:1.25}
