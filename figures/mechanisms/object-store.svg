<text class="body" x="690" y="362">stored 0</text>
<path class="lnk" d="M690 106V366"/>
<text class="b" x="682" y="396">unique text costs about</text>
<text class="b" x="682" y="414">2.17 times its size</text>
<text class="n" x="682" y="440">Record bytes, one linear scale.</text>

<text class="h c" x="480" y="490">Repeats and small edits are cheap, a small read is cheap, and unique text costs about 2.17 times its size.</text>
<text class="n c" x="480" y="510">Trees are illustrative; the byte counts are measured.</text>
