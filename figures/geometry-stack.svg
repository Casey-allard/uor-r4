<title id="t">Geometric primitives and operators</title>
<desc id="d">Thirteen rows: prime addressing, zeta phases, quaternion state, H4/icosian/E8, exact Z[phi], Hopf observation and chirality are the primitives; the G2 Hamilton gate and the SpiralCore/FBS projection are trained and served in the FBS trunk under lut-stack/5; the geometric recurrence gates and the rank-margin objective are dormant source for the earlier float trunk; the geometric head is delivered as inactive float source; the starling read is in progress for rung 0b.</desc>
