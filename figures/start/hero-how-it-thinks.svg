.pick { fill: none; stroke: var(--orange); stroke-width: 2; }
.out { fill: var(--orange); fill-opacity: 0.16; stroke: var(--orange); stroke-width: 2; }
.flow { stroke: var(--muted); stroke-width: 2; fill: none; }
.head-fill { fill: var(--muted); }
.band { fill: var(--panel); stroke: var(--green); stroke-width: 1.5; }
.band-text { font-size: 13.5px; fill: var(--ink); }
.tag { fill: var(--bg); stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 2; }
</style>
