<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" role="img" aria-labelledby="t d">
<title id="t">How UOR-R4 predicts the next word</title>
<desc id="d">Four panels read left to right. 1, Text: the phrase "the cat sat on the" is cut into five numbered pieces by a tokenizer with 4,096 pieces; the fifth piece is the newest. 2, Address: each piece lands on a point of a ring of 16 evenly spaced points, a stand-in for the geometric object; both copies of "the" land on the same point. An inset shows one address as 4 blocks of 8 whole numbers, the first block written as (2, -2, 0, 0, 0, 0, 0, 0), marked illustrative. 3, Local read: the newest piece reads only three nearby earlier points, found by address, while the rest of the history stays grey. 4, Next token: two of eight drawers of words open near what was read and the nearest word, "mat", is picked, with no softmax. A band underneath says every step uses whole numbers only: add, subtract, compare and table look-up, with no multiply and no decimals. A corner tag says this is the design, not a working result: 0 of 8 milestones are complete.</desc>
<style>
svg { --bg:#ffffff; --ink:#1f2328; --body:#2b3138; --muted:#57606a; --rule:#d0d7de; --panel:#f6f8fa;
