.link { stroke: var(--blue); stroke-width: 1.5; }
.cell { fill: var(--bg); stroke: var(--rule); stroke-width: 1; }
.cell-on { fill: var(--sky); fill-opacity: 0.25; stroke: var(--rule); stroke-width: 1; }
.drawer { fill: var(--bg); stroke: var(--rule); stroke-width: 1.5; }
.handle { stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; }
