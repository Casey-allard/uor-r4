<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 716" width="960" role="img" aria-labelledby="t d">
<title id="t">Transformer parts and their geometric replacements</title>
<desc id="d">Two aligned columns. The left column lists fourteen parts of a transformer from input to output: tokenizer, embedding, position, attention (what to read), attention (mixing), copy heads, context memory (KV cache), feed-forward, gates and activations, normalization, output head (softmax), loss (cross-entropy), optimizer (backprop) and runtime. An arrow from each part points to the UOR-R4 mechanisms meant to replace it, drawn as chips whose outline and label give the status: solid green ACTIVE, dashed amber READY, dotted purple PARKED. Position names both FBS SpiralCore transport and M1 PositionHolonomyV1; normalization names both FBS RMS norm and M1 OrbitRootSnapNormV1. Hopf is split: the kept-fibre map is READY and sector routing is PARKED. The discrete M1 composition also includes a discrete quaternion recurrence and Hamilton gate. Hamilton gate and the FBS SpiralCore/FBS routes are ACTIVE; the dated float projection form remains READY (31 October 2026). On p-f, 62.5% of reference replies are verbatim TRAIN replies: reference-data overlap, not a generated-copy rate or new reply kinds.</desc>
<style>
svg { --bg:#ffffff; --ink:#1f2328; --body:#2b3138; --muted:#57606a; --rule:#d0d7de; --panel:#f6f8fa;
      --blue:#0072b2; --sky:#56b4e9; --green:#007a5e; --orange:#e69f00; --verm:#d55e00; --purple:#7a4fa3; --pink:#cc79a7;
      --active:#007a5e; --ready:#b06d00; --parked:#7a4fa3; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --ink:#e6edf3; --body:#c9d1d9; --muted:#8b949e; --rule:#30363d; --panel:#161b22;
      --blue:#58a6ff; --sky:#79c0ff; --green:#3fb950; --orange:#f0b72f; --verm:#ff7b72; --purple:#bc8cff; --pink:#f778ba;
      --active:#3fb950; --ready:#f0b72f; --parked:#bc8cff; } }
.bg { fill: var(--bg); }
