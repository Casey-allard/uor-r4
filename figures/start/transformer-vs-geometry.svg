.title { font-size: 19px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--muted); }
.colhead { font-size: 13px; font-weight: 600; fill: var(--muted); }
.lbl { font-size: 13px; fill: var(--ink); }
.strong { font-weight: 600; }
.note { font-size: 11.5px; fill: var(--muted); }
.legend { font-size: 12px; fill: var(--body); }
.part { fill: var(--panel); stroke: var(--rule); stroke-width: 1.5; }
.part-gap { stroke: var(--verm); }
.gap { fill: none; stroke: var(--verm); stroke-width: 1.75; stroke-dasharray: 7 4; }
.gap-text { fill: var(--verm); font-size: 13px; font-weight: 600; }
.chip-active { fill: var(--active); fill-opacity: 0.12; stroke: var(--active); stroke-width: 1.75; }
.chip-ready { fill: var(--ready); fill-opacity: 0.12; stroke: var(--ready); stroke-width: 1.75; stroke-dasharray: 6 3; }
.chip-parked { fill: var(--parked); fill-opacity: 0.10; stroke: var(--parked); stroke-width: 1.75; stroke-dasharray: 0.5 3.5; stroke-linecap: round; }
.st { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
.st-active { fill: var(--active); }
.st-ready { fill: var(--ready); }
.st-parked { fill: var(--parked); }
.flow { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.head-fill { fill: var(--muted); }
.onpath { fill: var(--blue); }
.pathcol { fill: var(--blue); fill-opacity: 0.06; stroke: var(--blue); stroke-opacity: 0.35; stroke-width: 1; }
.rule { stroke: var(--rule); stroke-width: 1; }
</style>
