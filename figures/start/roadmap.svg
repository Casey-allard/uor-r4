<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" role="img" aria-labelledby="t d">
<title id="t">The road from today to the products</title>
<desc id="d">A left-to-right road from M1's completed language-base result to the remaining products. Milestone 1 is done: the saved discrete model passed all six bars on two seeds (DEV 7,002 / 7,001, Fresh V2 7,215 / 7,228 and p-f 7,850 / 7,872). Claude-219's point-key opening improves free generation at three seeds on fresh p-v, but reaches only 12–18% of the forced-opening lift; the sign key is inconclusive at this panel size. Claude-222 built the integer table/search and claude-224 built the panel decode/grade; claude-227 passed retention GPU parity within the 3% bar; claude-228 built the run's reference/read-back/BOS instruments; claude-229 found an instrument fault: native writer is not the trained nearest readout, so all grade pairs are zero. Claude-231 built the nearest readout; claude-232 missed greedy parity in every cell, so the mismatch must be localized before p-x; useful chat remains unproven. On p-f, 62.5% of reference replies are verbatim TRAIN replies: reference-data overlap, not a generated-copy rate or new reply kinds. Then: serve every part in integers, connect typed text through R7, train and score one joined model, then measure cost and revisit Flock. Every run uses the lab's own pre-run review. M2 and M3 are in progress; M4 to M8 remain open, ending at the model file, web client and desktop shell.</desc>
