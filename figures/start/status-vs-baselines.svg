<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
<title id="t">Saved M1 model against count tables</title>
<desc id="d">Horizontal bars on one scale from 0 to 14,287 development-panel positions. Next-word table 6,300, unigram table 1,226, saved M1 model seed 2 7,001, saved M1 model seed 1 7,002. A dashed line at 6,324 marks M1's closing target: T2 6,300 plus 24. Both seeds pass the target and beat both tables.</desc>
