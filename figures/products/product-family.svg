<text class="name" x="481" y="272" text-anchor="middle">Model artifact</text>
<text class="detail" x="481" y="290" text-anchor="middle">UORLUT01, integer only</text>
<text class="detail" x="481" y="306" text-anchor="middle">SHA-256 pinned</text>

<line class="flow" x1="438" y1="200" x2="352" y2="226" marker-end="url(#arr)"/>
<line class="flow" x1="524" y1="200" x2="610" y2="226" marker-end="url(#arr)"/>

<!-- Left: browser window (web client) -->
<rect class="window" x="60" y="122" width="284" height="214" rx="8"/>
<path class="chrome" d="M60,148 L60,130 A8,8 0 0 1 68,122 L336,122 A8,8 0 0 1 344,130 L344,148 Z"/>
<circle class="dot" cx="74" cy="135" r="3"/><circle class="dot" cx="84" cy="135" r="3"/><circle class="dot" cx="94" cy="135" r="3"/>
<rect class="addr" x="110" y="128" width="180" height="14" rx="7"/>
<text class="mini" x="120" y="139">/studio</text>
