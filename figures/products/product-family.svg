<path class="base" d="M612,318 L908,318 L896,334 L624,334 Z"/>
<rect class="tag-spec" x="806" y="98" width="74" height="20" rx="10"/>
<text class="tag-spec-text" x="843" y="112" text-anchor="middle">synthetic verified</text>
