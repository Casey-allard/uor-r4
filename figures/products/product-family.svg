<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" role="img" aria-labelledby="t d">
<title id="t">One model file, two clients</title>
<desc id="d">One model file sits in the centre: the model artifact, a UORLUT01 file of integers only, pinned by its SHA-256 checksum, tagged "M1 complete, 1 of 8; no product release". Two arrows leave it. The left arrow goes to a browser window, the web client, which runs the file in WebAssembly inside a tab with the Studio as its shell. The right arrow goes to a laptop, the desktop client: a Tauri app with a native engine, durable memory (D19) and offline use, tagged "synthetic verified". The same Studio panel, an editor beside a chat, is drawn inside both clients to show one shared interface. A dashed border around everything reads "local mode: no default model server". For the web Studio only, an optional user-configured OpenAI-compatible API sends prompts to the endpoint the user chooses; the desktop shell has no OpenAI-compatible API mode.</desc>
<style>
svg { --bg:#ffffff; --ink:#1f2328; --body:#2b3138; --muted:#57606a; --rule:#d0d7de; --panel:#f6f8fa;
      --blue:#0072b2; --sky:#56b4e9; --green:#007a5e; --orange:#e69f00; --verm:#d55e00; --purple:#7a4fa3; --pink:#cc79a7;
      --active:#007a5e; --ready:#b06d00; --parked:#7a4fa3; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --ink:#e6edf3; --body:#c9d1d9; --muted:#8b949e; --rule:#30363d; --panel:#161b22;
      --blue:#58a6ff; --sky:#79c0ff; --green:#3fb950; --orange:#f0b72f; --verm:#ff7b72; --purple:#bc8cff; --pink:#f778ba;
      --active:#3fb950; --ready:#f0b72f; --parked:#bc8cff; } }
.bg { fill: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
.title { font-size: 19px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--muted); }
.name { font-size: 14px; font-weight: 600; }
.detail { font-size: 12px; fill: var(--muted); }
.mini { font-size: 10.5px; fill: var(--muted); }
.mini-b { font-size: 10.5px; font-weight: 600; fill: var(--body); }
.device { fill: none; stroke: var(--green); stroke-width: 1.75; stroke-dasharray: 8 5; }
.device-label { font-size: 13px; font-weight: 600; fill: var(--green); }
.file { fill: var(--panel); stroke: var(--blue); stroke-width: 2; }
.fold { fill: var(--bg); stroke: var(--blue); stroke-width: 2; stroke-linejoin: round; }
.fileline { stroke: var(--blue); stroke-width: 2.5; stroke-linecap: round; stroke-opacity: 0.6; }
.window { fill: var(--bg); stroke: var(--muted); stroke-width: 1.75; }
.window-spec { fill: var(--bg); stroke: var(--muted); stroke-width: 1.75; stroke-dasharray: 6 4; }
.chrome { fill: var(--panel); stroke: var(--muted); stroke-width: 1.75; }
.dot { fill: var(--muted); }
.addr { fill: var(--bg); stroke: var(--rule); stroke-width: 1; }
.base { fill: var(--panel); stroke: var(--muted); stroke-width: 1.75; stroke-linejoin: round; }
.studio { fill: var(--panel); stroke: var(--rule); stroke-width: 1.25; }
.pane { fill: var(--bg); stroke: var(--rule); stroke-width: 1; }
.code { stroke: var(--sky); stroke-width: 3; stroke-linecap: round; }
.code2 { stroke: var(--muted); stroke-opacity: 0.5; stroke-width: 3; stroke-linecap: round; }
.bubble-user { fill: var(--blue); fill-opacity: 0.18; }
.bubble-model { fill: var(--green); fill-opacity: 0.18; }
.flow { stroke: var(--blue); stroke-width: 2; fill: none; }
.head-fill { fill: var(--blue); }
.tag-no { fill: var(--verm); fill-opacity: 0.08; stroke: var(--verm); stroke-width: 1.25; }
.tag-no-text { font-size: 11.5px; font-weight: 700; fill: var(--verm); letter-spacing: 0.02em; }
.tag-spec { fill: var(--bg); stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 2; }
.tag-spec-text { font-size: 11px; fill: var(--muted); }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="head-fill"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="440"/>

<text class="title" x="24" y="36">One model file, two ways to run it</text>
<text class="sub" x="24" y="58">Both clients load the same file and share one interface. Nothing here ships yet.</text>

