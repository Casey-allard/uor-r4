</g>
<text class="name" x="202" y="362" text-anchor="middle">Web client</text>
<text class="detail" x="202" y="380" text-anchor="middle">WebAssembly in a browser tab</text>
<text class="detail" x="202" y="396" text-anchor="middle">Studio as the shell</text>

<!-- Right: laptop (desktop client) -->
