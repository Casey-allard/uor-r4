<title id="t">The two model paths, 31 October 2026</title>
<desc id="d">The saved discrete 19-table model has closed M1 at all six bars on two seeds: DEV 7,002 / 7,001, Fresh V2 7,215 / 7,228 and p-f 7,850 / 7,872, with exact 14,287-row DEV export agreement and Apple M1 decode at 10,876 / 10,566 tok/s. Separately, BPE-4096 token ids feed the float-trained FBS trunk: learned table, SpiralCore position, recurrence with Hamilton gate and RMS norm, Hamming reads and exact turn memory. The /7 engine serves opening and later-reply memory tables on synthetic fixtures; trained-artifact parity and memory-session restore remain open. The FBS export through lut-stack/5 has exact rotations and its export gap inside the bar at DEV scope; D11 integer serving uses integer multiply and divide with floats banned. The immediate gate is localizing claude-232's parity MISS before p-x, followed by joined serving and a reachable memory key on new phrasing. On p-f, 62.5% of reference replies are verbatim TRAIN replies: reference-data overlap, not a generated-copy rate or new reply kinds.</desc>
