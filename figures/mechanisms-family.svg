<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 824" width="960" role="img" aria-labelledby="t d">
<title id="t">Mechanism lineage from 19 October 2026, with current statuses</title>
<desc id="d">A left-to-right family tree of the 22 mechanisms that had a recorded parent or child on 19 October 2026, with five more shown in a strip for having no recorded lineage, so all 27 entries from that date appear. The lineage is historical; the status words are current on 31 October 2026, not frozen at the audit. This is not the current 28-row board, which later split Hopf observation. Each box carries a name and a current status word: ACTIVE (solid border), READY (dashed border) or PARKED (dotted border). Edges: a solid arrow means successor, a dotted arrow means the target is the integer or discrete form of the source, and a double line means specialisation. Discrete learning is the single sink, with five incoming lineages: native geometric, carrier credit, legal construction, SpiralCore/FBS and ternary/XOR. The R4G1 graph leads to the native geometric engine and to D11 integer serving. The native geometric engine leads to the geometric stack, the prime-zeta codebook, the object store, the rank-margin hinge, discrete learning and relation read. The geometric stack leads to the Hamilton gate, recurrence gates and flock read. Routed read leads to flock read, which specialises into relation read; pointer key also feeds relation read. The prime-zeta codebook leads to address cells, spin-native weights lead to SpiralCore/FBS, and exact memory specialises into E8 orbit memory. The no-lineage strip holds admission and the tokenizer (ACTIVE), Hopf observation split into kept-fibre READY and sector-routing PARKED, and read binding and VSA (PARKED).</desc>
<style>
svg { --bg:#ffffff; --ink:#1f2328; --body:#2b3138; --muted:#57606a; --rule:#d0d7de; --panel:#f6f8fa;
      --blue:#0072b2; --sky:#56b4e9; --green:#007a5e; --orange:#e69f00; --verm:#d55e00; --purple:#7a4fa3; --pink:#cc79a7;
      --active:#007a5e; --ready:#b06d00; --parked:#7a4fa3; }
@media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --ink:#e6edf3; --body:#c9d1d9; --muted:#8b949e; --rule:#30363d; --panel:#161b22;
      --blue:#58a6ff; --sky:#79c0ff; --green:#3fb950; --orange:#f0b72f; --verm:#ff7b72; --purple:#bc8cff; --pink:#f778ba;
      --active:#3fb950; --ready:#f0b72f; --parked:#bc8cff; } }
.bg { fill: var(--bg); }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
.title { font-size: 19px; font-weight: 600; }
.sub { font-size: 12.5px; fill: var(--muted); }
.nm { font-size: 12.5px; font-weight: 600; }
.st { font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; }
.st-a { fill: var(--active); }
.st-r { fill: var(--ready); }
.st-p { fill: var(--parked); }
.note { font-size: 11.5px; fill: var(--muted); }
.lab { font-size: 11.5px; fill: var(--body); }
.head { font-size: 13px; font-weight: 600; }
.n-a { fill: var(--active); fill-opacity: 0.13; stroke: var(--active); stroke-width: 2; }
.n-r { fill: var(--ready); fill-opacity: 0.10; stroke: var(--ready); stroke-width: 2; stroke-dasharray: 7 4; }
.n-p { fill: var(--parked); fill-opacity: 0.08; stroke: var(--parked); stroke-width: 2; stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
.e { stroke: var(--muted); stroke-width: 1.6; fill: none; }
.e-d { stroke: var(--muted); stroke-width: 1.8; fill: none; stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
.dot { fill: var(--muted); }
.ah { fill: var(--muted); }
.strip { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 6 4; }
</style>
