<text x="40" y="540" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="start">Saved discrete M1 pair: 10,876 / 10,566 native decode tok/s on Apple M1.</text>
<text x="40" y="558" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="start">Separate FBS serving: 270, then 3,042 with exact structured kernels, then 4,829 snapped tok/s; integer multiply and divide (claude-163–177).</text>
<text x="40" y="576" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="start">FBS /5 DEV gap pass: 4,217–4,504 tok/s. Studio: synthetic parity plus public M1 top-8 prediction; desktop: synthetic stand-in; neither is a qualified product.</text>
