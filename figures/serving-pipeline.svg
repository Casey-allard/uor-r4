<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The D11 serving pipeline, 31 October 2026</title>
<desc id="d">The integer engine serves the saved discrete M1 pair and the separate float-trained FBS trunk. The M1 pair has exact 14,287-row DEV export agreement and reaches 10,876 / 10,566 native decode tok/s on Apple M1 under the bar-f remeasurement; the older close-grade bar-c rate is 11,026 / 10,573. FBS lut-stack/5 has exact rotations and its export gap inside the bar at DEV scope and reaches 4,217–4,504 tok/s; the separate snapped artifact reaches 4,829 tok/s. Integer multiply and divide are allowed and floats are banned. Next, localize claude-232's parity MISS before p-x, then a reachable memory key and joined integer serving with R7. Studio has synthetic parity plus public M1 top-8 next-token prediction after an explicit download; desktop uses a synthetic stand-in. Neither is a qualified product. On p-f, 62.5% of reference replies are verbatim TRAIN replies: reference-data overlap, not a generated-copy rate or new reply kinds.</desc>
