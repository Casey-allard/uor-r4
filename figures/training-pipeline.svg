<text x="54" y="371" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">HF store (Rust, crates,</text>
<text x="54" y="387" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">binaries): ready in 57 s warm</text>
<rect x="54" y="410" width="69" height="22" rx="11" fill="#007A5E" stroke="#007A5E" stroke-width="1.5"/>
<text x="88.5" y="425" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">WORKING</text>
