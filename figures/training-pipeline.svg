<text x="334" y="334" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Train</text>
<text x="334" y="355" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">compliant trunk, rank-margin</text>
<text x="334" y="371" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">hinge; no CPU model compute,</text>
<text x="334" y="387" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">no host fallback (D24)</text>
<rect x="334" y="410" width="69" height="22" rx="11" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="368.5" y="425" font-size="11" font-weight="700" fill="#424A53" text-anchor="middle" letter-spacing="0.4">PLANNED</text>
<rect x="600" y="308" width="260" height="132" rx="10" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.75" stroke-dasharray="6 5"/>
<text x="614" y="334" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Evaluate</text>
<text x="614" y="355" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">raw-score top-1, rank and</text>
<text x="614" y="371" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">recall@K, the hinge, tokens/s;</text>
<text x="614" y="387" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">frozen panels, fresh transfer</text>
<rect x="614" y="410" width="69" height="22" rx="11" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="648.5" y="425" font-size="11" font-weight="700" fill="#424A53" text-anchor="middle" letter-spacing="0.4">PLANNED</text>
<rect x="890" y="308" width="270" height="132" rx="10" fill="#E3F4EE" stroke="#007A5E" stroke-width="2.5"/>
<text x="904" y="334" font-size="15" font-weight="700" fill="#1F2328" text-anchor="start">Keep the results</text>
<text x="904" y="355" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">down archives to the laptop or</text>
