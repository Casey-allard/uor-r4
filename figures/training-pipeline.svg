<text x="54" y="177" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">tokenizer, memory dialogues,</text>
<text x="54" y="193" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">TinyStories, step-5 inputs:</text>
<text x="54" y="209" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">the private HF store</text>
<rect x="54" y="228" width="69" height="22" rx="11" fill="#007A5E" stroke="#007A5E" stroke-width="1.5"/>
<text x="88.5" y="243" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">WORKING</text>
