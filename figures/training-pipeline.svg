<text x="614" y="177" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">a non-author lab returns</text>
<text x="614" y="193" font-size="12.5" font-weight="400" fill="#2B3138" text-anchor="start">FIT or NOT_FIT before compute</text>
<rect x="614" y="228" width="118" height="22" rx="11" fill="#0072B2" stroke="#0072B2" stroke-width="1.5"/>
<text x="673" y="243" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">BUILT &amp; TESTED</text>
