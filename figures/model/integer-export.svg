<rect class="slot" x="322" y="186" width="8" height="18" rx="1.5"/>
<rect class="slot" x="332" y="186" width="8" height="18" rx="1.5"/>
<rect class="pick" x="342" y="186" width="8" height="18" rx="1.5"/>
<rect class="slot" x="352" y="186" width="8" height="18" rx="1.5"/>
<rect class="slot" x="362" y="186" width="8" height="18" rx="1.5"/>
<rect class="slot" x="372" y="186" width="8" height="18" rx="1.5"/>
<rect class="slot" x="382" y="186" width="8" height="18" rx="1.5"/>
<rect class="slot" x="392" y="186" width="8" height="18" rx="1.5"/>
<rect class="slot" x="402" y="186" width="8" height="18" rx="1.5"/>
<rect class="slot" x="412" y="186" width="8" height="18" rx="1.5"/>
<rect class="slot" x="422" y="186" width="8" height="18" rx="1.5"/>
<rect class="slot" x="432" y="186" width="8" height="18" rx="1.5"/>
<path class="flow-b" d="M350.5 163 C350.5 172 346 176 346 184" marker-end="url(#ab)"/>
<path class="gap" d="M346 212 H350.5 M346 208 V216 M350.5 208 V216"/>
<text class="tv" x="360" y="219">gap</text>
<text class="detail" x="359" y="238" text-anchor="middle">16 slots = a 4-bit code</text>
<text class="small" x="359" y="258" text-anchor="middle">one scale per group of 32</text>
<text class="detail" x="359" y="272" text-anchor="middle">one byte: 4-bit mantissa,</text>
<text class="detail" x="359" y="285" text-anchor="middle">4-bit exponent</text>
<text class="tv" x="359" y="304" text-anchor="middle">this step can lose quality</text>
<path class="flow" d="M454 196 H504" marker-end="url(#a)"/>

<!-- box 3 -->
<rect class="box" x="504" y="76" width="190" height="240" rx="10"/>
<text class="head" x="599" y="98" text-anchor="middle">3  Integer table file</text>
<text class="detail" x="599" y="114" text-anchor="middle">UORLUT01</text>
<rect class="cell" x="520" y="128" width="36" height="24" rx="3"/><text class="code" x="538" y="144" text-anchor="middle">1011</text>
<rect class="cell" x="556" y="128" width="36" height="24" rx="3"/><text class="code" x="574" y="144" text-anchor="middle">0011</text>
