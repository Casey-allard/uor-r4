<rect class="cell" x="556" y="152" width="36" height="24" rx="3"/><text class="code" x="574" y="168" text-anchor="middle">1110</text>
<rect class="cell" x="592" y="152" width="36" height="24" rx="3"/><text class="code" x="610" y="168" text-anchor="middle">1001</text>
<rect class="cell" x="520" y="176" width="36" height="24" rx="3"/><text class="code" x="538" y="192" text-anchor="middle">0111</text>
<rect class="cell" x="556" y="176" width="36" height="24" rx="3"/><text class="code" x="574" y="192" text-anchor="middle">0110</text>
<rect class="cell" x="592" y="176" width="36" height="24" rx="3"/><text class="code" x="610" y="192" text-anchor="middle">0010</text>
<rect class="scale" x="634" y="128" width="40" height="24" rx="3"/><text class="code" x="654" y="144" text-anchor="middle">scale</text>
<rect class="scale" x="634" y="152" width="40" height="24" rx="3"/><text class="code" x="654" y="168" text-anchor="middle">scale</text>
<rect class="scale" x="634" y="176" width="40" height="24" rx="3"/><text class="code" x="654" y="192" text-anchor="middle">scale</text>
<text class="detail" x="599" y="214" text-anchor="middle">4-bit codes, one scale per group</text>
<rect class="chip" x="512" y="232" width="52" height="22" rx="4"/><text class="small" x="538" y="247" text-anchor="middle">sqrt</text>
<rect class="chip" x="570" y="232" width="52" height="22" rx="4"/><text class="small" x="596" y="247" text-anchor="middle">decay</text>
<rect class="chip" x="628" y="232" width="52" height="22" rx="4"/><text class="small" x="654" y="247" text-anchor="middle">arcosh</text>
<text class="detail" x="599" y="272" text-anchor="middle">small integer tables for the</text>
<text class="detail" x="599" y="285" text-anchor="middle">nonlinear steps (also SiLU, exp)</text>
<text class="detail" x="599" y="304" text-anchor="middle">only whole numbers</text>
<path class="flow" d="M694 196 H744" marker-end="url(#a)"/>

<!-- box 4 -->
<rect class="box" x="744" y="76" width="190" height="240" rx="10"/>
<text class="head" x="839" y="98" text-anchor="middle">4  Serving</text>
<text class="detail" x="839" y="114" text-anchor="middle">table look-ups, adds, shifts</text>
<rect class="chip" x="760" y="124" width="84" height="22" rx="4"/><text class="small" x="802" y="139" text-anchor="middle">activation x</text>
<path class="flow" d="M802 146 V160" marker-end="url(#a)"/>
