<text class="detail" x="760" y="192">16 multiples of x,</text>
<text class="detail" x="760" y="205">built by adding x</text>
<rect class="chip" x="849" y="214" width="70" height="20" rx="4"/><text class="small" x="884" y="228" text-anchor="middle">4-bit code</text>
<path class="flow-b" d="M884 214 V180" marker-end="url(#ab)"/>
<path class="flow" d="M884 234 V250" marker-end="url(#a)"/>
<rect class="chip" x="758" y="250" width="172" height="22" rx="4"/><text class="small" x="844" y="265" text-anchor="middle">shift, then add to the sum</text>
<text class="tg" x="839" y="300" text-anchor="middle">multiply instructions: 0</text>

<!-- export gap bracket -->
<path class="bracket" d="M24 326 V334 H694 V326"/>
<text class="small" x="359" y="354" text-anchor="middle" style="font-size:13px">export gap = served score minus float score, same evaluator, same positions</text>

<!-- measurements -->
<text class="head" x="24" y="388" style="font-size:13px">Past measurements of the gap (older float stack models, not today's model)</text>
<rect class="past" x="24" y="398" width="290" height="68" rx="8"/>
<text class="big" x="40" y="420">0.00883 BPB</text>
<text class="detail" x="40" y="437">19.9M stack, identical positions</text>
<text class="detail" x="40" y="452">engine difference about 1e-6</text>
<rect class="past" x="330" y="398" width="290" height="68" rx="8"/>
<text class="big" x="346" y="420">0.009288 BPB</text>
<text class="detail" x="346" y="437">matched runs, 512 windows</text>
<text class="detail" x="346" y="452">engine difference 2.7e-7</text>
<rect class="today" x="636" y="398" width="300" height="68" rx="8"/>
<text class="head" x="652" y="420">Today's model</text>
<text class="small" x="652" y="437">not yet exported, gap unmeasured</text>
