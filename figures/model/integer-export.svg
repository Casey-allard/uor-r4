.scale { fill: var(--orange); fill-opacity: 0.2; stroke: var(--orange); stroke-width: 1; }
.exact { fill: var(--bg); stroke: var(--verm); stroke-width: 2; }
.gap { stroke: var(--verm); stroke-width: 2; fill: none; }
.flow { stroke: var(--muted); stroke-width: 1.75; fill: none; }
.flow-b { stroke: var(--blue); stroke-width: 1.5; fill: none; }
.bracket { stroke: var(--verm); stroke-width: 1.75; fill: none; }
.today { fill: none; stroke: var(--verm); stroke-width: 1.75; stroke-dasharray: 5 4; }
.past { fill: var(--panel); stroke: var(--rule); stroke-width: 1; }
.ah { fill: var(--muted); }
.ah-b { fill: var(--blue); }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah-b" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="488"/>
<text class="title" x="24" y="34">From float weights to an integer file</text>
<text class="sub" x="24" y="56">Training may use decimals; serving may not. The snap between them is where quality can be lost.</text>

<!-- box 1 -->
<rect class="box" x="24" y="76" width="190" height="240" rx="10"/>
<text class="head" x="119" y="98" text-anchor="middle">1  Float table</text>
<text class="detail" x="119" y="114" text-anchor="middle">trained offline</text>
<rect class="cell" x="42" y="128" width="52" height="28" rx="3"/><text class="num" x="68" y="147" text-anchor="middle">0.37</text>
<rect class="cell" x="94" y="128" width="52" height="28" rx="3"/><text class="num" x="120" y="147" text-anchor="middle">-1.12</text>
<rect class="cell" x="146" y="128" width="52" height="28" rx="3"/><text class="num" x="172" y="147" text-anchor="middle">0.04</text>
<rect class="cell" x="42" y="156" width="52" height="28" rx="3"/><text class="num" x="68" y="175" text-anchor="middle">-0.58</text>
<rect class="cell" x="94" y="156" width="52" height="28" rx="3"/><text class="num" x="120" y="175" text-anchor="middle">0.91</text>
<rect class="cell" x="146" y="156" width="52" height="28" rx="3"/><text class="num" x="172" y="175" text-anchor="middle">0.26</text>
<rect class="cell" x="42" y="184" width="52" height="28" rx="3"/><text class="num" x="68" y="203" text-anchor="middle">0.13</text>
<rect class="cell" x="94" y="184" width="52" height="28" rx="3"/><text class="num" x="120" y="203" text-anchor="middle">-0.07</text>
<rect class="cell" x="146" y="184" width="52" height="28" rx="3"/><text class="num" x="172" y="203" text-anchor="middle">-0.74</text>
<text class="tg" x="119" y="246" text-anchor="middle">float is legal here (D37)</text>
<text class="detail" x="119" y="262" text-anchor="middle">no matrix multiply, no softmax</text>
<text class="detail" x="119" y="296" text-anchor="middle">values are illustrative</text>
<path class="flow" d="M214 196 H264" marker-end="url(#a)"/>

<!-- box 2 -->
<rect class="box" x="264" y="76" width="190" height="240" rx="10"/>
<text class="head" x="359" y="98" text-anchor="middle">2  Snap</text>
<text class="detail" x="359" y="114" text-anchor="middle">round each weight to a</text>
<text class="detail" x="359" y="127" text-anchor="middle">4-bit code</text>
<circle class="exact" cx="350.5" cy="156" r="5"/>
<text class="detail" x="365" y="160">exact weight</text>
<rect class="slot" x="282" y="186" width="8" height="18" rx="1.5"/>
<rect class="slot" x="292" y="186" width="8" height="18" rx="1.5"/>
