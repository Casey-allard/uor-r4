<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" role="img" aria-labelledby="t d">
<title id="t">Two separate model pipelines: discrete M1 and float-trained FBS</title>
<desc id="d">Two explicit, separate lanes share only the integer D11 serving boundary. The upper green lane is the completed discrete M1 model: BPE-4096 tokenizer and shared table, PositionHolonomyV1 with discrete quaternion recurrence, Flock FrozenZeroV1 plus an orbit-root causal pointer, discrete Hamilton mixing with OrbitRootSnapNormV1, post-rotation OuterL1V1 readout trained with rank-margin hinge, and a 19-table UORLUT01 export. M1 passes six bars at two seeds: DEV 7,002 / 7,001, Fresh V2 7,215 / 7,228 and p-f 7,850 / 7,872, with exact 14,287-row DEV export agreement and Apple M1 decode at 10,876 / 10,566 tok/s. The lower blue lane is the separate float-trained FBS research model: a learned 4,096 by 256 table, SpiralCore transport spin, FBS recurrence with Hamilton gate and RMS norm, Hamming copy heads and exact turn memory whose joined serving remains open, the in-model point key and whole-table nearest readout with greedy parity still missed, and lut-stack/5 export with exact rotations and its DEV export gap inside the bar. FBS serves at 4,217 to 4,504 tok/s. Current work localizes claude-232's parity MISS before p-x; joined serving and R7 remain open. On p-f, 62.5% of reference replies are verbatim TRAIN replies, so M1 is not useful-chat qualification.</desc>
