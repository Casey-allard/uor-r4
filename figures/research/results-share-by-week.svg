.t-muted { fill: var(--muted); } .f-muted { fill: var(--muted); } .s-muted { stroke: var(--muted); }
.t-rule { fill: var(--rule); } .f-rule { fill: var(--rule); } .s-rule { stroke: var(--rule); }
.t-panel { fill: var(--panel); } .f-panel { fill: var(--panel); } .s-panel { stroke: var(--panel); }
.t-bg { fill: var(--bg); } .f-bg { fill: var(--bg); } .s-bg { stroke: var(--bg); }
.t-blue { fill: var(--blue); } .f-blue { fill: var(--blue); } .s-blue { stroke: var(--blue); }
.t-sky { fill: var(--sky); } .f-sky { fill: var(--sky); } .s-sky { stroke: var(--sky); }
.t-green { fill: var(--green); } .f-green { fill: var(--green); } .s-green { stroke: var(--green); }
