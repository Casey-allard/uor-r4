<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" width="960" height="548" role="img" aria-labelledby="t d">
<title id="t">Model-result share of records by week</title>
<desc id="d">Stacked bars, one per ISO week from 20 Jul to 22 Oct, each split into model results and everything else, with the results share above each bar: 0%, 57%, 77%, 40%, 57%, 85%, 60%, 79%, 38%, 43%, 80%, 78%, 11%, 12%. A dashed line marks 50%. The share falls sharply in the busiest week.</desc>
<style>
svg { --bg:#ffffff; --ink:#1f2328; --body:#2b3138; --muted:#57606a; --rule:#d0d7de; --panel:#f6f8fa;
