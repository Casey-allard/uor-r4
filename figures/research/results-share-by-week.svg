<text x="944" y="92" font-size="13" class="t-ink b" text-anchor="end">W42: 34 results among 309 records; 190 of the records are tooling</text>
<text x="16" y="466" font-size="11" class="t-muted" text-anchor="start">Part of the drop after 11 October was ordered by the owner (the softmax and matmul bans and the GPU-only and Rust-first rules forced a rebuild</text>
<text x="16" y="482" font-size="11" class="t-muted" text-anchor="start">and many tool ports on 12 and 13 October), so the later weeks are an upper bound on discretionary process, not a verdict.</text>
<text x="16" y="498" font-size="11" class="t-muted" text-anchor="start">Compare shares, not counts: early rows mix loose documents and lane results. * partial week: the catalog runs from 21 Jul to 22 Oct.</text>
<text x="16" y="514" font-size="11" class="t-muted" text-anchor="start">Source: the research catalog, 1053 dated records; 122 records have no date and are not shown.</text>
