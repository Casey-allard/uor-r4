[package]
name = "train2bench"
version = "0.1.0"
edition = "2021"
publish = false

# train2 scratch benchmark (Candle CPU matmul + parallel LM step); mirrors c3 deps for cache reuse.
# token data to compare the Dot and Lorentz read geometries.
[workspace]

[features]
metal = ["candle-core/metal"]
accelerate = ["candle-core/accelerate"]

[dependencies]
uor-r4-training = { path = "/home/user/uor-r4/crates/uor-r4-training" }
uor-r4-model-source = { path = "/home/user/uor-r4/crates/uor-r4-model-source" }
candle-core = { version = "=0.9.2", default-features = false }
serde_json = "1.0"

[patch.crates-io]
candle-core = { path = "/home/user/uor-r4/third_party/candle-core-0.9.2" }
uor-foundation = { git = "https://github.com/UOR-Foundation/UOR-Framework.git", rev = "51c01382200b0179d6640b07e9c8119364ab69a1" }
uor-foundation-sdk = { git = "https://github.com/UOR-Foundation/UOR-Framework.git", rev = "51c01382200b0179d6640b07e9c8119364ab69a1" }
arrayref = { path = "/home/user/uor-r4/third_party/arrayref" }

[profile.release]
debug = 0
