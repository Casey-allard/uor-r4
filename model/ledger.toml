# model/ledger.toml --- the honesty ledger for claims that are not conformance
# IDs (R2).
#
# uor-r4 #273 Phase 1 seeds this with the four DORMANT modules as `open` claims:
# the scoped R4 carve-out the Phase-0 analysis recommended. Each is a capability
# measured and kept with a pre-declared activation gate, registered here rather
# than deleted (R4 "nothing deferred" is satisfied by registration, not by
# removal) or asserted (they are `open` — measured and reported, never proven).
# Conformance IDs and their levels live in `model/ids.toml`; this file is the
# non-ID honesty register only.

spec = "uor-r4/273-phase-1"

[[claim]]
id = "cd-space-dormant"
level = "open"
statement = "The Cayley-Dickson syntactic-morphism substrate (crates/uor-r4-core/src/transformerless/cd_space.rs) is retained dormant. Measured negative in the scoring path (#400: the CD term executed 0 of 1998 positions before removal from scoring); kept for a future re-grounding whose activation gate is a positive syntactic-morphism contribution over a pre-declared null."

[[claim]]
id = "tropical-route-dormant"
level = "open"
statement = "Tropical (max-plus) route composition over the compiled forward transitions (crates/uor-r4-graph-cli/tests/tropical_2hop_626.rs) is retained dormant. Measured negative under the pre-registered #626 exit rule on the 500k fixtures (5000 held-out): NULL floor 8.5701 bits / 0.0620 top-1 reproduced; 1H tropical 14.5113 / 0.0044 and 2H 14.5171 / 0.0044 — the E_f seat carries no route-composable token signal on this cover, corroborating the argmax-neutral deployed configuration. The mechanism (P-4-legal add+compare fold, parity-pinned to uor-matmul) stays available; its activation gate is a transition/emission structure on which a pre-registered rerun clears the #626 thresholds."

[[claim]]
id = "lie-jordan-dormant"
level = "open"
statement = "The Lie-Jordan quantum-cover algebra (crates/uor-r4-core/src/transformerless/lie_jordan.rs) is retained dormant behind its activation gate; measured and reported, never asserted."

[[claim]]
id = "bott-fock-dormant"
level = "open"
statement = "The Bott-Fock O(1) context-fold operator (crates/uor-r4-core/src/transformerless/bott_fock.rs) is retained dormant. #424 measured its lossless upper bound as shipped at +0.16pp (one standard error); retuning the decay could recover the ceiling. Its activation gate is a measured lift clearing the pre-declared bar."

[[claim]]
id = "quantum-cover-dormant"
level = "open"
statement = "The quantum-cover induction path (crates/uor-r4-graph-compiler/src/quantum_cover.rs) is retained dormant behind its activation gate; measured and reported, never asserted."

[[claim]]
id = "graph-construction-dormant"
level = "open"
statement = "The standalone Phase-2/4 graph-construction entry point (crates/uor-r4-graph-compiler/src/graph.rs, build_graph) is retained dormant. It generates refinement / lateral-neighbour / forward-transition edges as an alternative to the shipped induction path, which is what actually constructs graphs today; build_graph is on no shipped path and is unreferenced. Kept, not deleted, because a distinct construction mechanism is worth being able to return to. Activation gate: a construction that produces a graph scoring at or above the induction path on a pre-declared held-out slice."

[[claim]]
id = "packed-routing-dormant"
level = "open"
statement = "The packed zero-allocation ROUT-bytecode routing-program evaluator and typed semantic-transition evaluator (crates/uor-r4-graph-runtime/src/packed_kernels.rs, evaluate_routing_program / evaluate_typed_transition) are retained as declared placeholders behind their activation gate (#159 Phase 2): the geometric-routing walk over view.routing_section() is not yet wired, so each returns a pre-declared placeholder successor and is unreferenced by the serving path. Kept, not deleted, because the ROUT/typed-transition surface is a live design direction; measured and reported, never asserted. Activation gate: a routing walk that improves top-1 over the placeholder on a pre-declared held-out slice."

# uor-r4 #515: preserve-and-gate. Every mechanism/surface retained OFF the
# serving path is registered here rather than deleted, so a later run can return
# to it. These are `open` (measured and reported, never asserted); each names an
# activation gate. Registration only — the modules are unchanged.

[[claim]]
id = "endomorphism-dormant"
level = "open"
statement = "The endomorphic multiplication algebra End_R(V) ≅ Cl(0,8) operator store (crates/uor-r4-core/src/transformerless/endomorphism.rs, after Furey 2026 arXiv:2607.18450) is retained off the serving path — referenced only by the dormant lie_jordan substrate (lie-jordan-dormant). Kept as the operator algebra a Lie-Jordan re-grounding would need. Activation gate: shared with lie-jordan-dormant — a positive syntactic-morphism contribution over a pre-declared null."

[[claim]]
id = "holographic-encoding-dormant"
level = "open"
statement = "The holographic-encoding contract — projection-family semantics, ablation protocol, partial reconstruction, and progressive-fidelity probes (crates/uor-r4-graph-certify/src/holographic_encoding.rs; PDF §5 / #126) — is retained off the serving path as a research/certification surface; measured and reported, never asserted. Activation gate: a holographic-encoding ablation result adopted as a required gate on a pre-declared fidelity bar."

[[claim]]
id = "predictive-sufficiency-dormant"
level = "open"
statement = "The predictive-sufficiency divergence and rate-distortion reporting across graph depths (crates/uor-r4-graph-certify/src/predictive_sufficiency.rs; Phase 3 / Plan §9.14) is retained off the serving path as a measurement surface. Activation gate: its divergence metric adopted as a required conformance gate on a pre-declared threshold."

[[claim]]
id = "shortlist-evaluator-dormant"
level = "open"
statement = "The shortlist top-M recall and fallback-behaviour evaluation vs the reference classifier (crates/uor-r4-graph-certify/src/shortlist_evaluator.rs; Decision D5 / Gate H / Plan §9.16) is retained off the serving path as a measurement surface. Activation gate: a shortlist-recall result clearing Gate H's pre-declared bar."

[[claim]]
id = "anti-degeneracy-dormant"
level = "open"
statement = "The semantic anti-degeneracy surface — corpus transformations, MDL objective J(C), and evaluation harness (crates/uor-r4-graph-certify/src/anti_degeneracy.rs; PDF §7 / Gate G) together with its unsupervised context-perturbation suite (crates/uor-r4-graph-compiler/src/perturbation.rs; Phase 3) — is retained off the serving path; measured and reported, never asserted. Activation gate: an anti-degeneracy J(C) result clearing Gate G's pre-declared bar."

[[claim]]
id = "fairness-provenance-dormant"
level = "open"
statement = "The fairness/provenance harness — source-bias amplification, rare-group erasure, and provenance-deletion (crates/uor-r4-graph-certify/src/fairness_provenance.rs; PDF §14 / Plan §9.21) — is retained off the serving path. Activation gate: a fairness/provenance result adopted as a required gate on a pre-declared bar."

[[claim]]
id = "reference-compiler-ir-dormant"
level = "open"
statement = "The reference floating-point semantic compiler and IR (crates/uor-r4-graph-compiler/src/reference_compiler_ir.rs; PDF §§7,11,17 / #129) is retained off the serving path as the research oracle the shipped integer compiler is checked against. Activation gate: a reference-IR optimisation ported to the shipped integer path scoring at or above it on a pre-declared held-out slice."

[[claim]]
id = "rate-distortion-compression-dormant"
level = "open"
statement = "The semantic-compression and rate-distortion analyzer (crates/uor-r4-graph-compiler/src/rate_distortion_compression.rs; PDF §7 / #136), which formalizes compilation as lossy semantic compression, is retained off the serving path as an analysis surface. Activation gate: a rate-distortion operating point adopted onto the shipped cover/score path clearing a pre-declared bytes-vs-fidelity bar."

[[claim]]
id = "monograph-validator-dormant"
level = "open"
statement = "The hologram/R4 formal-monograph validator and traceability harness (crates/uor-r4-graph-compiler/src/monograph.rs; PDF §§14–17 / #133) is retained off the serving path as a traceability surface. Activation gate: its monograph-traceability check adopted as a required gate."

[[claim]]
id = "behavioral-probes-dormant"
level = "open"
statement = "The unsupervised intervention and counterfactual behavioral-probes layer (crates/uor-r4-graph-compiler/src/behavioral_probes.rs; PDF §§7,11,17 / #128) is retained off the serving path as a probing surface. Activation gate: a behavioral-probe result adopted as a required gate on a pre-declared reusability bar."

[[claim]]
id = "r4-route-attention-dormant"
level = "open"
statement = "The R4RouteAttentionV1 target route-attention operator (#604) — versioned reference semantics and witness replay in crates/uor-r4-graph-certify/src/route_attention.rs, packed R4G1 lowering over borrowed bytes and caller-owned bounded state in crates/uor-r4-graph-runtime/src/route_attention.rs (P-4-scanned), canonical instance substrate and bounds in crates/uor-r4-graph-format/src/route_attention.rs, registry record r4-route-attention/1 in uor-r4-model-source::attention — is retained dormant: constructible and differentially tested (reference and packed agree bit-for-bit on selections, aggregates, census, and witness; independent replay verifies witnesses without running the operator; allocation census asserts a zero-allocation steady state), referenced by no serving path; packed-routing-dormant stays unchanged and no serving default selects it. Pre-declared #604 run contract: metric to move is teacher-forced top-1/top-k agreement and bits/token while preserving the runtime operation contract; no R4-native target baseline exists and the current r4_attention source branch is not a valid one; the cheap instrument is the synthetic reference-vs-packed replay plus a short pinned teacher-forced sample, and the FIRST verdict must prove semantic/operation/witness correctness before any quality interpretation; exit rule: stop if the packed path violates any runtime bound, fails witness replay, or cannot be distinguished from a declared null under the pre-declared test; if positive, hand the operator and traces to the fitting issue (#605) and keep it dormant until the activation gate clears; if negative, retain the operator, its reference, and the negative report — never promote, never delete. Activation gate: a fitted operator instance clearing the pre-declared teacher-forced top-1/top-k and bits/token bars on a pre-declared held-out slice with witness replay intact."

[[claim]]
id = "patch-overlay-dormant"
level = "open"
statement = "The dormant portion of the graph-patch (PTCH) overlay mechanism — section emission (crates/uor-r4-graph-compiler/src/patch_induction.rs) and its lifecycle discipline: newest-valid precedence, fork rejection, compaction after 8 layers (crates/uor-r4-graph-certify/src/patch_lifecycle.rs) — is retained off the serving path as a distinct incremental-update surface (patch epochs over a base graph rather than full recompile). The patch-epoch chain itself (crates/uor-r4-graph-runtime/src/patch_chain.rs) is NOT dormant: it is wired into the serving runtime, held by R4G1Runtime as its patch chain. Activation gate: a patch-overlay serving path built on patch_induction/patch_lifecycle scoring at or above a full recompile on a pre-declared held-out slice."
