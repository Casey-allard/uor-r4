[[claim]]
id = "r4-route-attention-dormant"
level = "open"
statement = "The R4RouteAttentionV1 target route-attention operator (#604) — versioned reference semantics and witness replay in crates/uor-r4-graph-certify/src/route_attention.rs, packed R4G1 lowering over borrowed bytes and caller-owned bounded state in crates/uor-r4-graph-runtime/src/route_attention.rs (P-4-scanned), canonical instance substrate and bounds in crates/uor-r4-graph-format/src/route_attention.rs, registry record r4-route-attention/1 in uor-r4-model-source::attention — is retained dormant: constructible and differentially tested (reference and packed agree bit-for-bit on selections, aggregates, census, and witness; independent replay verifies witnesses without running the operator; allocation census asserts a zero-allocation steady state), referenced by no serving path; packed-routing-dormant stays unchanged and no serving default selects it. Pre-declared #604 run contract: metric to move is teacher-forced top-1/top-k agreement and bits/token while preserving the runtime operation contract; no R4-native target baseline exists and the current r4_attention source branch is not a valid one; the cheap instrument is the synthetic reference-vs-packed replay plus a short pinned teacher-forced sample, and the FIRST verdict must prove semantic/operation/witness correctness before any quality interpretation; exit rule: stop if the packed path violates any runtime bound, fails witness replay, or cannot be distinguished from a declared null under the pre-declared test; if positive, hand the operator and traces to the fitting issue (#605) and keep it dormant until the activation gate clears; if negative, retain the operator, its reference, and the negative report — never promote, never delete. Activation gate: a fitted operator instance clearing the pre-declared teacher-forced top-1/top-k and bits/token bars on a pre-declared held-out slice with witness replay intact."

[[claim]]
id = "route-fit-dormant"
level = "open"
statement = "The R4RouteAttentionV1 offline fitting harness and replacement-ladder evaluator (#605) — versioned fit method route-fit/1 with canonical declared-identity record, eight-identity fit manifest, and production-boundary #603 trace-corpus reader in crates/uor-r4-graph-compiler/src/route_fit.rs; pre-registered run contract as data, progressive replacement ladder (null / one-head / one-layer / layer-range / whole-model / real-teacher / real-corpus) with PASS/FAIL/UNAVAILABLE/NOT_RUN stage records, N1/N2 nulls, anti-vacuity instrument verdict, and decision record in crates/uor-r4-graph-certify/src/route_fit_report.rs — is retained dormant: referenced by no serving path, changing no artifact bytes; r4-route-attention-dormant and packed-routing-dormant stay unchanged. Selection evidence in the ladder comes from the deployed packed kernel (build_route_attention_instance + route_attention_step) with independent witness replay; replacement semantics v1 is support-restrict-renormalize/1 (teacher attention restricted to the fitted-selected top-M support, renormalized). Measured on the synthetic cheap-instrument arm (deterministic 2-layer/2-head/d32/vocab64 fixture teacher, 1024-token mini-corpus, pre-registered margins posted to #605 before the run): instrument valid (N2 0.2353 below 0.5 x fitted 0.5718 at the reference scope); all five synthetic stages passed the pre-registered gates (fitted support overlap 0.5718-0.5872 vs nulls N1 0.2019-0.2064 / N2 0.2312-0.2537; teacher-forced top-1 agreement 0.9902-1.0; bits/token ratio at most 1.0002 of the teacher's 4.9709); the real-teacher and real-corpus stages are UNAVAILABLE (pinned SmolLM2 snapshot absent from the build env; #531 saturation corpus not yet produced, compute-bound), so the synthetic result is a cheap-instrument reading, never a model-quality claim. Activation gate: a positive pre-registered ladder result on the pinned real teacher together with the #531 saturation corpus, with witness replay intact and a valid (non-vacuous) instrument."

[[claim]]
id = "target-operator-certificate-dormant"
level = "open"
statement = "The target-operator recompilation certificate (#606) — versioned schema uor-r4-target-operator-certificate/1 in crates/uor-r4-graph-certify/src/target_operator_certificate.rs, one bounded machine-readable record COMPOSING the existing certification surfaces for R4RouteAttentionV1 recompilation: an identity block with typed absence over source snapshot / tokenizer / adapter / trace / geometry / operator id+version / corpus / compiler / fit-manifest κ / fit-report κ / fitted-params κ; per-scope rows (head, layer, layer-range, model, real-teacher, real-corpus) each carrying five separated verdict families (source-parity, target-fit, runtime-contract, witness-replay, model-quality) with states PASS / FAIL / NOT_MEASURED / BLOCKED(reason) / UNAVAILABLE(reason); runtime-bounds rows embedding the #605 RuntimeChecks with the declared candidate/selection bounds and the allocation-census ownership note; provenance rows referencing the #605 fit report, fit manifest, and fitted parameters by κ and the Gate C parity row type, teacher-parity harness, empirical/performance certificates, and proof obligations by typed identity where no κ exists — is retained dormant: referenced by no serving path, changing no artifact bytes; it embeds the existing GateCMetrics rows and references RouteFitReport/RunContract by κ rather than duplicating Gate C, the #307 parity harness, or any proof obligation, and replacement comparisons bind to outcomes under replacement, never per-step path agreement (historical program measurement recorded in #606 planning: equal task outcomes at roughly 0.1-0.2 per-step path agreement). The derived overall quality verdict is a pure function returning NOT_PASSING unless every required identity, scope row, runtime row, provenance reference, and obligation link is present and valid; the passing value carries a token constructible only by that derivation, so a missing, blocked, or unavailable prerequisite makes a passing quality claim unrepresentable and a compiled artifact never reads as a quality success. Measured on the #605 synthetic-ladder outputs: the four synthetic scope rows record source-parity / target-fit / runtime-contract / witness-replay PASS with model-quality UNAVAILABLE, the real-teacher and real-corpus rows are UNAVAILABLE with the #605 reason strings (pinned SmolLM2 snapshot absent from the build env; #531 saturation corpus not yet produced, compute-bound), and the overall quality verdict is NOT_PASSING. Activation gate: a certificate over the real-teacher + #531-corpus ladder with a valid (non-vacuous) instrument deriving a passing quality verdict."

[[claim]]
id = "patch-overlay-dormant"
level = "open"
statement = "The dormant portion of the graph-patch (PTCH) overlay mechanism — section emission (crates/uor-r4-graph-compiler/src/patch_induction.rs) and its lifecycle discipline: newest-valid precedence, fork rejection, compaction after 8 layers (crates/uor-r4-graph-certify/src/patch_lifecycle.rs) — is retained off the serving path as a distinct incremental-update surface (patch epochs over a base graph rather than full recompile). The patch-epoch chain itself (crates/uor-r4-graph-runtime/src/patch_chain.rs) is NOT dormant: it is wired into the serving runtime, held by R4G1Runtime as its patch chain. Activation gate: a patch-overlay serving path built on patch_induction/patch_lifecycle scoring at or above a full recompile on a pre-declared held-out slice."
