# model/ids.toml --- the conformance ID register (R1).
#
# #273 migration: uor-r4's Gherkin feature suites brought under the register.
# One conformance ID per feature-capability; every scenario in the suite is
# tagged with it and its honesty level, and a marker test in repo-conformance
# ends in the ID slug. CONFORMANCE.md is generated from this file (never edit
# it by hand). Level `build`: constructed here and validated against its suite.
#
# #830 (item B of #821) schema migration: every row now also carries an
# execution `scope`, a serving `reachability`, and an `evidence` pointer, so the
# register can no longer be over-read (a reference/f32 model, an offline
# compiler stage, a certifier instrument, a dormant portable-runtime mechanism,
# the normative runtime contract, and the deployed production path are now
# distinct and machine-visible). The fields have deterministic migration
# defaults (`scope = reference-only`, `reachability = off-serving-path`, empty
# evidence) so a row that omits them understates rather than over-reads; every
# row below sets them explicitly. `build` is harness-built (structural) status;
# an empirical verdict (PASS/FAIL/UNAVAILABLE) is a separate axis and a missing
# fixture is UNAVAILABLE, never PASS.

