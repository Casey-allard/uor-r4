[[claim]]
id = "r4-route-attention-dormant"
level = "open"
statement = "The R4RouteAttentionV1 target route-attention operator (#604) — versioned reference semantics and witness replay in crates/uor-r4-graph-certify/src/route_attention.rs, packed R4G1 lowering over borrowed bytes and caller-owned bounded state in crates/uor-r4-graph-runtime/src/route_attention.rs (P-4-scanned), canonical instance substrate and bounds in crates/uor-r4-graph-format/src/route_attention.rs, registry record r4-route-attention/1 in uor-r4-model-source::attention — is retained dormant: constructible and differentially tested (reference and packed agree bit-for-bit on selections, aggregates, census, and witness; independent replay verifies witnesses without running the operator; allocation census asserts a zero-allocation steady state), referenced by no serving path; packed-routing-dormant stays unchanged and no serving default selects it. Pre-declared #604 run contract: metric to move is teacher-forced top-1/top-k agreement and bits/token while preserving the runtime operation contract; no R4-native target baseline exists and the current r4_attention source branch is not a valid one; the cheap instrument is the synthetic reference-vs-packed replay plus a short pinned teacher-forced sample, and the FIRST verdict must prove semantic/operation/witness correctness before any quality interpretation; exit rule: stop if the packed path violates any runtime bound, fails witness replay, or cannot be distinguished from a declared null under the pre-declared test; if positive, hand the operator and traces to the fitting issue (#605) and keep it dormant until the activation gate clears; if negative, retain the operator, its reference, and the negative report — never promote, never delete. Activation gate: a fitted operator instance clearing the pre-declared teacher-forced top-1/top-k and bits/token bars on a pre-declared held-out slice with witness replay intact."

[[claim]]
id = "msa-structured-selector-dormant"
level = "open"
statement = "The MsaStructuredSelectorV1 target attention operator (#643) — versioned reference semantics and witness replay in crates/uor-r4-graph-certify/src/msa_selector.rs, packed R4G1 lowering over borrowed bytes and caller-owned bounded state in crates/uor-r4-graph-runtime/src/msa_selector.rs (P-4-scanned), canonical instance substrate and bounds in crates/uor-r4-graph-format/src/msa_selector.rs, registry record msa-structured-selector/1 in uor-r4-model-source::attention — is retained dormant: constructible and differentially tested (reference and packed agree bit-for-bit on selections, aggregates, census, and witness over byte-identical instances; independent replay verifies witnesses without running the operator), referenced by no serving path; no serving default selects it. Classification (role_rank, cascade_position) is grounded in the Modular Structural Arithmetic paper's MSA7 11-Theorem and Theorem M4 11-Cascade Theorem for 3 of 11 residues mod 11, extended to the other 8 by this project's own cascade-position-mod-3 rule (Casey-confirmed 2026-08-16, explicitly not a paper theorem) and precomputed into the instance bytes at build time so the P-4-scanned packed path never recomputes a modulus. Plug-compatible with r4-route-attention/1 by construction (identical top-M selection, saturating-scoreq aggregation, and lowest-index tie-break shape) for a future shared A/B harness. Pre-declared #643 run contract (posted on the issue before any run, per the #626 convention): POSITIVE iff, on the same held-out evaluation corpus and candidate set r4-route-attention/1 is measured against, msa-structured-selector/1 achieves top-1 next-token accuracy >= r4-route-attention/1's top-1 accuracy + 0.02 absolute, does not increase bits-per-token versus r4-route-attention/1, and beats the #457 unigram floor; NEGATIVE (including no measurable difference) closes #643 with the comparison table, keeping this dormant claim as the negative-result record; the wiring into a shared held-out evaluation loop with r4-route-attention/1 is the next concrete action and is not yet done. Activation gate: a positive pre-registered A/B result on the pinned real teacher together with the #531 saturation corpus, with witness replay intact."

[[claim]]
id = "route-fit-dormant"
level = "open"
statement = "The R4RouteAttentionV1 offline fitting harness and replacement-ladder evaluator (#605) — versioned fit method route-fit/1 with canonical declared-identity record, eight-identity fit manifest, and production-boundary #603 trace-corpus reader in crates/uor-r4-graph-compiler/src/route_fit.rs; pre-registered run contract as data, progressive replacement ladder (null / one-head / one-layer / layer-range / whole-model / real-teacher / real-corpus) with PASS/FAIL/UNAVAILABLE/NOT_RUN stage records, N1/N2 nulls, anti-vacuity instrument verdict, and decision record in crates/uor-r4-graph-certify/src/route_fit_report.rs — is retained dormant: referenced by no serving path, changing no artifact bytes; r4-route-attention-dormant and packed-routing-dormant stay unchanged. Selection evidence in the ladder comes from the deployed packed kernel (build_route_attention_instance + route_attention_step) with independent witness replay; replacement semantics v1 is support-restrict-renormalize/1 (teacher attention restricted to the fitted-selected top-M support, renormalized). Measured on the synthetic cheap-instrument arm (deterministic 2-layer/2-head/d32/vocab64 fixture teacher, 1024-token mini-corpus, pre-registered margins posted to #605 before the run): instrument valid (N2 0.2353 below 0.5 x fitted 0.5718 at the reference scope); all five synthetic stages passed the pre-registered gates (fitted support overlap 0.5718-0.5872 vs nulls N1 0.2019-0.2064 / N2 0.2312-0.2537; teacher-forced top-1 agreement 0.9902-1.0; bits/token ratio at most 1.0002 of the teacher's 4.9709); the synthetic result is a cheap-instrument reading, never a model-quality claim. UPDATE (2026-08-19, #804/#605 S1 verdict): the real-teacher stage is no longer UNAVAILABLE — it was run against a traced SmolLM2-360M teacher on 62,875 broad-corpus records over 6.6M eligible steps and returned FAIL (instrument vacuous): fitted support overlap 0.396 recovered structure over the permuted-code N1 null (0.192) with every deployed-kernel runtime check passing, but the pre-registered anti-vacuity N2 null (supports shifted one position) reached 0.292 because teacher attention supports are temporally smooth at this scale, so the instrument cannot attribute the fitted structure to genuine per-position routing (119/120 heads individually vacuous) and by contract the run fails and licenses nothing (record: #605 corpus issuecomment-5337863280 / verdict issuecomment-5337903765; #804 close); the real-corpus stage stays UNAVAILABLE (#531 saturation corpus not produced, compute-bound). The operator stays dormant behind its unchanged gate. Activation gate: a positive pre-registered ladder result on the pinned real teacher with a vacuity-robust instrument (excess-over-N2 as the primary metric, or restricted-forward parity), the #531 saturation corpus, and witness replay intact."

[[claim]]
id = "target-operator-certificate-dormant"
level = "open"
statement = "The target-operator recompilation certificate (#606) — versioned schema uor-r4-target-operator-certificate/1 in crates/uor-r4-graph-certify/src/target_operator_certificate.rs, one bounded machine-readable record COMPOSING the existing certification surfaces for R4RouteAttentionV1 recompilation: an identity block with typed absence over source snapshot / tokenizer / adapter / trace / geometry / operator id+version / corpus / compiler / fit-manifest κ / fit-report κ / fitted-params κ; per-scope rows (head, layer, layer-range, model, real-teacher, real-corpus) each carrying five separated verdict families (source-parity, target-fit, runtime-contract, witness-replay, model-quality) with states PASS / FAIL / NOT_MEASURED / BLOCKED(reason) / UNAVAILABLE(reason); runtime-bounds rows embedding the #605 RuntimeChecks with the declared candidate/selection bounds and the allocation-census ownership note; provenance rows referencing the #605 fit report, fit manifest, and fitted parameters by κ and the Gate C parity row type, teacher-parity harness, empirical/performance certificates, and proof obligations by typed identity where no κ exists — is retained dormant: referenced by no serving path, changing no artifact bytes; it embeds the existing GateCMetrics rows and references RouteFitReport/RunContract by κ rather than duplicating Gate C, the #307 parity harness, or any proof obligation, and replacement comparisons bind to outcomes under replacement, never per-step path agreement (historical program measurement recorded in #606 planning: equal task outcomes at roughly 0.1-0.2 per-step path agreement). The derived overall quality verdict is a pure function returning NOT_PASSING unless every required identity, scope row, runtime row, provenance reference, and obligation link is present and valid; the passing value carries a token constructible only by that derivation, so a missing, blocked, or unavailable prerequisite makes a passing quality claim unrepresentable and a compiled artifact never reads as a quality success. Measured on the #605 synthetic-ladder outputs: the four synthetic scope rows record source-parity / target-fit / runtime-contract / witness-replay PASS with model-quality UNAVAILABLE, the real-teacher scope row is no longer UNAVAILABLE — its target-fit family records FAIL under the #804/#605 S1 anti-vacuity contract (N2 null 0.292 vs fitted support overlap 0.396; instrument vacuous, 119/120 heads vacuous) with model-quality UNAVAILABLE, the real-corpus row stays UNAVAILABLE (#531 saturation corpus not produced, compute-bound), and the overall quality verdict remains NOT_PASSING. Activation gate: a certificate over the real-teacher + #531-corpus ladder with a valid (non-vacuous) instrument deriving a passing quality verdict."

[[claim]]
id = "bounded-semantic-transition-planner-off-serving"
level = "open"
statement = "The bounded semantic-transition planner exposed as R4G1Runtime::plan_bounded (crates/uor-r4-graph-runtime/src/engine.rs and src/plan.rs) is retained as a portable runtime and certifier surface, separate from production token selection. Its fixed-capacity, allocation-free, P-4-only execution, typed declines, and self-contained witness replay are structurally tested; the #843 development measurement remains LIMITED because it clears the frozen effect floor on 12/20 joint-split cells while greedy continuation solves the other 8. No caller outside the planner definition reaches it from a deployed serving surface, and #846 recorded the untouched final-partition arm NOT_RUN with dependent evidence UNAVAILABLE and REASONING NOT ESTABLISHED. This ledger row tracks the missing activation/reachability boundary rather than duplicating RF-33's built-capability registration. Activation gate: a mechanically reachable production consumer plus a predeclared, access-bound untouched-partition result that clears its named baseline with witness replay intact."

[[claim]]
id = "patch-overlay-dormant"
level = "open"
statement = "The dormant portion of the graph-patch (PTCH) overlay mechanism — section emission (crates/uor-r4-graph-compiler/src/patch_induction.rs) and its lifecycle discipline: newest-valid precedence, fork rejection, compaction after 8 layers (crates/uor-r4-graph-certify/src/patch_lifecycle.rs) — is retained off the serving path as a distinct incremental-update surface (patch epochs over a base graph rather than full recompile). The patch-epoch chain type (crates/uor-r4-graph-runtime/src/patch_chain.rs) is a field of R4G1Runtime, ADR-0001's normative candidate/token selector, but no deployed serving caller invokes R4G1Runtime::try_push_patch and no deployed path induces or emits patch epochs today. Patch-chain data-structure reachability therefore does not establish a normative-serving patch-overlay capability; patch_induction / patch_lifecycle remain the dormant overlay-update surface. Activation gate: a patch-overlay serving path built on patch_induction/patch_lifecycle scoring at or above a full recompile on a pre-declared held-out slice."
