outputs = ["model.safetensors", "hamming_read.safetensors", "config.json"]
timeout_seconds = 7200

[[commands]]
id = "score"
role = "score"
program = "train-in-space"
args = ["--score-rows", "CHECKPOINT", "--context", "192", "--reply-tokens", "48", "--samples", "1200", "--retain-rates", "1"]
