source_pin = "4add144ebdc9087e47fe3fa830fb21116278644e"
summary = "One fresh-start 1,024-step training of the current FBS/Hamming geometric path on the aligned scenario corpus, exported as a bound uor-r4.lut-stack/10 artifact and scored against the same-evaluator previous-token count table."

[model]
tokenizer_sha256 = "d36d3e8700a123e620012df77de195f244fbdb4d05d9e1aa7e77fa9407590f89"
vocab = 4096
width = 256
layers = 6
training_context = 192
context = 192
objective = "cell"
training = "float32 on CUDA; train-as-served rounding is applied before each forward"
serving = "bound integer UORLUT01 artifact; Q12 writer points and branch-free table arithmetic"

[artifact]
family = "uor-r4.lut-stack"
provenance = "required"
schema = "uor-r4.lut-stack/10"

[[artifact.sections]]
id = "trunk"
required = true
owner = "fbs-trunk"
format = "4-bit matrices, group scales, i16/i32/u32 tables"
description = "The SpiralCore/FBS recurrence, route maps, Hamilton gates and serving tables."

[[artifact.sections]]
id = "hamming-reads"
required = true
owner = "hamming-copy-read"
format = "Q24 rotations and weights, Q16 margins, i16 ask tables when present"
exponent = -24
description = "The trained copy and type reads, including the latest-exact copy rule."

[[artifact.sections]]
id = "turn-memory"
required = true
owner = "turn-memory"
format = "u32 keys and values, i32 Q24 move weights"
exponent = -24
description = "The opening and reply tables that carry stated facts across turns."

[[artifact.sections]]
id = "writer"
required = true
owner = "whole-table-readout"
format = "native vector writer cells and Q12 i16 token points"
exponent = -12
description = "The native writer and whole-table nearest-token readout."

