args = ["-n", "-f", "conformance/stack/scenario-decision.jq", "--arg", "run_id", "RUN_ID", "--arg", "source_head", "REVIEWED_HEAD", "--arg", "code_pin", "CODE_PIN", "--arg", "implementation_source", "IMPLEMENTATION_SOURCE", "--arg", "job_sha256", "JOB_SHA256", "--arg", "launcher_sha256", "LAUNCHER_SHA256", "--arg", "watcher_sha256", "WATCHER_SHA256", "--arg", "scorer_sha256", "SCORER_SHA256", "--arg", "review_sha256", "REVIEW_SHA256", "--arg", "input_manifest_sha256", "INPUT_MANIFEST_SHA256", "--arg", "bundle_sha256", "BUNDLE_SHA256", "--arg", "base_artifact_sha256", "BASE_SHA256", "--arg", "scenario_receipt_sha256", "SCENARIO_RECEIPT_SHA256", "--arg", "preflight_development_sha256", "PREFLIGHT_DEVELOPMENT_SHA256", "--arg", "preflight_fresh_sha256", "PREFLIGHT_FRESH_SHA256", "--arg", "contract_semantic_blake3", "CONTRACT_SEMANTIC_BLAKE3", "--arg", "artifact_sha256", "MODEL_ARTIFACT_SHA256", "--slurpfile", "base-development", "SCORE_DIR/base-development.json", "--slurpfile", "model-development", "SCORE_DIR/model-development.json", "--slurpfile", "base-fresh", "SCORE_DIR/base-fresh.json", "--slurpfile", "model-fresh", "SCORE_DIR/model-fresh.json"]
env = []
inputs = ["scenario-decision.jq", "scenario-receipt", "preflight-development", "preflight-fresh", "SCORE_DIR/base-development.json", "SCORE_DIR/model-development.json", "SCORE_DIR/base-fresh.json", "SCORE_DIR/model-fresh.json"]
outputs = ["SCORE_DIR/decision.json"]
timeout_seconds = 300

[[commands]]
id = "snapshot"
role = "export"
program = "target/release/fbs-snapshot"
args = ["CHECKPOINT_DIR", "SNAPSHOT_OUT"]
env = []
inputs = ["model.safetensors", "hamming_read.safetensors", "turn_memory.safetensors", "turn_memory_reply.safetensors", "config.json"]
outputs = ["SNAPSHOT_OUT"]
timeout_seconds = 1800

[[commands]]
id = "export"
role = "export"
program = "target/release/fbs-export"
args = ["--raw-gates", "--raw-transition", "--run-config", "config.json", "--stack-contract", "conformance/stack/fbs-deepseek-scenario-smoke.toml", "--stack-contract-semantic-blake3", "SEMANTIC_BLAKE3", "--tokenizer", "tokenizer.json", "SNAPSHOT_OUT", "ARTIFACT_OUT"]
env = []
inputs = ["model.safetensors", "hamming_read.safetensors", "turn_memory.safetensors", "turn_memory_reply.safetensors", "config.json", "tokenizer", "SNAPSHOT_OUT", "fbs-deepseek-scenario-smoke.toml"]
outputs = ["ARTIFACT_OUT"]
timeout_seconds = 900

[[commands]]
id = "serve"
role = "serve"
program = "uor-chat"
args = ["--stack", "step-001024.uorlut", "--tokenizer", "tokenizer.json", "--protocol", "2", "--max-tokens", "64"]
env = []
inputs = ["step-001024.uorlut", "tokenizer"]
outputs = ["chat.json"]
timeout_seconds = 300

[[commands]]
id = "audit"
role = "verify"
program = "cargo"
args = ["run", "--offline", "--release", "--locked", "-q", "-p", "xtask", "--", "stack-audit", "--contract", "conformance/stack/fbs-deepseek-scenario-smoke.toml", "--artifact", "ARTIFACT_OUT", "--tokenizer", "tokenizer.json", "--config", "config.json", "--checkpoint", "CHECKPOINT_DIR", "--out", "AUDIT_OUT"]
env = []
inputs = ["fbs-deepseek-scenario-smoke.toml", "ARTIFACT_OUT", "tokenizer", "config.json", "model.safetensors", "hamming_read.safetensors", "turn_memory.safetensors", "turn_memory_reply.safetensors"]
outputs = ["AUDIT_OUT"]
timeout_seconds = 600

[[readings]]
id = "grounded-asked-value"
class = "semantic"
description = "Fresh asked-value hits over memorize, paraphrase, selection and update."
mechanism = "whole-table-readout"
unit = "count of 441"
better = "higher"
bar = 20.0

[[readings]]
id = "each-grounded-family"
class = "semantic"
description = "Each of the four grounded archetypes independently reaches at least five asked-value hits."
mechanism = "hamming-copy-read"
unit = "count of about 110"
better = "higher"
bar = 5.0

[[readings]]
id = "control-abstention"
class = "semantic"
description = "Fresh wrong-memory and no-memory controls abstain correctly."
mechanism = "turn-memory"
unit = "count of 220"
better = "higher"
bar = 10.0

[[readings]]
id = "copy-positive-control"
class = "semantic"
description = "Fresh direct-copy prompts still name the asked value."
mechanism = "integer-export"
unit = "count of 110"
better = "higher"
bar = 11.0

[[readings]]
id = "distractor-safety"
class = "semantic"
description = "Fresh non-copy rows do not emit a distractor value."
mechanism = "integer-export"
unit = "count of 882"
better = "lower"
bar = 10.0

[[readings]]
id = "complete-replies"
class = "structural"
description = "Fresh replies stop on EOS."
mechanism = "short-cycle-stop"
unit = "count of 1024"
better = "higher"

[[probes]]
id = "context-boundary"
class = "boundary"
mechanism = "fbs-trunk"
axis = "context length"
expectation = "A short turn is served and an oversized turn is refused with an explicit context error."
cases = ["inside window", "oversize turn"]
fixture = "conformance/stack/fixtures/context-boundary.v2.json"
fixture_sha256 = "8b89092c838c0191fd4e257d7e884cb0990d66be2434d99c63beef28744b3830"
layers = ["chat"]

[[probes]]
id = "copy-boundary"
class = "boundary"
mechanism = "hamming-copy-read"
axis = "candidate count and tie order"
expectation = "A source is available to a later question and a fresh rerun is deterministic."
cases = ["source present", "kept-set order"]
fixture = "conformance/stack/fixtures/copy-boundary.v2.json"
fixture_sha256 = "b418f3b7fe72b457eab34ecdb703279125747f81a39eeca3e315af9aae84b479"
layers = ["chat"]

[[probes]]
id = "memory-precedence"
class = "metamorphic"
mechanism = "turn-memory"
axis = "explicit, sieve and absent memory"
expectation = "Explicit memory overrides the sieve, the sieve derives a value, and an absent value emits no line."
cases = ["automatic", "explicit overrides", "absent"]
fixture = "conformance/stack/fixtures/memory-precedence.v2.json"
fixture_sha256 = "409e782ef2d63e55f7ccd6a5c495d3269ee274b0f9825b030d3340d00263d6d7"
layers = ["chat"]

[[probes]]
id = "cycle-period-boundary"
class = "boundary"
mechanism = "short-cycle-stop"
axis = "cycle period"
expectation = "Every served reply reports a terminal EOS, cap or short-cycle stop."
cases = ["recorded stop", "no unreported exhaustion"]
fixture = "conformance/stack/fixtures/cycle-boundary.v2.json"
fixture_sha256 = "ac70c4a9594db51b90485ce488e74c988aa0085ca8cd7fa2e982ee7342941a4f"
layers = ["chat"]

[[probes]]
id = "float-integer-boundary"
class = "parity"
mechanism = "integer-export"
axis = "execution layer"
expectation = "The artifact and tokenizer identities reach the product chat path and one integer token is generated."
cases = ["chat script"]
fixture = "conformance/stack/fixtures/representation-parity.v2.json"
fixture_sha256 = "d0fc311df673ba2d5ecb4352c72a90c9f41e9d59b0d498ad094b7ca2c1ca5751"
layers = ["chat"]

[[non_claims]]
id = "not-general-chat"
statement = "This smoke does not answer general questions reliably and is not a completed frontier-capable chat model."

[[non_claims]]
id = "not-mechanism-retirement"
statement = "A provisional miss routes the next step; it does not retire the named mechanism."

[[non_claims]]
id = "not-board-capability"
statement = "Contract validation and probe execution are structural evidence, not a capability pass."
