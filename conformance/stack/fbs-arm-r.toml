[[commands]]
id = "train"
role = "train"
program = "cargo"
args = ["run", "--release", "--locked", "-p", "uor-r4-float-train", "--bin", "train-in-space", "--", "--objective", "cell", "--retain-rates", "1", "--decay-mult", "1", "--lr", "0.001", "--lr-end", "0", "--context", "192", "--width", "256", "--hamming-read", "4", "--batch", "16", "--turn-memory", "8", "--turn-memory-reply", "1", "--turn-memory-dropout", "500", "--samples", "6", "--reply-tokens", "48", "--steps", "16384", "--eval-every", "2048", "--hamming-copy-latest", "1", "--turn-memory-leave-copied", "1"]
env = []
inputs = ["train-tokens", "train-mask", "tokenizer"]
outputs = ["model.safetensors", "hamming_read.safetensors", "turn_memory.safetensors", "turn_memory_reply.safetensors", "config.json"]
timeout_seconds = 21600

[[commands]]
id = "score"
role = "score"
program = "train-in-space"
args = ["--score-rows", "CHECKPOINT", "--panel", "line", "--sample-opening", "last", "--samples", "1200", "--context", "192", "--reply-tokens", "48", "--retain-rates", "1"]
env = []
inputs = ["line-panel", "no-line-panel"]
outputs = ["score.json"]
timeout_seconds = 7200

[[commands]]
id = "export"
role = "export"
program = "fbs-export"
args = ["--legacy-artifact", "--raw-gates", "--raw-transition", "--run-config", "config.json", "--context", "8256", "SNAPSHOT_JSON", "r.uorlut"]
env = []
inputs = ["model.safetensors", "hamming_read.safetensors", "turn_memory.safetensors", "turn_memory_reply.safetensors", "config.json"]
outputs = ["r.uorlut"]
timeout_seconds = 1800

[[commands]]
id = "serve"
role = "serve"
program = "uor-chat"
args = ["--stack", "r.uorlut", "--tokenizer", "tokenizer.json", "--protocol", "2", "--max-tokens", "48"]
env = []
inputs = ["r.uorlut", "tokenizer"]
outputs = ["chat.json"]
timeout_seconds = 300

[[commands]]
id = "audit"
role = "verify"
program = "cargo"
args = ["xtask", "stack-audit", "--contract", "conformance/stack/fbs-arm-r.toml"]
env = []
inputs = ["fbs-arm-r.toml"]
outputs = ["stack-audit.json"]
timeout_seconds = 300

