name: Implementation
description: Advance the native geometric language model with a concrete result and focused evidence.
title: "[impl] <concrete outcome>"
body:
  - type: markdown
    attributes:
      value: |
        Follow docs/integration/NOW.md, project-track.md, current-state.md and AGENTS.md.
        #2028 owns the ordered roadmap (milestones M1–M8, #2029–#2036). Reuse an existing responsibility before creating another tracker.
        Hard rules: no softmax/softplus/sigmoid/tanh/GELU anywhere (D23/D25); no matmul/GEMM in training or serving (D25/D30); D37 allows float in offline training only, in a separate scanned module; serving is integer-only (D11).
  - type: input
    id: owner
    attributes:
      label: Roadmap issue and next action
      description: Name the responsibility this advances and any real dependency.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Observed problem, evidence and why this change
      description: Link actual source and prior positive/negative results. Explain the causal limitation.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Concrete implementation and compatibility
      description: Name affected Rust path, reused mechanism, learned versus fixed behavior, artifact/state effects and preservation.
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Complete resource projection
      description: Include prep/build/fit/controls/evaluation/retries/checkpoints, shared cumulative balance, CPU/threads, RAM, storage and stop margin. Use zero model work for documentation-only changes.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance, direct verification and next decision
      description: Name complete generated behavior and relevant focused checks, controls, open/final separation and positive/negative decisions. CI acknowledgements are not tests.
    validations:
      required: true
  - type: textarea
    id: records
    attributes:
      label: Documentation and claim boundary
      description: Update current-state and the owning issue, preserve dated records, distinguish measured behavior/proof/hypothesis. Partial PRs reference rather than close the parent. No automatic broad QA or conformance programme.
    validations:
      required: true
