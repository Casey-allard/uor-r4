name: Research / experiment
description: Propose a scoped decision-bearing measurement; open development and final held-out evaluation remain distinct.
title: "[research] <one-line hypothesis>"
body:
  - type: markdown
    attributes:
      value: |
        Product-decision research intake. Current sequencing lives in
        `docs/integration/project-track.md`; current implementation and next action
        live in `docs/integration/current-state.md`. Reuse the source-linked
        direction and architecture audit before introducing a mechanism.
        Apply the progress-control rules in the execution policy before compute.
        Reuse an existing active issue and valid measurements when possible.
        Name the integrated deliverable, new causal evidence for any repeat,
        fixed context/access conditions and necessary checks; reject a run whose
        outcomes cannot change implementation or adoption.
        Start with the smallest needed falsifier, establish causal-path reachability,
        compare non-degenerate geometry and equal-size non-geometric controls,
        and include student-prefix output when generation is in scope. Required
        fields define the smallest decision-bearing falsifier.
        The reachability arithmetic, cost, and durable record fields below are
        mandatory only for a run measured in hours; small operator probes may
        leave them blank and keep their evidence in the owning issue/PR.
        Unavailable fixtures are `UNAVAILABLE`, never a vacuous PASS.
  - type: input
    id: parent
    attributes:
      label: Parent tracker / stage
      description: Ordered #820 roadmap responsibility whose implementation decision this changes.
      placeholder: "#820 / <active predictive-memory child>"
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Product decision changed by this result
      description: Name the exact positive, negative, or stop decision. Research with no reachable consumer is archived rather than activated.
    validations:
      required: true
  - type: textarea
    id: product-reachability
    attributes:
      label: Real token-path reachability
      description: Identify the compiler/operator/CLI path and the cheap observation proving this mechanism executes before token selection and can change candidate-relative scores or decoded choice.
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: The single falsifiable claim under test, stated so a negative result is meaningful.
    validations:
      required: true
  - type: textarea
    id: pinned-identities
    attributes:
      label: Pinned identities
      description: Pin the smallest relevant corpus split, lexical codec, construction artifact/checkpoint, geometry, decode, and report identities. Name a source/teacher only when the experiment actually uses one. Give CIDs/κ where they already exist; do not build an identity framework for a smoke test.
      placeholder: |
        corpus: <name / CID>
        teacher: <HF repo @ pinned revision>
        tokenizer: <CID>
        compiler / decoder / report: <SHAs / CIDs>
    validations:
      required: true
  - type: textarea
    id: reachability
    attributes:
      label: Reachability arithmetic
      description: From numbers already in hand, compute the ceiling on the metric this run can move. If the ceiling is below the effect you need, do not launch.
      placeholder: "e.g. the operator runs at one of 30 layers, so a final-logit effect must first be observable at that layer; if it is zero, a full rollout cannot rescue reachability."
    validations:
      required: false
  - type: textarea
    id: null-and-controls
    attributes:
      label: Null baseline and negative controls
      description: The non-degenerate disabled/shuffled/permuted-geometry control under equal data, parameters, candidate budget, and decode settings.
    validations:
      required: true
  - type: textarea
    id: cheap-instrument
    attributes:
      label: Binding cheap instrument and required verdict
      description: Name the unresolved risk and the cheapest existing or new evidence that resolves it. Cite valid prior checks instead of rerunning them. No new test is needed when the required evidence already exists.
    validations:
      required: true
  - type: textarea
    id: thresholds-and-branches
    attributes:
      label: Predeclared thresholds and outcome branches
      description: The exit rule (threshold, pre-declared) AND the distinct next action for each of the positive and negative outcomes. If both branches lead to the same action, the run has no decision value.
      placeholder: |
        exit rule: positive if ≥ +2pp top-1 (causal row), else negative
        if positive: <next action>
        if negative: <different next action>
    validations:
      required: true
  - type: input
    id: cost
    attributes:
      label: Cost estimate
      description: Wall-clock, resources, and what else the run blocks.
      placeholder: "Complete prep/build/fit/controls/evaluation/retries/checkpoint wall time, threads, RAM, storage and shared cumulative balance"
    validations:
      required: false
  - type: textarea
    id: free-running
    attributes:
      label: Student-prefix / free-running evidence
      description: If generation is in scope, give the bounded prompt count, horizon, cycle check, and decision metric. Otherwise explain why generation is not claimed.
    validations:
      required: true
  - type: input
    id: evidence-record
    attributes:
      label: Evidence record path
      description: The per-issue record this will append to (docs/<topic>_<issue>.md). Records are append-only; live summaries are reconciled separately.
      placeholder: "docs/<topic>_<issue>.md"
    validations:
      required: false
  - type: dropdown
    id: claim-status
    attributes:
      label: Claim status (docs/formal_vocabulary.md §2)
      description: The evidence class the result would carry if positive.
      options:
        - Empirical (measured on a pinned corpus with protocol + CIs + provenance)
        - Structural (construction / machine-checked test / fuzz / CI proof artifact)
        - Witnessed (per-execution replayable witness)
        - Assumed (required by a proof/certificate, not established here)
        - Unproven (goal asserted, no evidence yet)
    validations:
      required: true
  - type: textarea
    id: execution-scope
    attributes:
      label: Execution scope
      description: Which surface the evidence speaks to — experimental decoder, reference, offline/compiler, certifier, frozen runtime, product path, or deployed-serving. These are never conflated.
    validations:
      required: true
