name: Lab delivery evidence

# Privileged validation runs only trusted default-branch workflow code. It does
# not checkout, build, import or execute PR code, evidence, commands or artifacts.
# Existing ci emits merge_group events; workflow_run here is a data-only bridge
# that publishes the status on that exact synthetic SHA after validation.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number to validate; required for manual requests'
        type: string
        required: true
      merge_group_sha:
        description: 'Optional exact single-PR queue SHA for an integration retry'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  statuses: write

concurrency:
  group: lab-delivery-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || inputs.merge_group_sha || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate delivery evidence (status publisher)
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate pinned receipts and publish mission-delivery-gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const repository = `${owner}/${repo}`;
            const hex40 = /^[0-9a-f]{40}$/;
            const hex64 = /^[0-9a-f]{64}$/;
            const digest = b => crypto.createHash('sha256').update(b).digest('hex');
            const requireThat = (p, m) => { if (!p) throw new Error(m); };
            const nonempty = x => typeof x === 'string' && x.trim().length > 0;
            const runUrl = `https://github.com/${repository}/actions/runs/${context.runId}`;
            let prNumber;
            let groupSha;
            let statusSha;
            const publish = async (state, description) => github.rest.repos.createCommitStatus({
              owner, repo, sha: statusSha, context: 'mission-delivery-gate',
              state, description: description.slice(0, 140), target_url: runUrl
            });
            try {
              if (context.eventName === 'workflow_run') {
                const run = context.payload.workflow_run;
                const expected = (await github.rest.actions.getWorkflow({owner, repo, workflow_id: 'ci.yml'})).data;
                requireThat(run.workflow_id === expected.id && run.repository.id === context.payload.repository.id,
                  'Unexpected workflow or repository in merge-group signal');
                const match = /^gh-readonly-queue\/main\/pr-([0-9]+)-/.exec(run.head_branch || '');
                requireThat(match, 'Unknown queue ref shape; do not guess its PR membership');
                prNumber = Number(match[1]);
                groupSha = run.head_sha;
              } else if (context.eventName === 'pull_request_target') {
                prNumber = context.payload.pull_request.number;
              } else {
                requireThat(/^[1-9][0-9]*$/.test(context.payload.inputs.pull_request || ''), 'Invalid PR input');
                prNumber = Number(context.payload.inputs.pull_request);
                groupSha = context.payload.inputs.merge_group_sha || undefined;
              }
              requireThat(Number.isSafeInteger(prNumber) && prNumber > 0, 'Invalid PR number');
              if (groupSha) requireThat(hex40.test(groupSha), 'Invalid synthetic commit SHA');
              const pr = (await github.rest.pulls.get({owner, repo, pull_number: prNumber})).data;
              // Advisory only (owner merge rule, #820): a draft, closed or non-main PR,
              // or one whose head has no published receipt, is not applicable. Report
              // that and publish no status, rather than a failure that reads as broken CI.
              const notApplicable = async reason => {
                core.notice(`Delivery evidence not applicable to PR #${prNumber}: ${reason}. No status published; no tests run.`);
                await core.summary.addHeading('Delivery evidence: not applicable')
                  .addRaw(`PR #${prNumber}: ${reason}. This advisory gate validates only published lab receipts; it ran no tests and published no status.`).write();
              };
              if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main') {
                await notApplicable('the PR is not an open, ready PR targeting main');
                return;
              }
              const receiptPublished = async () => {
                try {
                  const ref = (await github.rest.git.getRef({owner, repo, ref: 'heads/codex/lab-state'})).data.object.sha;
                  await github.rest.repos.getContent({owner, repo, path: `delivery/pr-${prNumber}/${pr.head.sha}.json`, ref});
                  return true;
                } catch (error) {
                  if (error.status === 404) return false;
                  throw error;
                }
              };
              if (!(await receiptPublished())) {
                await notApplicable(`no delivery receipt is published for head ${pr.head.sha}`);
                return;
              }
              statusSha = groupSha || pr.head.sha;
              requireThat(hex40.test(statusSha), 'Target head is not a full SHA');
              await publish('pending', 'Checking exact-source review and executable-check receipts');

              // Read only a single pinned snapshot of the operational branch.
              const envelopePath = groupSha
                ? `delivery/merge-groups/${groupSha}.json`
                : `delivery/pr-${prNumber}/${pr.head.sha}.json`;
              let opsSha;
              let envelope;
              const rawAt = async (path, ref) => {
                requireThat(/^delivery\/[A-Za-z0-9_.\/-]+$/.test(path) && !path.split('/').includes('..'), 'Unsafe evidence path');
                const {data} = await github.rest.repos.getContent({owner, repo, path, ref});
                requireThat(!Array.isArray(data) && data.type === 'file' && data.encoding === 'base64', 'Evidence is not a regular JSON/text blob');
                requireThat(data.size > 0 && data.size <= 1024 * 1024, 'Published evidence must be 1 byte to 1 MiB');
                const bytes = Buffer.from(data.content, 'base64');
                requireThat(bytes.length === data.size, 'Incomplete evidence bytes');
                return bytes;
              };
              // A group SHA exists only after enqueueing. Give the local coordinator
              // up to 20 minutes to execute/publish focused integration checks.
              // No receipt, expired group, missing tests or unknown outcomes => fail.
              const deadline = Date.now() + (groupSha ? 20 * 60 * 1000 : 0);
              for (;;) {
                opsSha = (await github.rest.git.getRef({owner, repo, ref: 'heads/codex/lab-state'})).data.object.sha;
                try { envelope = JSON.parse((await rawAt(envelopePath, opsSha)).toString('utf8')); break; }
                catch (error) {
                  if (error.status !== 404 || Date.now() >= deadline) throw error;
                  await new Promise(resolve => setTimeout(resolve, 30000));
                }
              }
              requireThat(envelope.schema === 'uor-r4.server-delivery/1', 'Unsupported server envelope');
              requireThat(Array.isArray(envelope.evidence) && envelope.evidence.length <= 100, 'Invalid evidence inventory');
              const evidence = new Map();
              for (const item of envelope.evidence) {
                requireThat(nonempty(item.local_path) && typeof item.path === 'string' && hex64.test(item.sha256), 'Malformed evidence mapping');
                requireThat(!evidence.has(item.local_path), 'Duplicate local evidence identity');
                evidence.set(item.local_path, item);
              }
              const verifyEvidence = async e => {
                requireThat(e && nonempty(e.path) && hex64.test(e.sha256), 'Malformed file receipt');
                const mapped = evidence.get(e.path);
                requireThat(mapped && mapped.sha256 === e.sha256, 'Evidence is absent or its digest changed');
                const bytes = await rawAt(mapped.path, opsSha);
                requireThat(digest(bytes) === e.sha256, 'Published evidence digest mismatch');
              };
              const r = envelope.receipt;
              requireThat(r && r.schema === 'uor-r4.delivery-receipt/1' && r.repository === repository && r.pull_request === prNumber,
                'Receipt identity does not match this PR');
              requireThat(r.head_sha === pr.head.sha && r.base_sha === pr.base.sha, 'Stale PR head/base receipt');
              requireThat(nonempty(r.author_session) && Number.isSafeInteger(r.task_issue) && r.task_issue > 0, 'Missing author/task identity');
              requireThat(nonempty(r.claim_session) && Number.isSafeInteger(r.claim_epoch) && r.claim_epoch > 0 && /^sha256:[a-f0-9]{64}$/.test(r.work_card), 'Missing task claim generation');
              requireThat(['A', 'B', 'C'].includes(r.class), 'Invalid delivery class');
              const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: prNumber, per_page: 100});
              requireThat(files.length > 0 && files.length < 3000, 'Incomplete/empty changed-file inventory');
              const paths = files.map(f => f.filename);
              const docsOnly = paths.every(p => p.endsWith('.md') || (p.startsWith('docs/') && p.endsWith('.json')));
              requireThat(docsOnly || r.change_kind !== 'docs', 'Source changes cannot claim docs-only validation');
              const model = paths.some(p => p.endsWith('.rs') && [
                'crates/uor-r4-core/src/native_geometric/', 'crates/uor-r4-stack/src/',
                'crates/uor-r4-training/src/', 'crates/uor-r4-integer/src/', 'crates/uor-r4-api/src/'
              ].some(prefix => p.startsWith(prefix))) || paths.some(p => [
                'src/native_geometric_cli.rs', 'src/service.rs', 'src/native_wasm.rs'
              ].includes(p));
              requireThat(!model || r.change_kind === 'model', 'Model source needs loaded-behavior evidence');
              const sharedPolicy = paths.some(p => p === 'AGENTS.md' || p === 'docs/integration/DECISIONS.md' ||
                p.startsWith('docs/integration/agent-execution-policy') || p === 'docs/labs/protocol.md' ||
                p === 'docs/labs/operations.md' || p.startsWith('tools/lab-runner/src/') || p.startsWith('.github/workflows/'));
              requireThat(!sharedPolicy || r.class === 'C', 'Shared policy/workflow change requires council class C');
              const minimum = {
                docs: ['diff-check', 'claim-wording'],
                code: ['diff-check', 'format', 'compile', 'focused-tests'],
                model: ['diff-check', 'format', 'compile', 'focused-tests', 'loaded-behavior']
              }[r.change_kind];
              requireThat(minimum && Array.isArray(r.checks) && r.checks.length <= 100, 'Invalid check inventory');
              const checks = new Set();
              for (const c of r.checks) {
                requireThat(c.head_sha === r.head_sha && c.base_sha === r.base_sha, 'Stale executable check');
                requireThat(nonempty(c.name) && !checks.has(c.name), 'Duplicate/empty check name');
                requireThat(c.outcome === 'PASS' && c.exit_code === 0 && Array.isArray(c.argv) && nonempty(c.argv[0]),
                  'A check is failed, unrun, unknown or missing its command');
                await verifyEvidence(c.log); checks.add(c.name);
              }
              requireThat(minimum.every(n => checks.has(n)), 'Missing required local executable checks');
              requireThat(Array.isArray(r.reviews) && r.reviews.length > 0 && r.reviews.length <= 20, 'Independent review is missing');
              const reviewers = new Set(); const reviewIds = new Set();
              for (const review of r.reviews) {
                requireThat(review.head_sha === r.head_sha && review.base_sha === r.base_sha, 'Stale review');
                requireThat(nonempty(review.review_id) && !reviewIds.has(review.review_id), 'Duplicate review ID');
                requireThat(nonempty(review.reviewer_session) && review.reviewer_session !== r.author_session && nonempty(review.launched_by), 'Self-review or missing review provenance');
                requireThat(review.decision === 'APPROVE' && review.unresolved_required_fixes === 0, 'Unresolved required review fixes');
                await verifyEvidence(review.evidence); reviewers.add(review.reviewer_session); reviewIds.add(review.review_id);
              }
              if (r.class === 'B' || r.change_kind === 'model' || r.result_evidence) {
                requireThat(reviewers.has(r.result_reader_session) && r.result_reader_session !== r.author_session, 'Result reader is not an independent reviewer');
                await verifyEvidence(r.result_evidence);
              }
              if (r.class === 'C') {
                const c = r.council;
                requireThat(c && nonempty(c.decision_id) && c.head_sha === r.head_sha && c.base_sha === r.base_sha && Array.isArray(c.votes) && c.votes.length === 3, 'Missing/stale council decision');
                await verifyEvidence(c.evidence);
                const voters = new Set(); let yes = 0; let nonauthors = 0;
                for (const vote of c.votes) {
                  requireThat(nonempty(vote.reviewer_session) && !voters.has(vote.reviewer_session) && nonempty(vote.reasons), 'Duplicate or undocumented council seat');
                  requireThat(['APPROVE', 'REJECT'].includes(vote.decision), 'Invalid council vote');
                  voters.add(vote.reviewer_session); yes += Number(vote.decision === 'APPROVE');
                  nonauthors += Number(vote.reviewer_session !== r.author_session);
                }
                requireThat(yes >= 2 && nonauthors >= 2, 'Council requires 2/3 and two non-author seats');
              }
              const task = await github.graphql(`query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){issue(number:$number){state blockedBy(first:100){nodes{state} pageInfo{hasNextPage}}}}}`, {owner, repo, number: r.task_issue});
              const issue = task.repository.issue;
              requireThat(issue && issue.state === 'OPEN' && !issue.blockedBy.pageInfo.hasNextPage && issue.blockedBy.nodes.every(n => n.state === 'CLOSED'), 'Task is unavailable or has unresolved native blockers');

              if (groupSha) {
                const g = envelope.integration;
                requireThat(g && g.head_sha === groupSha && g.base_sha === r.base_sha && g.pull_request === prNumber && g.pr_head_sha === r.head_sha, 'Missing exact-group integration receipt');
                const queueRules = (await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}', {owner, repo, branch: 'main'})).data;
                const queues = queueRules.filter(x => x.type === 'merge_queue');
                requireThat(queues.length > 0 && queues.every(x => x.parameters.max_entries_to_build === 1 && x.parameters.max_entries_to_merge === 1), 'v1 gate requires a one-PR merge group');
                const queueCommit = (await github.rest.git.getCommit({owner, repo, commit_sha: groupSha})).data;
                const mergeRef = (await github.rest.git.getRef({owner, repo, ref: `pull/${prNumber}/merge`})).data;
                const mergeCommit = (await github.rest.git.getCommit({owner, repo, commit_sha: mergeRef.object.sha})).data;
                requireThat(queueCommit.parents[0]?.sha === r.base_sha && mergeCommit.parents[0]?.sha === r.base_sha && queueCommit.tree.sha === mergeCommit.tree.sha,
                  'Queue candidate differs from the reviewed single-PR integration tree');
                requireThat(Array.isArray(g.checks) && g.checks.length > 0 && g.checks.length <= 100, 'No actual group integration checks');
                const integrationNames = new Set();
                for (const c of g.checks) {
                  requireThat(c.head_sha === groupSha && c.base_sha === r.base_sha && c.outcome === 'PASS' && c.exit_code === 0 && Array.isArray(c.argv) && nonempty(c.argv[0]), 'Group check is stale, failed or unavailable');
                  requireThat(nonempty(c.name) && !integrationNames.has(c.name), 'Duplicate integration check');
                  await verifyEvidence(c.log); integrationNames.add(c.name);
                }
                requireThat(integrationNames.has('integration-check'), 'Focused integration-check receipt required');
              } else {
                requireThat(!envelope.integration, 'PR gate cannot substitute a group receipt');
              }
              // Re-read identities immediately before publication. Never mark an old
              // source receipt successful on a newer PR or changed base.
              const currentOpsSha = (await github.rest.git.getRef({owner, repo, ref: 'heads/codex/lab-state'})).data.object.sha;
              const stateResponse = await github.rest.repos.getContent({owner, repo, path: 'state.json', ref: currentOpsSha});
              const stateBlob = stateResponse.data;
              requireThat(!Array.isArray(stateBlob) && stateBlob.type === 'file' && stateBlob.encoding === 'base64' && stateBlob.size > 0 && stateBlob.size <= 1024 * 1024, 'Current coordination state is unavailable or oversized');
              const stateBytes = Buffer.from(stateBlob.content, 'base64');
              requireThat(stateBytes.length === stateBlob.size, 'Incomplete coordination state');
              const state = JSON.parse(stateBytes.toString('utf8'));
              const serverNow = Math.floor(Date.parse(stateResponse.headers.date) / 1000);
              requireThat(Number.isSafeInteger(serverNow) && state.schema === 'uor-r4.lab-state/1' && state.repository === repository, 'Invalid server time or coordination identity');
              const claim = state.tasks?.[String(r.task_issue)];
              const steward = state.labs?.[r.claim_session];
              requireThat(claim && claim.session === r.claim_session && claim.epoch === r.claim_epoch && claim.work_card === r.work_card && hex40.test(claim.policy_sha) && claim.policy_sha === state.policy_sha && claim.phase === 'claimed' && Number.isSafeInteger(claim.expires) && claim.expires > serverNow, 'Task claim expired or changed');
              const policyComparison = (await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {owner, repo, basehead: `${state.policy_sha}...main`})).data;
              const policyPaths = p => p === 'AGENTS.md' || p === 'docs/integration/DECISIONS.md' || p.startsWith('docs/integration/agent-execution-policy.') || (p === 'docs/labs/protocol.md' || p === 'docs/labs/operations.md');
              requireThat(['ahead','identical'].includes(policyComparison.status) && Array.isArray(policyComparison.files) && policyComparison.files.length < 300 && !policyComparison.files.some(f => [f.filename,f.previous_filename].filter(Boolean).some(policyPaths)), 'Policy changed or comparison unavailable; hold delivery for reviewed migration');
              requireThat(steward && steward.available === true && Number.isSafeInteger(steward.heartbeat) && steward.heartbeat <= serverNow && steward.heartbeat + 1200 > serverNow, 'Delivery steward is unavailable or stale');
              const latest = (await github.rest.pulls.get({owner, repo, pull_number: prNumber})).data;
              requireThat(latest.head.sha === r.head_sha && latest.base.sha === r.base_sha && latest.state === 'open' && !latest.draft, 'PR changed during validation');
              await publish('success', groupSha ? 'Exact group integration, review and local-check evidence verified' : 'Exact-head review and local-check evidence verified');
              await core.summary.addHeading('Delivery evidence verified').addRaw(`Operational snapshot: ${opsSha}\n\nTarget: ${statusSha}\n\nThis verified recorded local execution evidence; it did not run model tests. Shared-account reviewer independence remains procedural.`).write();
            } catch (error) {
              if (statusSha) await publish('failure', `Evidence gate failed: ${error.message}`).catch(() => {});
              core.setFailed(error.message);
            }
