name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    # PAUSED (owner decision, Casey, 15 October 2026): skip, do not fail. #2345 retired the core
    # modules both browser engines were built on (the legacy R4G1/router engine and the old
    # native-geometric model), so no current engine can be built for wasm32; and serving a model in
    # the browser is CPU model compute, which D24 forbids until a D11-compliant served model exists
    # (M4 #2032). Every deploy replaces gh-pages wholesale (`clean: true`, `single-commit`), so this
    # job stays skipped to keep the last good site (13 October 18:28Z, pre-#2345) live. Re-enable by
    # removing this `if` in the PR that lands a D11 served wasm engine.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Build WebAssembly package
        run: wasm-pack build crates/uor-r4-wasm-router --target web -- --locked

      - name: Prepare deployment folder
        run: |
          mkdir dist
          cp web/studio/index.html web/studio/index.css web/studio/geometric_prime_router_webapp.html dist/
          cp web/studio/coi-serviceworker.js web/studio/r4_worker.js dist/ || true
          cp -r web/studio/assets dist/ || true
          cp -r crates/uor-r4-wasm-router/pkg dist/
          rm -f dist/pkg/.gitignore

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          # gh-pages is a build output, not a work branch: every push to main
          # rebuilds it, and single-commit replaces it with one fresh commit
          # instead of adding to its history (owner, 9 October 2026).
          single-commit: true
