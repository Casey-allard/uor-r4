name: harness

# The research harness is a standard-library Python tool: no Rust toolchain, no
# fetch, a few seconds of runtime. It is path-filtered so it never competes with
# the shared `required-transport` runner slot on unrelated PRs.
on:
  pull_request:
    paths:
      - 'scripts/harness/**'
      - 'docs/harness/**'
      - 'tests/harness/**'
      - '.github/workflows/harness.yml'
  workflow_dispatch:

permissions:
  contents: read
  # the reconciliation step reads the live milestone issues; nothing is written
  issues: read
  pull-requests: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness rules and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Harness rules
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 -V
          python3 scripts/harness/cli.py check

      - name: Reconcile with live GitHub
        # The harness registry is a cache of the milestone contract. This step fails the PR when
        # the registry disagrees with the live issues, which is what makes `main` converge no
        # matter which lab opened the pull request. It reads GitHub and writes nothing.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/harness/cli.py check --only status.registry_vs_github

      - name: Harness tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/harness -t . -v 2>&1 | tee "$RUNNER_TEMP/harness-tests.txt"
          {
            echo '### Harness rule and test results'
            echo '```text'
            tail -20 "$RUNNER_TEMP/harness-tests.txt"
            echo '```'
            echo 'These checks cover the harness tooling only. They are not model compute,'
            echo 'not a language result, and not a capability claim.'
          } >> "$GITHUB_STEP_SUMMARY"
