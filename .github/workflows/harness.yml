name: harness

# The research harness is Rust only (`crates/uor-r4-harness`, the `uor-harness` binary). The
# owner retired the Python mirror on 20 October 2026 (D27, CHARTER §3.11: "rust only"); its
# source is kept byte-identical under `archive/scripts/harness/` and nothing here runs it.
#
# Path-filtered so it never competes with the shared `required-transport` runner slot
# on unrelated PRs.
on:
  pull_request:
    paths:
      - 'docs/harness/**'
      - 'crates/uor-r4-harness/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/harness.yml'
  workflow_dispatch:

permissions:
  contents: read
  # the reconciliation step reads the live milestone issues; nothing is written
  issues: read
  pull-requests: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    # A longer timeout than a script would need because it compiles; still short, because the
    # crate depends only on regex and serde.
    name: harness rules and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            local/harness-target
          key: cargo-harness-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-harness-${{ runner.os }}-

      - name: Format
        # CARGO_TARGET_DIR is set for every cargo invocation: this checkout's `target`
        # is a symlink in the owner's working copy and must never be relied on.
        env:
          CARGO_TARGET_DIR: local/harness-target
        run: cargo fmt -p uor-r4-harness -- --check

      - name: Clippy
        env:
          CARGO_TARGET_DIR: local/harness-target
        run: cargo clippy -p uor-r4-harness --locked --all-targets -- -D warnings

      - name: Harness tests
        env:
          CARGO_TARGET_DIR: local/harness-target
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p uor-r4-harness 2>&1 | tee "$RUNNER_TEMP/harness-tests.txt"
          {
            echo '### Harness test results'
            echo '```text'
            grep -E '^test result' "$RUNNER_TEMP/harness-tests.txt" || true
            echo '```'
            echo 'These checks cover the harness tooling only. They are not model compute,'
            echo 'not a language result, and not a capability claim.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Harness rules
        # Every machine-checkable rule; exits 1 on any error-severity finding.
        env:
          CARGO_TARGET_DIR: local/harness-target
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo build --locked -p uor-r4-harness
          ./local/harness-target/debug/uor-harness check

      - name: Reconcile with live GitHub
        # The harness registry is a cache of the milestone contract. This step compares the
        # registry with the newest status card on each live milestone issue and reports a
        # divergence; it reads GitHub and writes nothing.
        env:
          CARGO_TARGET_DIR: local/harness-target
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./local/harness-target/debug/uor-harness check --only status.registry_vs_github

      - name: The ledger may grow and may never shrink
        # A ledger shard is the cumulative record, sharded per lab so concurrent writers never
        # contend. Sharding fixes WRITE contention, not MERGE contention, which is where the loss
        # actually happened: #2305's merge dropped two of Kimi's receipts from the kimi shard and
        # they had to be restored by hand (#2028 comment 6139538248, at least the fourth
        # shared-store clobber in one day).
        #
        # The comparison is a MULTISET, not a set: duplicate receipts are normal here (the kimi
        # shard holds 8, `unknown` holds 18 of 24) because the same action recorded twice in one
        # second is byte-identical. A set comparison would miss deleting one of a pair.
        #
        # Reordering is allowed - a branch that appends and resorts loses nothing. The rule is
        # "no receipt disappears", because a guard that fires on safe changes gets disabled.
        env:
          CARGO_TARGET_DIR: local/harness-target
        shell: bash
        run: |
          set -euo pipefail
          # origin/main must exist locally, or the check has nothing to compare against and
          # would report a clean result from an empty comparison. A guard that passes because it
          # could not look is worse than no guard.
          # Plain fetch, NOT `--depth=1 main:refs/remotes/origin/main`: the shallow-refspec form
          # DELETED the remote-tracking refs here and left the check with no comparison point.
          git fetch --no-tags origin main
          git rev-parse --verify "origin/main^{commit}" >/dev/null
          ./local/harness-target/debug/uor-harness shard-check --repo . --base origin/main
