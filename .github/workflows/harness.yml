name: harness

# The research harness is being ported to Rust (owner decision, 13 October 2026, D27:
# Rust is the default for all new code including tooling). The Python tool remains
# authoritative and keeps running here; the Rust crate is checked alongside it, and
# `parity.py` fails the build when the two disagree about the shared record.
#
# The format check itself is Rust (`crates/uor-r4-harness`): D27 puts new tooling there, and the
# Python duplicate was removed. The `rust-harness` job builds the binary and then runs the rule that
# needs it, so the check executes in CI rather than only locally.
#
# Path-filtered so it never competes with the shared `required-transport` runner slot
# on unrelated PRs.
on:
  pull_request:
    paths:
      - 'scripts/harness/**'
      - 'docs/harness/**'
      - 'tests/harness/**'
      - 'crates/uor-r4-harness/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/harness.yml'
  workflow_dispatch:

permissions:
  contents: read
  # the reconciliation step reads the live milestone issues; nothing is written
  issues: read
  pull-requests: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness rules and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Harness rules
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 -V
          python3 scripts/harness/cli.py check

      - name: Reconcile with live GitHub
        # The harness registry is a cache of the milestone contract. This step fails the PR when
        # the registry disagrees with the live issues, which is what makes `main` converge no
        # matter which lab opened the pull request. It reads GitHub and writes nothing.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/harness/cli.py check --only status.registry_vs_github

      - name: Harness tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/harness -t . -v 2>&1 | tee "$RUNNER_TEMP/harness-tests.txt"
          {
            echo '### Harness rule and test results'
            echo '```text'
            tail -20 "$RUNNER_TEMP/harness-tests.txt"
            echo '```'
            echo 'These checks cover the harness tooling only. They are not model compute,'
            echo 'not a language result, and not a capability claim.'
          } >> "$GITHUB_STEP_SUMMARY"

  rust-harness:
    # The Rust side of the port. It reads the same frozen contract and must agree with
    # Python about the shared record, so this job both builds it and runs the parity
    # check against the Python implementation. A longer timeout than the Python job
    # because it compiles; still short, because the crate depends only on serde.
    name: Rust harness and Python parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            local/harness-target
          key: cargo-harness-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-harness-${{ runner.os }}-

      - name: Format
        # CARGO_TARGET_DIR is set for every cargo invocation: this checkout's `target`
        # is a symlink in the owner's working copy and must never be relied on.
        env:
          CARGO_TARGET_DIR: local/harness-target
        run: cargo fmt -p uor-r4-harness -- --check

      - name: Clippy
        env:
          CARGO_TARGET_DIR: local/harness-target
        run: cargo clippy -p uor-r4-harness --locked --all-targets -- -D warnings

      - name: Rust harness tests
        env:
          CARGO_TARGET_DIR: local/harness-target
        run: cargo test --locked -p uor-r4-harness

      - name: Python and Rust agree about the shared record
        # The point of the port: two implementations, one contract. This compares
        # structured output across every format, the ledger roll-up and the presence
        # board, plus controlled cases with verdicts known in advance - so it proves
        # both implementations REJECT the same things, not merely that both can read a
        # valid file.
        env:
          CARGO_TARGET_DIR: local/harness-target
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p uor-r4-harness
          python3 scripts/harness/parity.py --json | tee "$RUNNER_TEMP/parity.json"
          {
            echo '### Rust/Python harness parity'
            echo '```json'
            cat "$RUNNER_TEMP/parity.json"
            echo '```'
            echo 'Agreement about reading state. The Python harness still owns behaviour.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Harness rules with the Rust binary present
        # `check` includes `harness.state_formats`, which the Rust implementation performs. The
        # `harness` job runs `check` without a binary and skips that one rule; here it runs for real.
        env:
          CARGO_TARGET_DIR: local/harness-target
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/harness/cli.py check --only harness.state_formats
