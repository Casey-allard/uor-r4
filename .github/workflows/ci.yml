name: ci

# Pre-alpha verification is issue-scoped: developers compile and run the path
# they changed instead of paying for the full release ladder on every PR.
# Pull-request and merge-group events run native architecture and product-path checks plus the five
# historical status names required by the immutable ruleset. The full release
# workflow remains available when the implemented product reaches that stage.
on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      qa_scope:
        description: 'Explicit QA scope; use release_qa only when preparing to ship'
        required: true
        default: none
        type: choice
        options:
          - none
          - product_path
          - release_qa
      decision_reason:
        description: 'Why this QA run can change the next project decision'
        required: true
        default: 'No QA requested'
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fast-gate:
    name: fast build + product smoke
    if: github.event_name == 'workflow_dispatch' && inputs.qa_scope == 'product_path'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the change
        id: scope
        run: |
          git fetch --no-tags origin main
          BASE_SHA="$(git merge-base origin/main HEAD || true)"
          if [ -z "$BASE_SHA" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No merge base was available; compiling fail-closed."
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD || true)"
          printf '%s\n' "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No diff was available; compiling fail-closed."
            exit 0
          fi
          CODE="$(printf '%s\n' "$CHANGED" | grep -E '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|^rust-toolchain\.toml$|^docs/hologram_r4_formal_monograph\.md$|^docs/transformerless/INFERENCE_OPERATION_CONTRACT\.md$)' || true)"
          if [ -n "$CODE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Rust/build-relevant paths changed; running the fast compile and product smoke."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No Rust/build-relevant path changed; skipping compilation."
          fi

      - name: Claim-wording gate
        run: python3 scripts/check_claim_wording.py

      - name: Install Rust (stable)
        if: steps.scope.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-fast-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-fast-${{ runner.os }}-

      - name: cargo fmt --check
        if: steps.scope.outputs.code == 'true'
        run: cargo fmt --check

      - name: cargo check --workspace --all-targets
        if: steps.scope.outputs.code == 'true'
        run: cargo check --workspace --all-targets

      - name: cargo test --workspace --lib
        if: steps.scope.outputs.code == 'true'
        run: cargo test --workspace --lib

  # Ruleset transport only. The repository setting still expects these five
  # historical names. The first job checks the native architecture contract and
  # changed geometric paths; this is not the deferred full release ladder.
  required-core-transport:
    name: fmt / clippy / tests / no_std / κ
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Cache native check dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-native-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-native-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      - name: Native geometric architecture policy
        run: cargo run --locked -p uor-r4-core --bin r4-policy-check -- .

      - name: Native fitting, artifact and runtime checks
        run: cargo test --locked -p uor-r4-core --lib native_geometric

      - name: Configurable geometric context
        run: cargo test --locked -p uor-r4-core --test windowed_geometric_context

      - name: Native kernel allocation census
        run: cargo test --locked -p uor-r4-core --test native_geometric_allocations

      - name: Native CLI checks
        run: cargo test --locked --bin r4 native_geometric_

  required-audit-transport:
    name: cargo audit
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge deferred release audit
        run: echo "Ruleset transport only; no dependency audit ran."

  required-fuzz-transport:
    name: fuzz smoke (nightly libfuzzer)
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge deferred release fuzzing
        run: echo "Ruleset transport only; no fuzzing ran."

  required-wasm-transport:
    name: wasm-pack build (dashboard facade, deploy.yml parity)
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge deferred release WASM build
        run: echo "Ruleset transport only; no WASM build ran."

  required-gate-c-transport:
    name: Gate C trend alarm
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge deferred release model evaluation
        run: echo "Ruleset transport only; no Gate C or model evaluation ran."

  # Full certification is retained for an explicit product-release decision.
  gates:
    name: "nightly certification: core ladder"
    if: github.event_name == 'workflow_dispatch' && inputs.qa_scope == 'release_qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Claim-wording gate (docs/formal_vocabulary.md §2.1, issue #123)
        run: python3 scripts/check_claim_wording.py

      # #787: honest name — this exercises the audit ENGINE against
      # reference fixtures; the real #160 disassembly/dependency audit of
      # the release binary has not landed, and the operation-set guarantee
      # rests on the P-4 source-scan witnesses until it does.
      - name: Inference audit engine self-test (source-witness level; #160 disassembly audit pending)
        run: cargo test -p uor-r4-proof-model --lib inference_audit

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: cargo nextest run --workspace
        run: cargo nextest run --workspace -E 'not binary(bdd)'

      - name: cucumber BDD suite (own runner, not nextest-compatible)
        run: cargo test --test bdd

      - name: cargo test --doc
        run: cargo test --doc --workspace

      - name: no_std ladder (graph-format)
        run: |
          cargo check -p uor-r4-graph-format --no-default-features
          cargo check -p uor-r4-graph-format --no-default-features --features alloc

      - name: Deterministic rebuild (Gate E slice)
        run: cargo test -p uor-r4-core --test deterministic_rebuild_test -- --nocapture

      - name: Cache κ checkpoint (stories15M)
        uses: actions/cache@v4
        with:
          path: /tmp/ref
          key: kappa-checkpoint-stories15m-v1

      - name: Download κ checkpoint if not cached
        run: |
          if [ ! -f /tmp/ref/out/model.bin ]; then
            curl -sL -o /tmp/run.com https://github.com/trholding/llama2.c/releases/download/experimental/run.com
            cd /tmp && unzip -o run.com out/model.bin tokenizer.bin -d ref
          fi
          ls -la /tmp/ref/out/model.bin

      - name: κ-reproduction (canonical D2 baseline)
        run: TLESS_CANONICAL_DETERMINISTIC=1 TLESS_CHECKPOINT=/tmp/ref/out/model.bin cargo test -p uor-r4-core --release --test kappa_reproduction -- --ignored

  wasm:
    name: "nightly certification: wasm-pack build"
    if: github.event_name == 'workflow_dispatch' && inputs.qa_scope == 'release_qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: wasm-pack build --target web
        run: wasm-pack build --target web

  gate-c-trend:
    name: "nightly certification: Gate C trend alarm"
    if: github.event_name == 'workflow_dispatch' && inputs.qa_scope == 'release_qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Gate C trend check vs pinned record
        run: bash scripts/gate_c_trend.sh
      - name: Upload trend artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-trend-${{ github.sha }}
          path: /tmp/gate_c_trend.jsonl
          retention-days: 90

  audit:
    name: "nightly certification: cargo audit"
    if: github.event_name == 'workflow_dispatch' && inputs.qa_scope == 'release_qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz-smoke:
    name: "nightly certification: fuzz smoke"
    if: github.event_name == 'workflow_dispatch' && inputs.qa_scope == 'release_qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Cache fuzz build
        uses: actions/cache@v4
        with:
          path: crates/uor-r4-graph-format/fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('crates/uor-r4-graph-format/fuzz/Cargo.toml') }}
          restore-keys: fuzz-${{ runner.os }}-

      - name: fuzz parse_arbitrary (60s)
        working-directory: crates/uor-r4-graph-format
        # +nightly explicitly: rust-toolchain.toml pins stable for plain `cargo`
        run: cargo +nightly fuzz run parse_arbitrary -- -max_total_time=60 -print_final_stats=1

      - name: fuzz mutate_valid (60s)
        working-directory: crates/uor-r4-graph-format
        run: cargo +nightly fuzz run mutate_valid -- -max_total_time=60 -print_final_stats=1

  # D2 acceptance evidence (issue #265): compile one immutable HF source with
  # the portable teacher/math path on Linux and macOS, then compare every
  # source and emitted-bundle byte. This is separate from the historical
  # macOS-pinned kappa reproduction and does not repin a shipped fixture.
  d2-differential:
    name: D2 canonical differential (${{ matrix.os }})
    # Explicit release-QA only. Its ~hour corpus compile is certification
    # evidence, never an automatic development or merge requirement.
    if: github.event_name == 'workflow_dispatch' && inputs.qa_scope == 'release_qa'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: d2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: d2-${{ runner.os }}-

      # Cache the compiled D2 manifest (the artifact the compare job consumes),
      # so an unchanged compile path skips the ~hour corpus compile. The key is
      # deliberately CONSERVATIVE — any first-party Rust source, Cargo.lock, or
      # the D2 script busts it — so a cache hit can never mask a change to the
      # compiled bytes. (A narrower, compile-path-scoped key is unsafe here: the
      # teacher/compiler and unrelated code share crates, and Rust builds are
      # not byte-reproducible, so it could silently skip a real determinism
      # regression.) Cross-OS byte equality is still asserted by the compare
      # job on the restored manifests. An explicit release run always
      # re-verifies against runner/toolchain drift, not only source.
      - name: Restore cached D2 manifest
        id: d2_manifest_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/d2-manifest.json
          key: d2-manifest-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**/*.rs', 'crates/**/*.rs', 'scripts/d2_differential_compile.sh') }}

      - name: Run canonical differential compile
        if: steps.d2_manifest_cache.outputs.cache-hit != 'true'
        env:
          D2_SOURCE_DIR: ${{ runner.temp }}/d2-source
          D2_OUTPUT_DIR: ${{ runner.temp }}/d2-output
          D2_MANIFEST: ${{ runner.temp }}/d2-manifest.json
          D2_TARGET: '1000'
        run: bash scripts/d2_differential_compile.sh

      - name: Upload D2 manifest
        uses: actions/upload-artifact@v4
        with:
          name: d2-manifest-${{ matrix.os }}
          path: ${{ runner.temp }}/d2-manifest.json
          retention-days: 30

  d2-differential-compare:
    name: D2 differential equality
    if: github.event_name == 'workflow_dispatch' && inputs.qa_scope == 'release_qa'
    needs: d2-differential
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download D2 manifests
        uses: actions/download-artifact@v4
        with:
          pattern: d2-manifest-*
          path: ${{ runner.temp }}/d2-manifests

      - name: Compare source and output bytes
        run: |
          python3 - "${RUNNER_TEMP}/d2-manifests" <<'PY'
          import json
          import pathlib
          import sys

          manifests = sorted(pathlib.Path(sys.argv[1]).glob("*/d2-manifest.json"))
          if len(manifests) != 2:
              raise SystemExit(f"expected two D2 manifests, found {len(manifests)}")

          payloads = [json.loads(path.read_text()) for path in manifests]
          if payloads[0]["revision"] != payloads[1]["revision"]:
              raise SystemExit("D2 manifests use different source revisions")
          for key in ("source", "output"):
              if payloads[0][key] != payloads[1][key]:
                  raise SystemExit(f"D2 {key} bytes differ across platforms")

          print(
              "D2 canonical compile matched on "
              f"{payloads[0]['architecture']} and {payloads[1]['architecture']}: "
              f"{len(payloads[0]['output'])} emitted files"
          )
          PY

  # #273 template adoption: the register conformance gate. R1/R2/R3 landed in
  # Phase 1; #510 adds R4 (deferral, with the open-claim carve-out), R5
  # (audit-limits) and R6 (cargo-deny over the real graph). R5's incremental
  # migration is COMPLETE (graph-cli hit 0 in #587): every shipped crate's
  # Result error surface now names only the four sanctioned types, and
  # audit-limits is enforced here. Promoting this job to a required status
  # check is a repo-admin branch-protection toggle. It is retained in nightly
  # certification and can be dispatched manually.
  register-conformance:
    name: register conformance (R1/R2/R3/R4/R5/R6, #273 + #510)
    if: github.event_name == 'workflow_dispatch' && inputs.qa_scope == 'release_qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: R1 check-model + R2/R3 register BDD
        run: |
          cargo run -q -p xtask -- check-model
          cargo test -q -p repo-conformance
      - name: R4 audit-deferral (nothing deferred and unregistered)
        run: cargo run -q -p xtask -- audit-deferral
      - name: R5 audit-limits (every shipped Result names only sanctioned error types)
        run: cargo run -q -p xtask -- audit-limits
      - name: R6 cargo-deny (advisories, licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # #515 preserve-and-gate: the dormant mechanisms retained off the serving path
  # are compiled behind default-off cargo features (one per `open` ledger claim).
  # The shipped default build never touches them, so a normal `cargo build` /
  # nextest run cannot catch bit-rot in a dormant module or its gated tests.
  # This job turns every feature ON and (a) does a real codegen+link build so the
  # gated code cannot silently stop compiling, and (b) EXECUTES the gated tests
  # (the default nextest run in `gates` uses default features, so those tests
  # never otherwise run). This is nightly/manual compatibility evidence, not a
  # merge requirement while the product path is under active construction.
  all-features:
    name: all-features build + gated dormant tests (#515)
    if: github.event_name == 'workflow_dispatch' && inputs.qa_scope == 'release_qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo build --workspace --all-features
        run: cargo build --workspace --all-features

      - name: cargo test --workspace --all-features (runs the dormant-mechanism gated tests)
        run: cargo test --workspace --all-features
